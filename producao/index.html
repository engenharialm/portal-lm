    tr.querySelector(".at").textContent = at ? fmtQ(at) : "—"; tr.querySelector(".sd").textContent = fmtQ(r2((i.qtd-at)*1000)/1000);
    tr.querySelector(".vl").textContent = q ? fmtR(r2(q*i.pu)) : "—"; tr.classList.toggle("estouro", i.qtd - at < -0.0005);
  });
  const vc = valorContrato(c), v = valorMed(m,c), antV = r2(S.ext.meds.filter(x => x.numero < m.numero).reduce((s,x) => s + valorMed(x,c), 0));
  $("#medTot").textContent = fmtR(v); $("#medAcum").textContent = fmtR(r2(antV+v)); $("#medSaldo").textContent = fmtR(r2(vc-antV-v));
}
async function salvarMedicao(){
  const m = S.medDraft;
  if (!syncMedDom()){ toast("Há quantidade que não é número.", true); return; }
  if (m.fim < m.inicio){ toast("O fim do período é antes do início.", true); return; }
  const c = S.ext.contrato;
  const est = c.itens.filter(i => acumAnterior(i.id, m.numero) + Number(m.qtd[i.id] || 0) - i.qtd > 0.0005);
  if (est.length && !confirm(`Atenção: ${est.length} item(ns) passam da quantidade contratada (${est.map(i => i.item).join(", ")}).\nIsso normalmente exige aditivo. Salvar assim mesmo?`)) return;
  const novo = !m.id;
  if (novo){ m.id = uid(); m.criadoEm = agoraIso(); m.historico = [{ data:hoje(), texto:"Medição criada", por:S.nome||"" }]; }
  m.obraNome = obraAtual().nome; m.valor = valorMed(m, c); m.atualizadoEm = agoraIso(); m.atualizadoPor = S.nome || "";
  const b = $("#medSalvar"); if (b){ b.disabled = true; b.textContent = "Salvando..."; }
  try {
    await store.set(COL_MED, m.id, m);
    await loadExtras(true); S.medSel = m.id; S.medDraft = null; renderMedicoes(); toast(novo ? "Medição criada." : "Medição salva.");
  } catch(e){ console.error(e); toast("Erro ao salvar: " + e.message, true); if (novo) m.id = null; if (b){ b.disabled = false; b.textContent = "Salvar medição"; } }
}
async function mudaStatusMed(novoSt, data, texto){
  const m = clone(medAtual());
  m.status = novoSt; m.datas = { ...(m.datas||{}) }; if (data) m.datas[novoSt] = data;
  m.historico = [...(m.historico||[]), { data: data || hoje(), texto, por:S.nome||"" }];
  m.atualizadoEm = agoraIso();
  await store.set(COL_MED, m.id, m);
  await loadExtras(true); S.medDraft = null; renderMedicoes();
}
async function sugerirPeloDiario(){
  const m = S.medDraft; syncMedDom();
  const c = S.ext.contrato, soma = {};
  let seg = mondayOf(m.inicio), semanas = 0, ligadas = 0;
  while (seg <= m.fim){
    const w = await getWeek(S.obraId, seg); semanas++;
    for (const a of Object.values(w.atividades || {})){
      if (!a.itemContrato) continue; ligadas++;
      for (let d = 0; d < 7; d++){
        const dia = addDays(seg, d); if (dia < m.inicio || dia > m.fim) continue;
        const r = val(a.real, d); if (r) soma[a.itemContrato] = (soma[a.itemContrato] || 0) + r;
      }
    }
    seg = addDays(seg, 7);
  }
  const ids = Object.keys(soma).filter(id => c.itens.find(i => i.id === id));
  if (!ids.length){
    toast(ligadas ? "Nenhuma produção lançada no período nas atividades ligadas ao contrato." : "Nenhuma atividade da Programação está ligada a item do contrato. Ligue na aba Programação da semana.", true); return;
  }
  for (const id of ids) m.qtd[id] = r2(soma[id] * 1000) / 1000;
  renderMedEditor(); toast(`${ids.length} item(ns) preenchidos com o realizado do Diário (${semanas} semana${semanas>1?"s":""}). Confira antes de salvar.`);
}

async function exportarBoletim(){
  const c = S.ext.contrato, m = medAtual(), o = obraAtual();

/* ======================================================================
   COMPRAS — requisições, cotação, pedido e recebimento
   ====================================================================== */
const STATUS_REQ = [
  { k:"aberta",    t:"Aberta",            cor:"#FFC14D" },
  { k:"aprovada",  t:"Aprovada",          cor:"#3DF2FF" },
  { k:"cotacao",   t:"Em cotação",        cor:"#00A3DA" },
  { k:"pedido",    t:"Pedido emitido",    cor:"#7B5CFF" },
  { k:"parcial",   t:"Entregue parcial",  cor:"#C792EA" },
  { k:"entregue",  t:"Entregue",          cor:"#2BFF9A" },
  { k:"recusada",  t:"Recusada",          cor:"#FF6B7A" },
  { k:"cancelada", t:"Cancelada",         cor:"#8AA4BC" }
];
const stReq = k => STATUS_REQ.find(s => s.k === k) || STATUS_REQ[0];
const chipReq = k => { const s = stReq(k); return `<span class="chip" style="--c:${s.cor}">${s.t}</span>`; };
const reqFechada = r => ["entregue","recusada","cancelada"].includes(r.status);
const reqAtrasada = r => !reqFechada(r) && r.necessidade && r.necessidade < hoje();
const recebido = (r, k) => (r.recebimentos || []).reduce((s,x) => s + Number(x.qtd?.[k] || 0), 0);

function renderCompras(){
  const el = $("#v-compras");
  if (!S.obraId && !S.reqTodas){ el.innerHTML = semObra(); setSavebar(""); return; }
  if (!S.reqTodas && precisaCarregar(el, renderCompras)) return;

  setSavebar(`<button class="btn pri" id="reqNova">+ Nova requisição</button>`);
  const lista = S.reqTodas ? (S.todasReqs || []) : S.ext.reqs;
  const cont = k => lista.filter(r => r.status === k).length;
  let h = `<div class="pipe">${["aberta","aprovada","cotacao","pedido","parcial"].map(k => { const s = stReq(k); return `<div style="--c:${s.cor}"><span>${s.t}</span><b>${cont(k)}</b></div>`; }).join("")}
    <div style="--c:#FF6B7A"><span>Atrasadas</span><b>${lista.filter(reqAtrasada).length}</b><small>data de necessidade vencida</small></div>
    <div style="--c:#FFC14D"><span>Fora do planejado</span><b>${lista.filter(r => reqFora(r) && reqConta(r)).length}</b><small>${fmtR(r2(lista.filter(r => reqFora(r) && r.pedido && reqConta(r)).reduce((s,r) => s + (Number(r.pedido.valor)||0), 0)))} em pedidos</small></div></div>`;
  h += `<div class="card"><div class="row" style="justify-content:space-between">

      <span class="row">${ehGeral() ? `<button class="btn peq ${S.reqTodas ? "on" : ""}" id="reqTodas">${S.reqTodas ? "Só esta obra" : "Todas as obras"}</button>` : ""}
      <select id="reqFiltro">${[["pendentes","Pendentes"],["atrasadas","Atrasadas"],["fora","Fora do planejado"],["todas","Todas"],...STATUS_REQ.map(s => [s.k, s.t])].map(([k,t]) => `<option value="${k}" ${S.reqFiltro===k?"selected":""}>${t}</option>`).join("")}</select></span></div>`;
  const f = S.reqFiltro;

                   .sort((a,b) => (reqAtrasada(b) - reqAtrasada(a)) || (b.urgente - a.urgente) || (b.criadoEm||"").localeCompare(a.criadoEm||""));
  if (!vis.length) h += `<div class="vazio">Nenhuma requisição ${f === "todas" ? "" : "neste filtro"}.</div>`;
  else {
    h += `<div class="tbwrap"><table class="tb"><thead><tr>${S.reqTodas ? `<th class="l">Obra</th>` : ""}<th>Nº</th><th class="l">Itens</th><th>Pedido em</th><th>Precisa até</th><th>Solicitante</th><th>Situação</th><th>Fornecedor / valor</th><th></th></tr></thead><tbody>`;
    for (const r of vis){
      h += `<tr class="${reqAtrasada(r) ? "atraso" : ""}">${S.reqTodas ? `<td class="l">${esc(r.obraNome||"")}</td>` : ""}<td><b>${r.numero}</b>${r.urgente ? `<br><span class="chip" style="--c:#FF6B7A">urgente</span>` : ""}${reqFora(r) ? `<br><span class="chip" style="--c:#FFC14D">fora do planejado</span>` : ""}</td>
        <td class="l">${r.itens.slice(0,3).map(i => `${esc(i.descricao)} <small>(${fmtQ(i.qtd)} ${esc(i.un)})</small>`).join("<br>")}${r.itens.length > 3 ? `<br><small>+${r.itens.length-3} itens</small>` : ""}</td>
        <td>${fmtBR((r.criadoEm||"").slice(0,10))}</td><td>${r.necessidade ? fmtBR(r.necessidade) + (reqAtrasada(r) ? `<br><small class="neg">atrasada</small>` : "") : "—"}</td>
        <td>${esc(r.solicitante||"")}</td><td>${chipReq(r.status)}</td>
        <td><small>${r.pedido ? esc(r.pedido.fornecedor) + "<br>" + fmtR(r.pedido.valor) : ""}</small></td>
        <td><button class="btn peq" data-reqabre="${r.id}">Abrir</button></td></tr>`;
    }
    h += `</tbody></table></div>`;
  }
  h += `</div>`;
  // resumo de gastos
  const comPedido = lista.filter(r => r.pedido && !["cancelada","recusada"].includes(r.status));
  if (comPedido.length){
    const porForn = {};
    for (const r of comPedido){ const k = r.pedido.fornecedor || "—"; porForn[k] = r2((porForn[k] || 0) + (Number(r.pedido.valor) || 0)); }
    const tot = r2(Object.values(porForn).reduce((s,v) => s + v, 0));
    h += `<div class="card"><h3>Comprado ${S.reqTodas ? "(todas as obras)" : "nesta obra"} — ${fmtR(tot)}</h3>${Object.entries(porForn).sort((a,b) => b[1]-a[1]).map(([f,v]) =>
      `<div class="barlinha"><span>${esc(f)}</span><div class="barra"><i style="width:${tot ? v/tot*100 : 0}%"></i></div><b>${fmtR(v)}</b></div>`).join("")}</div>`;
  }
  if (!S.reqTodas) h += cardInsumos();
  el.innerHTML = h;
}
/* ---- requisição: serviço do contrato → insumo da CPU (orçado × já pedido × saldo) ---- */
const reqConta = r => !["recusada","cancelada"].includes(r.status);
// quanto já foi pedido daquele insumo naquele serviço (requisições válidas desta obra)
function jaPedido(itemC, cod, ignorarId){
  let q = 0;
  for (const r of S.ext.reqs){
    if (!reqConta(r) || r.id === ignorarId) continue;
    for (const l of r.itens) if (l.itemContrato === itemC && l.insumoCod === cod) q += Number(l.qtd) || 0;
  }
  return q;
}
function insumoOrcado(itemC, cod){
  const it = S.ext.contrato?.itens?.find(i => i.id === itemC);
  const ins = it?.insumos?.find(x => x.codigo === cod);
  return ins ? { ...ins, orcado: r2(ins.consumo * it.qtd * 1000) / 1000, item: it } : null;
}
const foraPlan = l => !l.insumoCod || l.excedente;
const reqFora = r => r.itens.some(foraPlan);

function formNovaReq(){
  const c = S.ext.contrato;
  const itens = c?.itens || [];
  S.reqLinhas = S.reqLinhas || [{ itemContrato:"", insumoCod:"", descricao:"", qtd:"", un:"" }];
  const linha = (l, k) => {
    const it = itens.find(i => i.id === l.itemContrato);
    const insOpts = (it?.insumos || []).map(x => `<option value="${esc(x.codigo)}" ${l.insumoCod===x.codigo?"selected":""}>${esc(x.descricao.slice(0,70))} (${esc(x.un)})</option>`).join("");
    let info = "";
    if (l.insumoCod && l.insumoCod !== "__fora"){
      const o = insumoOrcado(l.itemContrato, l.insumoCod);
      if (o){
        const ped = jaPedido(l.itemContrato, l.insumoCod), saldo = r2((o.orcado - ped) * 1000) / 1000, q = num(l.qtd) || 0;
        const passa = q > saldo + 0.0005;
        info = `<div class="orc ${passa ? "passa" : ""}">Orçado <b>${fmtQ(o.orcado)} ${esc(o.un)}</b> · já pedido <b>${fmtQ(ped)}</b> · saldo <b>${fmtQ(saldo)} ${esc(o.un)}</b>
          ${passa ? ` — <b>passa ${fmtQ(r2((q - saldo)*1000)/1000)} ${esc(o.un)} do orçado (fora do planejado)</b>` : ""}</div>`;
      }
    } else if (l.insumoCod === "__fora" || (l.itemContrato === "__fora")){
      info = `<div class="orc passa">Material fora da composição: será marcado como <b>fora do planejado</b> e precisa de justificativa.</div>`;
    }
    const fora = l.insumoCod === "__fora" || l.itemContrato === "__fora";
    return `<div class="rqlin2" data-k="${k}">
      <select data-f="itemContrato"><option value="">1. Serviço do contrato...</option>
        ${itens.map(i => `<option value="${i.id}" ${l.itemContrato===i.id?"selected":""}>${esc(i.item)} — ${esc(i.descricao.slice(0,60))}${i.insumos?.length ? "" : " (sem material na CPU)"}</option>`).join("")}
        <option value="__fora" ${l.itemContrato==="__fora"?"selected":""}>Nenhum serviço / uso geral da obra (fora do planejado)</option></select>
      ${l.itemContrato && l.itemContrato !== "__fora" ? `<select data-f="insumoCod"><option value="">2. Insumo da composição...</option>${insOpts}
        <option value="__fora" ${l.insumoCod==="__fora"?"selected":""}>Outro material (não está na composição)</option></select>` : ""}
      ${fora ? `<input data-f="descricao" placeholder="Material (ex.: ÓLEO DIESEL)" value="${esc(l.descricao)}">` : ""}
      <input data-f="qtd" inputmode="decimal" placeholder="Qtd" value="${esc(l.qtd)}">
      <input data-f="un" list="unidades" placeholder="Un" value="${esc(l.un)}" ${!fora && l.insumoCod ? "readonly" : ""}>
      <button class="x" data-rqrm="${k}" title="Remover">✕</button>
      ${info}</div>`;
  };
  return `<div class="row" style="margin-bottom:10px"><button class="btn peq" id="reqVoltar">‹ Voltar</button></div>
    <div class="card"><h3>Nova requisição de compra — ${esc(obraAtual().nome)}</h3>
    <div class="form">
      <label>Solicitante<input id="rqSol" value="${esc(S.reqCab?.sol ?? S.nome ?? "")}"></label>
      <label>Precisa na obra até<input type="date" id="rqNec" value="${S.reqCab?.nec || addDays(hoje(), 7)}"></label>
      <label class="chk"><input type="checkbox" id="rqUrg" ${S.reqCab?.urg ? "checked" : ""}> Urgente</label>
    </div>
    <h3 style="margin-top:14px">Materiais</h3>
    ${itens.length ? `<p class="nota" style="margin:0 0 8px">Escolha o serviço e depois o insumo da composição: o sistema mostra o orçado e o saldo. O que não estiver na composição, ou passar do saldo, entra como <b>fora do planejado</b>.</p>`
                   : `<p class="nota" style="margin:0 0 8px">Esta obra ainda não tem contrato cadastrado: todos os materiais entram como fora do planejado.</p>`}
    <div id="rqLinhas">${S.reqLinhas.map(linha).join("")}</div>
    <button class="btn peq" id="rqAddLin">+ Material</button>
    <label class="full" style="display:block;margin-top:12px">Observações (especificação, local de entrega, fornecedor sugerido...)<textarea id="rqObs">${esc(S.reqCab?.obs || "")}</textarea></label>
    <label class="full" id="rqJustBox" style="display:${S.reqLinhas.some(l => l.itemContrato === "__fora" || l.insumoCod === "__fora" || linhaPassa(l)) ? "block" : "none"};margin-top:12px">
      Justificativa do fora do planejado (obrigatória)<textarea id="rqJust">${esc(S.reqCab?.just || "")}</textarea></label>
  </div>`;
}
function linhaPassa(l){
  if (!l.insumoCod || l.insumoCod === "__fora") return false;
  const o = insumoOrcado(l.itemContrato, l.insumoCod); if (!o) return false;
  return (num(l.qtd) || 0) > o.orcado - jaPedido(l.itemContrato, l.insumoCod) + 0.0005;
}
function syncReqLinhas(){
  if ($("#rqSol")) S.reqCab = { sol:$("#rqSol").value, nec:$("#rqNec").value, urg:$("#rqUrg").checked, obs:$("#rqObs").value, just:$("#rqJust")?.value || "" };
  S.reqLinhas = $$("#rqLinhas .rqlin2").map(d => { const o = { itemContrato:"", insumoCod:"", descricao:"", qtd:"", un:"" }; d.querySelectorAll("[data-f]").forEach(i => o[i.dataset.f] = i.value.trim()); return o; });
}
// ao trocar serviço/insumo: preenche a unidade e redesenha a linha
document.addEventListener("change", ev => {
  const d = ev.target.closest?.(".rqlin2"); if (!d) return;
  const f = ev.target.dataset.f;
  if (f !== "itemContrato" && f !== "insumoCod") return;
  syncReqLinhas();
  const l = S.reqLinhas[+d.dataset.k];
  if (f === "itemContrato"){ l.insumoCod = ""; l.un = ""; l.descricao = ""; }
  if (f === "insumoCod" && l.insumoCod && l.insumoCod !== "__fora"){ const o = insumoOrcado(l.itemContrato, l.insumoCod); if (o){ l.un = o.un; l.descricao = o.descricao; } }
  if (f === "insumoCod" && l.insumoCod === "__fora"){ l.un = ""; l.descricao = ""; }
  renderReqDetalhe();
});
// ao digitar a quantidade: atualiza o aviso de saldo sem redesenhar
document.addEventListener("input", ev => {
  if (ev.target.dataset?.f !== "qtd" || !ev.target.closest(".rqlin2")) return;
  syncReqLinhas();
  const d = ev.target.closest(".rqlin2"), l = S.reqLinhas[+d.dataset.k];
  const box = d.querySelector(".orc");
  if (box && l.insumoCod && l.insumoCod !== "__fora"){
    const o = insumoOrcado(l.itemContrato, l.insumoCod), ped = jaPedido(l.itemContrato, l.insumoCod), saldo = r2((o.orcado - ped)*1000)/1000, q = num(l.qtd) || 0;
    box.classList.toggle("passa", q > saldo + 0.0005);
    box.innerHTML = `Orçado <b>${fmtQ(o.orcado)} ${esc(o.un)}</b> · já pedido <b>${fmtQ(ped)}</b> · saldo <b>${fmtQ(saldo)} ${esc(o.un)}</b>` +
      (q > saldo + 0.0005 ? ` — <b>passa ${fmtQ(r2((q-saldo)*1000)/1000)} ${esc(o.un)} do orçado (fora do planejado)</b>` : "");
  }
  $("#rqJustBox").style.display = S.reqLinhas.some(x => x.itemContrato === "__fora" || x.insumoCod === "__fora" || linhaPassa(x)) ? "block" : "none";
});
async function salvarNovaReq(){
  syncReqLinhas();
  const itens = [];
  for (const l of S.reqLinhas){
    if (!l.itemContrato && !l.qtd && !l.descricao) continue;
    const q = num(l.qtd);
    const semServ = !l.itemContrato || l.itemContrato === "__fora";
    const outro = semServ || l.insumoCod === "__fora";
    if (!semServ && !l.insumoCod){ toast("Escolha o insumo de cada serviço (ou 'Outro material').", true); return; }
    if (outro && !l.descricao){ toast("Descreva o material fora da composição.", true); return; }
    if (q === null || q <= 0){ toast("Informe a quantidade de cada material.", true); return; }
    const o = !outro ? insumoOrcado(l.itemContrato, l.insumoCod) : null;
    const saldo = o ? o.orcado - jaPedido(l.itemContrato, l.insumoCod) : 0;
    itens.push({ descricao:(o ? o.descricao : l.descricao).toUpperCase(), qtd:q, un:normUn(o ? o.un : (l.un || "un")),
      itemContrato: semServ ? null : l.itemContrato, insumoCod: outro ? null : l.insumoCod,
      orcado: o ? o.orcado : null, saldoAntes: o ? r2(saldo*1000)/1000 : null, excedente: o ? q > saldo + 0.0005 : false });
  }

  if (fora && !just){ toast("Explique por que há material fora do planejado.", true); $("#rqJust").focus(); return; }
  const numero = Math.max(0, ...S.ext.reqs.map(r => r.numero || 0)) + 1;

    urgente:$("#rqUrg").checked, itens, obs:$("#rqObs").value.trim(), foraPlanejado:fora, justificativa: fora ? just : "",
    status:"aberta", cotacoes:[], recebimentos:[], criadoEm:agoraIso(), historico:[{ data:hoje(), texto:"Requisição aberta" + (fora ? " (com material fora do planejado)" : ""), por:sol }] };
  if (!S.nome){ S.nome = sol; localStorage.setItem("diarioLM_nome", sol); }

}
// planejamento de insumos da obra: orçado × requisitado × recebido, por serviço
function cardInsumos(){
  const c = S.ext.contrato; if (!c?.itens?.some(i => i.insumos?.length)) return "";
  const busca = norm(S.insBusca || "");
  let linhas = "", n = 0;
  for (const it of c.itens){
    for (const x of (it.insumos || [])){
      if (busca && !norm(x.descricao + " " + it.descricao + " " + it.item).includes(busca)) continue;
      const orc = r2(x.consumo * it.qtd * 1000) / 1000, ped = jaPedido(it.id, x.codigo);
      let rec = 0;
      for (const r of S.ext.reqs) if (reqConta(r)) r.itens.forEach((l,k) => { if (l.itemContrato === it.id && l.insumoCod === x.codigo) rec += recebido(r,k); });
      const p = orc ? ped / orc : 0;
      if (S.insSoPedidos && !ped) continue;
      n++;
      linhas += `<tr><td>${esc(it.item)}</td><td class="l">${esc(x.descricao)}<br><small>${esc(it.descricao.slice(0,60))}</small></td><td>${esc(x.un)}</td>
        <td>${fmtQ(orc)}</td><td>${ped ? fmtQ(ped) : "—"}</td><td>${rec ? fmtQ(rec) : "—"}</td><td>${fmtQ(r2((orc-ped)*1000)/1000)}</td>
        <td><div class="barra"><i style="width:${Math.min(100,p*100)}%" class="${p > 1.0001 ? "estouro" : ""}"></i></div><small>${ped ? fmtP(p) : ""}</small></td>
        <td>${fmtR(r2(orc * x.pu))}</td></tr>`;
    }
  }
  return `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Insumos planejados (composições do contrato)</h3>
      <span class="row"><label class="row" style="gap:6px"><input type="checkbox" id="insSoPed" ${S.insSoPedidos ? "checked" : ""}> só os já pedidos</label>
      <input id="insBusca" placeholder="Buscar (cimento, brita, CBUQ...)" value="${esc(S.insBusca || "")}" style="min-width:220px"></span></div>
    <div class="tbwrap" style="margin-top:10px;max-height:460px"><table class="tb"><thead><tr><th>Item</th><th class="l">Insumo / serviço</th><th>Un</th><th>Orçado</th><th>Pedido</th><th>Recebido</th><th>Saldo</th><th>%</th><th>Custo orçado</th></tr></thead>
    <tbody>${linhas || `<tr><td colspan="9" class="vazio">Nada encontrado.</td></tr>`}</tbody></table></div>
    <p class="nota">Orçado = consumo da composição × quantidade contratada do serviço (custo direto, sem BDI). Mão de obra e horas de equipamento não entram.</p></div>`;
}

async function gravaReq(r, texto, extra){
  r = { ...r, ...extra, atualizadoEm:agoraIso() };
  if (texto) r.historico = [...(r.historico||[]), { data:hoje(), texto, por:S.nome||"" }];

  await loadExtras(true);
  if (S.reqTodas) S.todasReqs = await store.list(COL_REQ);
  renderCompras();
}

document.addEventListener("click", async ev => {
  const t = ev.target.closest("button,a"); if (!t) return;
  try {
    // contrato
    if (t.id === "ctLer"){ await lerPlanilha(); return; }
    if (t.id === "ctConfirmaImp"){ await salvarImport(); return; }
    if (t.id === "ctReimportar"){ $("#v-contrato").innerHTML = `<div class="card">${formImportar()}</div>`; return; }
    if (t.id === "ctCancelaImp"){ renderContrato(); return; }
    if (t.id === "ctEditar"){ $("#v-contrato").innerHTML = formDados(); return; }
    if (t.id === "cdSalvar"){ await salvarDados(); return; }
    if (t.id === "cdCancelar"){ renderContrato(); return; }
    // medições
    if (t.id === "medNova"){ novaMedicao(); return; }
    if (t.dataset.medabre){ S.medSel = t.dataset.medabre; S.medDraft = null; renderMedicoes(); return; }
    if (t.id === "medVoltar"){ S.medSel = null; S.medDraft = null; renderMedicoes(); return; }
    if (t.id === "medSalvar"){ await salvarMedicao(); return; }
    if (t.id === "medSugerir"){ await sugerirPeloDiario(); return; }
    if (t.id === "medExcel"){ await exportarBoletim(); return; }
    if (t.id === "medTodas"){ S.todasMeds = await store.list(COL_MED); renderMedicoes(); return; }
    if (t.id === "medReabrir"){ ev.preventDefault();
      if (!confirm("Reabrir a medição para corrigir quantidades? Ela volta para 'Em elaboração'.")) return;
      await mudaStatusMed("rascunho", null, "Reaberta para correção"); return; }
    if (t.id === "medAvanca"){
      const m = medAtual(), prox = STATUS_MED[idxMed(m.status) + 1];
      if (S.medDraft && syncMedDom() && JSON.stringify(S.medDraft.qtd) !== JSON.stringify(m.qtd)){ toast("Salve as quantidades antes de mudar a situação.", true); return; }
      await mudaStatusMed(prox.k, $("#medDataSt").value || hoje(), prox.t); toast(`Medição ${m.numero}: ${prox.t}.`); return;
    }
    if (t.id === "medSalvaAcomp"){
      const m = clone(medAtual());
      const pago = $("#medPago").value.trim(), ret = $("#medRet").value.trim();
      if ((pago && num(pago) === null) || (ret && num(ret) === null)){ toast("Valores precisam ser números.", true); return; }
      Object.assign(m, { nf:$("#medNf").value.trim(), valorPago: pago ? num(pago) : null, retencoes: ret ? num(ret) : null, obs:$("#medObs").value.trim(), atualizadoEm:agoraIso() });
      await store.set(COL_MED, m.id, m); await loadExtras(true); S.medDraft = null; renderMedicoes(); toast("Acompanhamento salvo."); return;
    }
    if (t.id === "medExcluir"){
      const m = medAtual();
      if (S.ext.meds.some(x => x.numero > m.numero)){ toast("Só dá para excluir a última medição.", true); return; }
      if (!confirm(`Excluir a medição nº ${m.numero}?`)) return;
      await store.del(COL_MED, m.id); await loadExtras(true); S.medSel = null; S.medDraft = null; renderMedicoes(); toast("Medição excluída."); return;
    }
    // compras
    if (t.id === "reqNova"){ S.reqSel = "nova"; S.reqLinhas = null; renderCompras(); return; }
    if (t.id === "reqVoltar"){ S.reqSel = null; S.pedidoForm = null; renderCompras(); return; }
    if (t.dataset.reqabre){ S.reqSel = t.dataset.reqabre; S.pedidoForm = null; renderCompras(); return; }
    if (t.id === "reqTodas"){ S.reqTodas = !S.reqTodas; if (S.reqTodas) S.todasReqs = await store.list(COL_REQ); renderCompras(); return; }
    if (t.id === "rqAddLin"){ syncReqLinhas(); S.reqLinhas.push({ descricao:"", qtd:"", un:"", itemContrato:"" }); renderReqDetalhe(); return; }
    if (t.dataset.rqrm !== undefined){ syncReqLinhas(); S.reqLinhas.splice(+t.dataset.rqrm, 1); if (!S.reqLinhas.length) S.reqLinhas.push({ descricao:"", qtd:"", un:"", itemContrato:"" }); renderReqDetalhe(); return; }
    if (t.id === "rqSalvar"){ await salvarNovaReq(); return; }
    const r = S.reqSel && S.reqSel !== "nova" ? reqAtual() : null;
    if (!r) return;
    if (t.id === "rqAprovar"){ await gravaReq(r, "Aprovada", { status:"aprovada" }); toast("Requisição aprovada."); return; }
    if (t.id === "rqRecusar"){ const mot = prompt("Motivo da recusa:"); if (mot === null) return; await gravaReq(r, "Recusada: " + mot, { status:"recusada" }); return; }
    if (t.id === "rqCancelar"){ const mot = prompt("Motivo do cancelamento:"); if (mot === null) return; await gravaReq(r, "Cancelada: " + mot, { status:"cancelada" }); return; }
    if (t.id === "ctAdd"){
      const forn = $("#ctForn").value.trim(), v = num($("#ctValor").value);
      if (!forn || v === null){ toast("Informe fornecedor e valor.", true); return; }
      const cot = { fornecedor:forn, valor:v, prazo:$("#ctPrazo").value.trim(), obs:$("#ctObs").value.trim(), data:hoje() };
      await gravaReq(r, `Cotação: ${forn} ${fmtR(v)}`, { cotacoes:[...(r.cotacoes||[]), cot], status:"cotacao" }); return;
    }
    if (t.dataset.cotrm !== undefined){ const cs = [...r.cotacoes]; cs.splice(+t.dataset.cotrm, 1); await gravaReq(r, null, { cotacoes:cs, status: cs.length ? "cotacao" : "aprovada" }); return; }
    if (t.dataset.cotescolhe !== undefined){ S.pedidoForm = { ...r.cotacoes[+t.dataset.cotescolhe] }; renderReqDetalhe(); $("#pdNum")?.focus(); return; }
    if (t.id === "rqPedidoDireto"){ S.pedidoForm = {}; renderReqDetalhe(); $("#pdForn")?.focus(); return; }
    if (t.id === "pdCancelar"){ S.pedidoForm = null; renderReqDetalhe(); return; }
    if (t.id === "pdSalvar"){
      const forn = $("#pdForn").value.trim(), v = num($("#pdValor").value);
      if (!forn || v === null){ toast("Informe fornecedor e valor do pedido.", true); return; }
      const pedido = { fornecedor:forn, valor:v, numero:$("#pdNum").value.trim(), prazo:$("#pdPrazo").value.trim(), condicao:$("#pdCond").value.trim(), data:hoje() };
      S.pedidoForm = null; await gravaReq(r, `Pedido emitido: ${forn} ${fmtR(v)}`, { pedido, status:"pedido" }); toast("Pedido emitido."); return;
    }
    if (t.id === "rcSalvar"){
      const qtd = {}; let erro = false;
      $$("#v-compras tr[data-k] .rcq").forEach(i => { const s = i.value.trim(); if (!s) return; const v = num(s); if (v === null || v < 0){ erro = true; return; } if (v) qtd[i.closest("tr").dataset.k] = v; });
      if (erro){ toast("Quantidade recebida inválida.", true); return; }
      if (!Object.keys(qtd).length){ toast("Informe a quantidade recebida de ao menos um material.", true); return; }
      const rec = { data:$("#rcData").value || hoje(), doc:$("#rcDoc").value.trim(), por:$("#rcPor").value.trim(), obs:$("#rcObs").value.trim(), qtd };
      const recs = [...(r.recebimentos||[]), rec];
      const tudo = r.itens.every((i,k) => recs.reduce((s,x) => s + Number(x.qtd?.[k] || 0), 0) >= i.qtd - 0.0005);
      await gravaReq(r, tudo ? "Recebimento — entrega completa" : "Recebimento parcial", { recebimentos:recs, status: tudo ? "entregue" : "parcial" });
      toast(tudo ? "Entrega completa registrada." : "Recebimento parcial registrado."); return;
    }
  } catch(e){ console.error(e); toast("Erro: " + e.message, true); }
});

function senhaValida(senha, id){
  if (!senha) return true; // sem senha: só a senha geral acessa a obra
  if (senha.length < 4){ toast("A senha da obra precisa ter ao menos 4 caracteres.", true); return false; }
  if (senha === SITE_PASSWORD){ toast("A senha da obra não pode ser igual à senha geral.", true); return false; }
  if (S.obras.find(o => o.id !== id && o.senha === senha)){ toast("Essa senha já é usada em outra obra.", true); return false; }
  return true;
}

async function boot(){
  document.body.insertAdjacentHTML("beforeend", `<datalist id="unidades">${UNIDADES.map(u => `<option value="${u}">`).join("")}</datalist>`);
  try {
    await initDb();
    await carregaObras();
  } catch(e){
    console.error(e);
    $("#gateMsg").innerHTML = `Não foi possível conectar ao banco de dados.<br>${esc(e.message)}<br><a href="#" onclick="location.reload()">Tentar de novo</a>`;
    return;
  }
  // a senha guardada neste aparelho é revalidada a cada abertura (se a senha da obra mudar, perde o acesso)
  S.acesso = resolveAcesso(localStorage.getItem("diarioLM_senha"));
  if (S.acesso){ await abrir(); return; }
  localStorage.removeItem("diarioLM_senha");
  $("#gateMsg").textContent = "Digite a senha da sua obra (ou a senha geral).";
  $("#gatePwd").disabled = false; $("#gateBtn").disabled = false;
  const tenta = async () => {
    const senha = $("#gatePwd").value.trim();
    const ac = resolveAcesso(senha);
    if (!ac){ toast("Senha incorreta.", true); $("#gatePwd").select(); return; }
    S.acesso = ac; localStorage.setItem("diarioLM_senha", senha);
    await abrir();
  };
  $("#gateBtn").onclick = tenta;
  $("#gatePwd").addEventListener("keydown", e => { if (e.key === "Enter") tenta(); });
  $("#gatePwd").focus();
}
$("#sair").onclick = () => { if (confirm("Sair e digitar outra senha?")){ localStorage.removeItem("diarioLM_senha"); location.reload(); } };
localStorage.removeItem("diarioLM_ok");
boot();
</script>
</body>
</html>
