  m.status = novoSt; m.datas = { ...(m.datas||{}) }; if (data) m.datas[novoSt] = data;
  m.historico = [...(m.historico||[]), { data: data || hoje(), texto, por:S.nome||"" }];

async function producaoPeriodo(ini, fim){
  const soma = {}, semLig = {};
  let seg = mondayOf(ini), semanas = 0, ligadas = 0;
  while (seg <= fim){
    const w = await getWeek(S.obraId, seg); semanas++;
    const todas = [...Object.values(w.atividades || {}).map(a => ({ ...a, np:false })), ...Object.values(w.naoProg || {}).map(a => ({ ...a, np:true }))];
    for (const a of todas){
      let q = 0;
      for (let d = 0; d < 7; d++){
        const dia = addDays(seg, d); if (dia < ini || dia > fim) continue;
        q += val(a.real, d) || 0;
      }
      if (a.itemContrato){ ligadas++; if (q) soma[a.itemContrato] = (soma[a.itemContrato] || 0) + q; }
      else if (q){ const k = (a.descricao || "?") + "|" + (a.unidade || ""); (semLig[k] ||= { descricao:a.descricao || "?", unidade:a.unidade || "", q:0, np:a.np }).q += q; }
    }
    seg = addDays(seg, 7);
  }
  return { soma, semLig:Object.values(semLig), semanas, ligadas };
}
// prévia de faturamento: o que o Diário já registrou desde a última medição × preço do contrato
function periodoPrevia(){
  const c = S.ext.contrato, ult = S.ext.meds[S.ext.meds.length - 1];
  const ini = ult ? addDays(ult.fim, 1) : (c.inicio || hoje().slice(0,8) + "01");
  return { ini, fim: hoje(), numero: (ult?.numero || 0) + 1 };
}
async function carregaPrevia(){
  const box = $("#previa"); if (!box) return;
  const c = S.ext.contrato, per = periodoPrevia();
  if (per.ini > per.fim){ box.innerHTML = `<h3>Prévia de faturamento</h3><div class="vazio">A última medição já cobre até hoje.</div>`; return; }
  const pr = await producaoPeriodo(per.ini, per.fim);
  if (!$("#previa")) return;
  S.previa = { ...per, soma: pr.soma };
  const linhas = c.itens.filter(i => pr.soma[i.id]).map(i => ({ i, q: r2(pr.soma[i.id]*1000)/1000, v: r2(pr.soma[i.id] * i.pu) })).sort((a,b) => b.v - a.v);

  const prevMes = previstoAte(c, per.numero) !== null ? r2(previstoAte(c, per.numero) - previstoAte(c, per.numero - 1)) : null;
  const diasMes = Math.max(1, diasEntre(per.ini, addDays(addMeses(per.ini, 1), -1)) + 1), diasCorr = diasEntre(per.ini, per.fim) + 1;

    <div class="kpi" style="margin-top:10px">
      <div><b>${fmtR(tot)}</b><span>Produzido até hoje (${diasCorr} dia${diasCorr>1?"s":""})</span></div>
      ${prevMes !== null ? `<div><b>${fmtR(prevMes)}</b><span>Previsto no cronograma para o mês ${per.numero}</span></div>
      <div><b class="${tot < prevMes * Math.min(1, diasCorr/diasMes) - 0.01 ? "neg" : "pos"}">${fmtP(prevMes ? tot / prevMes : 0)}</b><span>do previsto do mês · esperado até hoje ≈ ${fmtP(Math.min(1, diasCorr/diasMes))}</span></div>` : ""}
      <div><b>${fmtP((antV + tot) / vc)}</b><span>Contrato executado contando a prévia</span></div>
    </div>`;
  if (!pr.ligadas && !pr.semLig.length) h += `<div class="vazio">Nenhuma produção lançada no Diário neste período.</div>`;
  else if (!linhas.length) h += `<div class="info">Há produção no Diário, mas nenhuma atividade está ligada a item do contrato. Ligue as atividades na aba <b>Programação da semana</b> (campo “Item do contrato”).</div>`;
  if (linhas.length){
    h += `<div class="tbwrap"><table class="tb"><thead><tr><th>Item</th><th class="l">Serviço</th><th>Un</th><th>Produzido no período</th><th>Preço unit.</th><th>Valor</th><th>Acumulado / contratado</th></tr></thead><tbody>${
      linhas.map(({ i, q, v }) => { const at = acumAnterior(i.id, Infinity) + q, p = i.qtd ? at / i.qtd : 0;
        return `<tr class="${p > 1.0001 ? "estouro" : ""}"><td>${esc(i.item)}</td><td class="l">${esc(i.descricao)}</td><td>${esc(i.un)}</td><td>${fmtQ(q)}</td><td>${fmtR(i.pu)}</td><td>${fmtR(v)}</td>
          <td><div class="barra"><i style="width:${Math.min(100,p*100)}%" class="${p > 1.0001 ? "estouro" : ""}"></i></div><small>${fmtQ(r2(at*1000)/1000)} de ${fmtQ(i.qtd)} (${fmtP(p)})</small></td></tr>`; }).join("")
    }</tbody><tfoot><tr><td colspan="5" class="l">TOTAL DA PRÉVIA</td><td>${fmtR(tot)}</td><td></td></tr></tfoot></table></div>`;
  }
  if (pr.semLig.length) h += `<div class="info" style="margin-top:10px"><b>Produção que não entra no faturamento</b> (atividade sem item do contrato):<br>${
      pr.semLig.map(x => `${esc(x.descricao)} — ${fmtQ(r2(x.q*1000)/1000)} ${esc(x.unidade)}${x.np ? " <small>(não programada)</small>" : ""}`).join("<br>")}
      <br><small>Ligue essas atividades ao item do contrato na Programação da semana para entrarem na prévia e na medição.</small></div>`;
  if (linhas.length && ehGeral()) h += `<div class="row" style="margin-top:10px"><button class="btn pri peq" id="prevCriar">Criar medição nº ${per.numero} com esses valores</button></div>`;
  box.innerHTML = h;

async function sugerirPeloDiario(){
  const m = S.medDraft; syncMedDom();

  const { soma, semanas, ligadas } = await producaoPeriodo(m.inicio, m.fim);
  const ids = Object.keys(soma).filter(id => c.itens.find(i => i.id === id));
  if (!ids.length){
    toast(ligadas ? "Nenhuma produção lançada no período nas atividades ligadas ao contrato." : "Nenhuma atividade da Programação está ligada a item do contrato. Ligue na aba Programação da semana.", true); return;
  }
  for (const id of ids) m.qtd[id] = r2(soma[id] * 1000) / 1000;
  renderMedEditor(); toast(`${ids.length} item(ns) preenchidos com o realizado do Diário (${semanas} semana${semanas>1?"s":""}). Confira antes de salvar.`);
}

// valor por extenso (reais), regra do português: "três milhões, trezentos e oitenta e nove mil, oitocentos e noventa e oito reais e oitenta e três centavos"
function extenso(v){
  const u = ["","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
  const d = ["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
  const c = ["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
  const ate999 = n => { if (n === 100) return "cem"; const p = [];
    if (n >= 100){ p.push(c[Math.floor(n / 100)]); n %= 100; }
    if (n >= 20){ p.push(d[Math.floor(n / 10)]); if (n % 10) p.push(u[n % 10]); } else if (n) p.push(u[n]);
    return p.join(" e "); };
  const nomes = [["",""],["mil","mil"],["milhão","milhões"],["bilhão","bilhões"]];
  const inteiro = n => {
    if (!n) return { s:"zero", grande:false };
    const g = []; while (n > 0){ g.push(n % 1000); n = Math.floor(n / 1000); }
    const partes = [];
    for (let i = g.length - 1; i >= 0; i--){ const k = g[i]; if (!k) continue;
      partes.push({ i, k, s: i === 1 && k === 1 ? "mil" : ate999(k) + (i ? " " + (k === 1 ? nomes[i][0] : nomes[i][1]) : "") }); }
    let s = partes[0].s;
    for (let j = 1; j < partes.length; j++){ const p = partes[j], ultimo = j === partes.length - 1;
      s += (ultimo && (p.k < 100 || p.k % 100 === 0) ? " e " : ", ") + p.s; }
    return { s, grande: partes[partes.length - 1].i >= 2 };
  };
  v = Math.round(Number(v || 0) * 100) / 100;
  const r = Math.floor(v), cts = Math.round((v - r) * 100);
  let s = "";
  if (r){ const x = inteiro(r); s = `${x.s}${x.grande ? " de" : ""} ${r === 1 ? "real" : "reais"}`; }
  if (cts) s += (s ? " e " : "") + `${inteiro(cts).s} ${cts === 1 ? "centavo" : "centavos"}`;
  return s || "zero reais";
}

/* ---- requisição: serviço do contrato → insumo da CPU (orçado × já pedido × saldo) ---- */
const reqConta = r => !["recusada","cancelada"].includes(r.status);
// quanto já foi pedido daquele insumo naquele serviço (requisições válidas desta obra)
function jaPedido(itemC, cod, ignorarId){
  let q = 0;
  for (const r of S.ext.reqs){
    if (!reqConta(r) || r.id === ignorarId) continue;
    for (const l of r.itens) if (l.itemContrato === itemC && l.insumoCod === cod) q += Number(l.qtd) || 0;
  }
  return q;
}
function insumoOrcado(itemC, cod){
  const it = S.ext.contrato?.itens?.find(i => i.id === itemC);
  const ins = it?.insumos?.find(x => x.codigo === cod);
  return ins ? { ...ins, orcado: r2(ins.consumo * it.qtd * 1000) / 1000, item: it } : null;
}
const foraPlan = l => !l.insumoCod || l.excedente;
// preço de referência (teto) de cada linha: o preço do insumo na composição do orçamento (custo direto, sem BDI)
function puRef(l){ if (l.puRef != null) return l.puRef; const o = l.insumoCod ? insumoOrcado(l.itemContrato, l.insumoCod) : null; return o ? o.pu : null; }
function refReq(r){
  let v = 0, sem = 0;
  for (const l of r.itens){ const p = puRef(l); if (p == null) sem++; else v += p * l.qtd; }
  return { valor: r2(v), sem, total: r.itens.length };
}
const fmtRU = n => n == null ? "—" : Number(n).toLocaleString("pt-BR", { style:"currency", currency:"BRL", minimumFractionDigits:2, maximumFractionDigits: Math.abs(n) < 10 ? 4 : 2 });
const txtRef = rf => rf.sem === rf.total ? "sem referência (material fora da composição)" : fmtR(rf.valor) + (rf.sem ? ` + ${rf.sem} material(is) sem referência` : "");
const difRef = (v, ref) => { if (!ref) return ""; const d = v / ref - 1; return `<span class="${d > 0.0005 ? "neg" : "pos"}">${d > 0 ? "+" : ""}${(d*100).toLocaleString("pt-BR",{maximumFractionDigits:1})}%</span>`; };
const reqFora = r => r.itens.some(foraPlan);

/* ---- RC no modelo LM: antecedência, equipamento, envio a Compras e exportação ---- */
const RC_MAX = 27;   // linhas de itens do modelo
const rcNum = r => "RC " + String(r.numero).padStart(3, "0");
// dias úteis (seg a sex) entre duas datas: conta os dias depois de "de" até "ate"
function diasUteis(de, ate){
  if (!de || !ate || ate <= de) return 0;
  let n = 0, d = de;
  while (d < ate){ d = addDays(d, 1); const w = parseIso(d).getDay(); if (w !== 0 && w !== 6) n++; }
  return n;
}
function antecedencia(r){
  const exige = r.itens.some(i => (i.classe || (i.insumoCod ? "final" : "consumo")) === "final") ? 5 : 3;
  const base = r.envio?.data || hoje();
  const tem = diasUteis(base, r.necessidade);
  return { exige, tem, ok: !r.necessidade || tem >= exige };
}
async function equipamentosLM(){
  if (!S.equipLM){ try { S.equipLM = (await store.list("equipamentos")).sort((a,b) => (a.tipo||"").localeCompare(b.tipo||"")); } catch(e){ console.error(e); S.equipLM = []; } }
  return S.equipLM;
}
const eqRotulo = e => [e.tipo, e.marca, e.modelo, e.placa || e.tag].filter(Boolean).join(" · ") + (e.obra ? ` — ${e.obra}` : "");
function eqDoControle(e){
  const terceiro = !/PR[ÓO]PRIO/i.test(e.locacao || "");
  return { descricao:e.tipo || "", codigo:e.tag || e.sieng || "", pt: terceiro ? "T" : "P", terceiro: terceiro ? (e.proprietario || "") : "",
           marca:e.marca || "", modelo:e.modelo || "", serie:"", ano:e.ano || "", placa:e.placa || "", chassi:e.chassis || "", idControle:e.id };
}

function rcCampos(r){
  const eq = r.equipamento || {};
  const dt = s => s ? fmtBR(s) : "";
  return {
    D6: rcNum(r), D7: dt((r.criadoEm || "").slice(0,10)), F7: dt(r.envio?.data), H7: r.envio?.hora || "",
    D8: r.solicitante || "", F8: r.fornecedorSugerido || "", I8: r.prazoEntrega || (r.necessidade ? "até " + fmtBR(r.necessidade) : ""),
    D9: r.localEntrega || "", G9: r.obraNome || "", I9: r.responsavelObra || "",
    D10: eq.descricao || "", F10: eq.codigo || "", H10: eq.pt || "", J10: eq.terceiro || "",
    D11: eq.marca || "", F11: eq.modelo || "", H11: eq.serie || "", J11: eq.ano || "",
    D12: eq.placa || "", F12: eq.chassi || "", I12: r.envio?.responsavel ? `${r.envio.responsavel} — ${dt(r.envio.data)} ${r.envio.hora || ""}` : ""
  };

function rcRodape(r){
  const rf = refReq(r), ant = antecedencia(r);
  const obs = [r.urgente ? "URGENTE" : "", r.obs, r.justificativa ? "Fora do planejado: " + r.justificativa : ""].filter(Boolean).join(" · ");
  const ap = r.aprovacao ? `Aprovada por ${r.aprovacao.por} em ${fmtBR(r.aprovacao.data)} ${r.aprovacao.hora || ""}` : "Aguardando aprovação de Compras";
  return {
    C42: "OBSERVAÇÕES: " + (obs || "—") + (r.necessidade ? ` · Necessário na obra até ${fmtBR(r.necessidade)} (${ant.tem} dias úteis; mínimo ${ant.exige})` : ""),
    C43: `COMPRAS: ${ap} · Valor de referência (orçamento): ${txtRef(rf)} · Gerada pelo sistema de Obras LM em ${new Date().toLocaleString("pt-BR")}`
  };
}
async function exportarRCExcel(r){
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(await (await fetch("modelo-rc.xlsx")).arrayBuffer());
  const ws = wb.worksheets[0]; ws.name = rcNum(r).replace(" ", "-");
  const put = (ref, v) => { ws.getCell(ref).value = v; };
  for (const [ref, v] of Object.entries(rcCampos(r))) put(ref, v);
  // no modelo as linhas 33 a 36 não estão mescladas como as outras
  for (let row = 33; row <= 36; row++){
    try { ws.mergeCells(`C${row}:D${row}`); } catch(e){}
    try { ws.mergeCells(`E${row}:H${row}`); } catch(e){}
  }
  r.itens.slice(0, RC_MAX).forEach((i, k) => {
    const row = 15 + k;
    put(`C${row}`, i.codigo || i.insumoCod || "");
    put(`E${row}`, i.descricao + ((i.classe || (i.insumoCod ? "final" : "consumo")) === "final" ? " *" : " **"));
    put(`I${row}`, i.un); put(`J${row}`, i.qtd);
    ws.getCell(`J${row}`).numFmt = '#,##0.###';
    ["C","E","I","J"].forEach(c => { ws.getCell(`${c}${row}`).alignment = { vertical:"middle", horizontal: c === "E" ? "left" : "center", wrapText:true }; });
  });
  const rod = rcRodape(r);
  put("C42", rod.C42); put("C43", rod.C43);
  ["C42","C43"].forEach(c => { ws.getCell(c).alignment = { vertical:"top", horizontal:"left", wrapText:true }; ws.getCell(c).font = { name:"Calibri", size:10 }; });
  const buf = await wb.xlsx.writeBuffer();
  baixar(new Blob([buf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), `${rcNum(r)} - ${r.obraNome}.xlsx`);
  toast("RC gerada em Excel.");
}

}

  return (num(l.qtd) || 0) > o.orcado - jaPedido(l.itemContrato, l.insumoCod, S.reqEdit) + 0.0005;
}

async function salvarNovaReq(){
  syncReqLinhas();
  const itens = [];
  for (const l of S.reqLinhas){
    if (!l.itemContrato && !l.qtd && !l.descricao) continue;
    const q = num(l.qtd);
    const semServ = !l.itemContrato || l.itemContrato === "__fora";
    const outro = semServ || l.insumoCod === "__fora";
    if (!semServ && !l.insumoCod){ toast("Escolha o insumo de cada serviço (ou 'Outro material').", true); return; }
    if (outro && !l.descricao){ toast("Descreva o material fora da composição.", true); return; }
    if (q === null || q <= 0){ toast("Informe a quantidade de cada material.", true); return; }
    const o = !outro ? insumoOrcado(l.itemContrato, l.insumoCod) : null;
    const saldo = o ? o.orcado - jaPedido(l.itemContrato, l.insumoCod, S.reqEdit) : 0;
    itens.push({ descricao:(o ? o.descricao : l.descricao).toUpperCase(), qtd:q, un:normUn(o ? o.un : (l.un || "un")),
      codigo: l.codigo || (o ? o.codigo : ""), classe: l.classe || (outro ? "consumo" : "final"),
      itemContrato: semServ ? null : l.itemContrato, insumoCod: outro ? null : l.insumoCod,
      orcado: o ? o.orcado : null, puRef: o ? o.pu : null, saldoAntes: o ? r2(saldo*1000)/1000 : null, excedente: o ? q > saldo + 0.0005 : false });
  }
  if (!itens.length){ toast("Inclua ao menos um material.", true); return; }
  if (itens.length > RC_MAX){ toast(`O modelo de RC comporta ${RC_MAX} linhas. Divida em duas requisições.`, true); return; }
  const sol = $("#rqSol").value.trim(); if (!sol){ toast("Informe o solicitante.", true); return; }
  if (!$("#rqLocal").value.trim()){ toast("Informe o local de entrega.", true); return; }
  if (!$("#rqNec").value){ toast("Informe a data em que precisa na obra.", true); return; }
  const fora = itens.some(foraPlan), just = $("#rqJust")?.value.trim() || "";
  if (fora && !just){ toast("Explique por que há material fora do planejado.", true); $("#rqJust").focus(); return; }
  const cab = { solicitante:sol, necessidade:$("#rqNec").value || null, urgente:$("#rqUrg").checked, itens, obs:$("#rqObs").value.trim(),
    foraPlanejado:fora, justificativa: fora ? just : "", localEntrega:$("#rqLocal").value.trim(), responsavelObra:$("#rqResp").value.trim(),
    fornecedorSugerido:$("#rqForn").value.trim(), prazoEntrega:$("#rqPrazo").value.trim(), equipamento: S.reqCab?.eqTem ? (S.reqCab.eq || {}) : null };
  if (!S.nome){ S.nome = sol; localStorage.setItem("diarioLM_nome", sol); }
  let r;
  if (S.reqEdit){
    const ant = S.ext.reqs.find(x => x.id === S.reqEdit);
    r = { ...ant, ...cab, status: ant.status === "devolvida" ? "aberta" : ant.status, atualizadoEm:agoraIso(),
          historico:[...(ant.historico||[]), { data:hoje(), texto: ant.status === "devolvida" ? "Corrigida após devolução" : "Editada", por:sol }] };
  } else {
    const numero = Math.max(0, ...S.ext.reqs.map(x => x.numero || 0)) + 1;
    r = { id:uid(), obraId:S.obraId, obraNome:obraAtual().nome, numero, ...cab, status:"aberta", cotacoes:[], recebimentos:[], criadoEm:agoraIso(),
          historico:[{ data:hoje(), texto:"Requisição emitida" + (fora ? " (com material fora do planejado)" : ""), por:sol }] };
  }
  await store.set(COL_REQ, r.id, r);
  const editou = !!S.reqEdit;
  S.reqLinhas = null; S.reqCab = null; S.reqEdit = null; await loadExtras(true); S.reqSel = r.id; renderCompras();
  toast(editou ? `${rcNum(r)} atualizada.` : `${rcNum(r)} emitida. Valide e envie a Compras.`);
}
// planejamento de insumos da obra: orçado × requisitado × recebido, por serviço

async function gravaReq(r, texto, extra){
  r = { ...r, ...extra, atualizadoEm:agoraIso() };
  if (texto) r.historico = [...(r.historico||[]), { data:hoje(), texto, por:S.nome||"" }];
  await store.set(COL_REQ, r.id, r);
  await loadExtras(true);
  if (S.reqTodas) S.todasReqs = await store.list(COL_REQ);
  renderCompras();
}

/* ======================================================================
   RECURSOS — mão de obra e equipamentos
   Orçado: horas e custo de cada função/equipamento nas composições (CPU),
   distribuídos pelos meses do cronograma. Planejado: histograma mensal
   (quantas pessoas / equipamentos em cada mês), montado pelo engenheiro.
   1 = um recurso o mês inteiro (176 h); 0,5 = meio mês.
   ====================================================================== */
const H_MES = 176;
S.recTipo = "mo";
S.recMostrarPeq = false;

// horas e custo orçados de cada recurso, com a distribuição mensal pelo cronograma
function recursosOrcados(c, tipo){
  const n = c.cronograma?.meses || c.prazoMeses || 1;
  const map = {};
  for (const it of (c.itens || [])){
    const pcts = c.cronograma?.metas?.[norm(it.grupo)] || Array.from({ length:n }, () => 100 / n);
    for (const r of (it[tipo] || [])){
      const o = map[r.n] ||= { nome:r.n, h:0, c:0, mes:Array(n).fill(0), servicos:[] };
      o.h += r.h; o.c += r.c; o.servicos.push(it.item);
      for (let m = 0; m < n; m++) o.mes[m] += r.h * (Number(pcts[m]) || 0) / 100;
    }
  }
  return map;
}
function histDraft(){
  const c = S.ext.contrato;
  if (!S.histDraft || S.histDraft._obra !== S.obraId) S.histDraft = { _obra:S.obraId, ...clone(c.histograma || { mo:{}, eq:{} }) };
  S.histDraft.mo ||= {}; S.histDraft.eq ||= {};
  return S.histDraft;
}
function renderRecursos(){
  const el = $("#v-recursos");
  if (!S.obraId){ el.innerHTML = semObra(); setSavebar(""); return; }
  if (precisaCarregar(el, renderRecursos)) return;
  const c = S.ext.contrato;
  if (!c?.itens?.some(i => i.mo?.length || i.eq?.length)){
    el.innerHTML = `<div class="card vazio">Esta obra ainda não tem as horas de mão de obra e equipamento das composições.<br>Elas vêm das composições de custo (CPU) da proposta — envie o PDF/Excel das composições para cadastrar.</div>`;
    setSavebar(""); return;
  }
  const n = c.cronograma?.meses || c.prazoMeses || 1;
  const hd = histDraft(), tipo = S.recTipo;
  const resumo = t => {
    const orc = recursosOrcados(c, t), pl = hd[t] || {};
    const nomes = new Set([...Object.keys(orc), ...Object.keys(pl)]);
    let co = 0, cp = 0, ho = 0, hp = 0;
    for (const nome of nomes){
      const o = orc[nome], p = pl[nome] || {}, ch = o && o.h ? o.c / o.h : 0;
      const cm = p.custoMes != null ? p.custoMes : ch * H_MES;
      const q = (p.qtd || []).reduce((s,x) => s + (Number(x) || 0), 0);
      co += o?.c || 0; ho += o?.h || 0; cp += q * cm; hp += q * H_MES;
    }
    return { co:r2(co), cp:r2(cp), ho, hp };
  };
  const rMO = resumo("mo"), rEQ = resumo("eq");
  const temPlano = r => r.cp > 0;
  let h = `<div class="kpi">
    <div><b>${fmtR(rMO.co)}</b><span>Mão de obra orçada · ${fmtQ(Math.round(rMO.ho))} h</span></div>
    <div><b class="${temPlano(rMO) && rMO.cp > rMO.co ? "neg" : ""}">${temPlano(rMO) ? fmtR(rMO.cp) : "—"}</b><span>Mão de obra planejada${temPlano(rMO) ? " · " + fmtP(rMO.cp / rMO.co) + " do orçado" : ""}</span></div>
    <div><b>${fmtR(rEQ.co)}</b><span>Equipamento orçado · ${fmtQ(Math.round(rEQ.ho))} h</span></div>
    <div><b class="${temPlano(rEQ) && rEQ.cp > rEQ.co ? "neg" : ""}">${temPlano(rEQ) ? fmtR(rEQ.cp) : "—"}</b><span>Equipamento planejado${temPlano(rEQ) ? " · " + fmtP(rEQ.cp / rEQ.co) + " do orçado" : ""}</span></div>
  </div>`;
  h += `<div class="card"><div class="row" style="justify-content:space-between">
      <span class="row"><button class="btn peq ${tipo==="mo"?"on":""}" data-rectipo="mo">Mão de obra</button><button class="btn peq ${tipo==="eq"?"on":""}" data-rectipo="eq">Equipamentos</button></span>
      <span class="row"><label class="row" style="gap:6px"><input type="checkbox" id="recPeq" ${S.recMostrarPeq ? "checked" : ""}> mostrar recursos com menos de 20 h orçadas</label>
      ${ehGeral() ? `<button class="btn peq" id="recSugestao">Preencher vazios com a sugestão</button><button class="btn peq" id="recAdd">+ Recurso fora do orçamento</button>` : ""}</span></div>
    <p class="nota">Histograma: quantos ${tipo === "mo" ? "profissionais de cada função" : "equipamentos de cada tipo"} em cada mês — <b>1</b> = um o mês inteiro (${H_MES} h), <b>0,5</b> = meio mês. O número cinza é a sugestão tirada das horas orçadas.
      ${tipo === "eq" ? "No SICRO o custo horário do equipamento já inclui operador e combustível." : "Custo/mês = salário + encargos; vazio usa o custo horário da composição × " + H_MES + " h."}</p>`;
  const orc = recursosOrcados(c, tipo), pl = hd[tipo];
  const nomes = [...new Set([...Object.keys(orc), ...Object.keys(pl)])]
    .filter(nm => S.recMostrarPeq || (orc[nm]?.h || 0) >= 20 || pl[nm])
    .sort((a,b) => (orc[b]?.c || 0) - (orc[a]?.c || 0));
  const ocultos = Object.keys(orc).length - nomes.filter(nm => orc[nm]).length;
  const ro = !ehGeral();
  h += `<div class="tbwrap"><table class="tb hist"><thead><tr><th class="l">${tipo === "mo" ? "Função" : "Equipamento"}</th><th>Horas orçadas</th><th>Custo orçado</th>
    ${tipo === "eq" ? "<th>Tipo</th>" : ""}<th>Custo/mês por ${tipo === "mo" ? "pessoa" : "unidade"}</th>
    ${Array.from({ length:n }, (_,k) => `<th>Mês ${k+1}${c.inicio ? `<br><small>${MESES[parseIso(addMeses(c.inicio,k)).getMonth()]}</small>` : ""}</th>`).join("")}
    <th>Horas planej.</th><th>Custo planej.</th><th>Planej. / orçado</th></tr></thead><tbody>`;
  let tot = { ho:0, co:0, hp:0, cp:0, mes:Array(n).fill(0) };
  for (const nm of nomes){
    const o = orc[nm], p = pl[nm] || {}, ch = o && o.h ? o.c / o.h : 0;
    const cmPad = r2(ch * H_MES), cm = p.custoMes != null ? p.custoMes : cmPad;
    const qtd = p.qtd || [];
    const hp = qtd.reduce((s,x) => s + (Number(x) || 0), 0) * H_MES, cp = r2(qtd.reduce((s,x) => s + (Number(x) || 0), 0) * cm);
    const rel = o?.c ? cp / o.c : null;
    tot.ho += o?.h || 0; tot.co += o?.c || 0; tot.hp += hp; tot.cp += cp;
    qtd.forEach((x,k) => tot.mes[k] += Number(x) || 0);
    h += `<tr data-rec="${esc(nm)}" class="${!o ? "foraplan" : ""}"><td class="l" title="${o ? "Serviços: " + esc(o.servicos.join(", ")) : "Fora do orçamento"}">${esc(nm)}${!o ? `<br><span class="chip" style="--c:#FFC14D">fora do orçamento</span>` : ""}</td>
      <td>${o ? fmtQ(Math.round(o.h*10)/10) : "—"}</td><td>${o ? fmtR(r2(o.c)) : "—"}</td>
      ${tipo === "eq" ? `<td><select data-hf="tipo" ${ro?"disabled":""}><option value="proprio" ${p.tipo!=="locado"?"selected":""}>Próprio</option><option value="locado" ${p.tipo==="locado"?"selected":""}>Locado</option></select></td>` : ""}
      <td><input class="hc" data-hf="custoMes" inputmode="decimal" placeholder="${cmPad ? fmtNum(cmPad) : "R$/mês"}" value="${p.custoMes != null ? fmtNum(p.custoMes) : ""}" ${ro?"disabled":""}></td>
      ${Array.from({ length:n }, (_,k) => { const sug = o ? Math.round(o.mes[k] / H_MES * 10) / 10 : 0;
        return `<td><input class="hq" data-m="${k}" inputmode="decimal" placeholder="${sug ? fmtNum(sug) : ""}" value="${qtd[k] ? fmtNum(qtd[k]) : ""}" ${ro?"disabled":""}></td>`; }).join("")}
      <td>${hp ? fmtQ(Math.round(hp)) : "—"}</td><td>${cp ? fmtR(cp) : "—"}</td>
      <td>${rel !== null && cp ? `<span class="${rel > 1.0001 ? "neg" : "pos"}">${fmtP(rel)}</span>` : (!o && cp ? `<span class="neg">extra</span>` : "—")}</td></tr>`;
  }
  h += `</tbody><tfoot><tr><td class="l">TOTAL</td><td>${fmtQ(Math.round(tot.ho))}</td><td>${fmtR(r2(tot.co))}</td>${tipo === "eq" ? "<td></td>" : ""}<td></td>
    ${tot.mes.map(x => `<td>${x ? fmtNum(Math.round(x*10)/10) : "—"}</td>`).join("")}<td>${tot.hp ? fmtQ(Math.round(tot.hp)) : "—"}</td><td>${tot.cp ? fmtR(r2(tot.cp)) : "—"}</td>
    <td>${tot.cp && tot.co ? `<span class="${tot.cp > tot.co ? "neg" : "pos"}">${fmtP(tot.cp/tot.co)}</span>` : "—"}</td></tr></tfoot></table></div>
    ${ocultos > 0 && !S.recMostrarPeq ? `<p class="nota">${ocultos} recurso(s) com menos de 20 h orçadas estão ocultos.</p>` : ""}
    <p class="nota">Orçado = horas das composições × quantidade contratada de cada serviço, distribuídas pelo cronograma (passe o mouse no nome para ver os serviços). Custos sem BDI.</p></div>`;
  el.innerHTML = h;
  setSavebar(ehGeral() ? `<button class="btn pri" id="recSalvar">Salvar histograma</button>` : "");
}
function syncHist(){
  const hd = histDraft(), tipo = S.recTipo;
  $$("#v-recursos tr[data-rec]").forEach(tr => {
    const nm = tr.dataset.rec, p = hd[tipo][nm] ||= {};
    const qtd = [...tr.querySelectorAll(".hq")].map(i => { const v = num(i.value); return v === null ? 0 : v; });
    p.qtd = qtd.some(x => x) ? qtd : [];
    const cmS = tr.querySelector(".hc").value.trim(); p.custoMes = cmS ? num(cmS) : null;
    const tp = tr.querySelector('[data-hf="tipo"]'); if (tp) p.tipo = tp.value;
    if (!p.qtd.length && p.custoMes == null && !p.extra && (!p.tipo || p.tipo === "proprio")) delete hd[tipo][nm];
  });
}
document.addEventListener("click", async ev => {
  const t = ev.target.closest("button"); if (!t) return;
  try {
    if (t.dataset.rectipo){ syncHist(); S.recTipo = t.dataset.rectipo; renderRecursos(); return; }
    if (t.id === "recSugestao"){
      syncHist();
      const c = S.ext.contrato, orc = recursosOrcados(c, S.recTipo), hd = histDraft(), n = c.cronograma?.meses || c.prazoMeses || 1;
      let k = 0;
      for (const [nm, o] of Object.entries(orc)){
        if (!S.recMostrarPeq && o.h < 20) continue;
        const p = hd[S.recTipo][nm] ||= {};
        if (p.qtd?.some(x => x)) continue;
        p.qtd = Array.from({ length:n }, (_,m) => Math.round(o.mes[m] / H_MES * 10) / 10); k++;
      }
      renderRecursos(); toast(`${k} linha(s) preenchidas com a sugestão. Arredonde para o que vai realmente para a obra e salve.`); return;
    }
    if (t.id === "recAdd"){
      const nm = (prompt(S.recTipo === "mo" ? "Função (ex.: VIGIA, MOTORISTA, ALMOXARIFE):" : "Equipamento (ex.: CAMINHONETE DE APOIO):") || "").trim().toUpperCase();
      if (!nm) return;
      syncHist(); const hd = histDraft(); hd[S.recTipo][nm] ||= { qtd:[], custoMes:null, extra:true };
      renderRecursos(); return;
    }
    if (t.id === "recSalvar"){
      syncHist();
      const hd = histDraft(); const { _obra, ...hist } = hd;
      const bad = Object.values(hist.mo).concat(Object.values(hist.eq)).some(p => (p.qtd || []).some(x => x < 0 || x === null));
      if (bad){ toast("Há quantidade inválida.", true); return; }
      const c = { ...S.ext.contrato, histograma:{ ...hist, atualizadoEm:agoraIso(), atualizadoPor:S.nome || "" } };
      await store.set(COL_CONTR, S.obraId, c);
      S.histDraft = null; await loadExtras(true); renderRecursos(); toast("Histograma salvo."); return;
    }
  } catch(e){ console.error(e); toast("Erro: " + e.message, true); }
});
document.addEventListener("change", ev => { if (ev.target.id === "recPeq"){ syncHist(); S.recMostrarPeq = ev.target.checked; renderRecursos(); } });

/* ======================================================================
   PLANEJAMENTO — prévia de programação (Gantt), MS Project e programação semanal
   Guardado em obra_contratos/{obra}.planejamento:
     { inicio, feriados:[iso], tarefas:[{ id, tipo:"meta"|"item"|"extra", item, nome, grupo,
       inicio, fim, pred:[id], paralela }], origem, atualizadoEm }
   ====================================================================== */
const FERIADOS_PADRAO = ["2026-11-02","2026-11-20","2026-12-25","2027-01-01","2027-02-08","2027-02-09","2027-04-02","2027-04-21","2027-05-01","2027-05-27","2027-09-07","2027-10-12","2027-11-02","2027-11-15","2027-11-20","2027-12-25"];
const diaUtil = (d, fer) => { const w = parseIso(d).getDay(); return w !== 0 && w !== 6 && !fer.includes(d); };
const proxUtil = (d, fer) => { while (!diaUtil(d, fer)) d = addDays(d, 1); return d; };
// soma n dias úteis contando o dia inicial (n = 1 → o próprio dia)
function somaUteis(d, n, fer){ d = proxUtil(d, fer); let k = 1; while (k < n){ d = addDays(d, 1); if (diaUtil(d, fer)) k++; } return d; }
function contaUteis(a, b, fer){ if (!a || !b || b < a) return 0; let n = 0, d = a; while (d <= b){ if (diaUtil(d, fer)) n++; d = addDays(d, 1); } return n; }
const plano = () => S.ext.contrato?.planejamento || null;

// prévia: janelas das metas pelo cronograma, serviços em sequência dentro da janela
function gerarPrevia(c, inicio){
  const fer = FERIADOS_PADRAO.slice(), n = c.cronograma?.meses || c.prazoMeses || 1;
  const fimObra = addDays(addMeses(inicio, n), -1);
  const tarefas = [];
  gruposContrato(c).forEach((g, gi) => {
    const pcts = c.cronograma?.metas?.[norm(g.nome)] || Array(n).fill(100 / n);
    const mIni = Math.max(0, pcts.findIndex(p => Number(p) > 0)), mFim = Math.max(mIni, pcts.length - 1 - [...pcts].reverse().findIndex(p => Number(p) > 0));
    const jIni = proxUtil(addMeses(inicio, mIni), fer);
    let jFim = addDays(addMeses(inicio, mFim + 1), -1); while (!diaUtil(jFim, fer)) jFim = addDays(jFim, -1);
    const janela = Math.max(1, contaUteis(jIni, jFim, fer));
    const metaId = "meta_" + (gi + 1);
    tarefas.push({ id:metaId, tipo:"meta", wbs:String(gi + 1), nome:g.nome, inicio:jIni, fim:jFim, pred:[] });
    // peso de cada serviço: dias de 1 equipe pelas horas de equipamento (ou de mão de obra) das composições
    const peso = i => {
      const eq = Math.max(0, ...(i.eq || []).map(x => x.h)), mo = (i.mo || []).reduce((s,x) => s + x.h, 0);
      return Math.max(1, eq / 8, mo / 40);
    };
    const paralela = i => /km/i.test(i.un) || /^(h|mês|mes)$/i.test(i.un);
    const seq = g.itens.filter(i => !paralela(i)), tot = seq.reduce((s,i) => s + peso(i), 0);
    let cursor = jIni, ant = null, usados = 0;
    g.itens.forEach((i, k) => {
      const base = { id:i.id, tipo:"item", item:i.item, nome:i.descricao, grupo:metaId, wbs:`${gi + 1}.${k + 1}`, qtd:i.qtd, un:i.un, valor:r2(i.qtd * i.pu) };
      if (paralela(i)){ tarefas.push({ ...base, inicio:jIni, fim:jFim, pred:[], paralela:true }); return; }
      const ultimo = seq[seq.length - 1] === i;
      const dias = ultimo ? Math.max(1, janela - usados) : Math.max(1, Math.min(janela - usados - (seq.length - seq.indexOf(i) - 1), Math.round(janela * peso(i) / tot)));
      const fim = somaUteis(cursor, dias, fer);
      tarefas.push({ ...base, inicio:proxUtil(cursor, fer), fim, pred: ant ? [ant] : [] });
      usados += dias; ant = i.id; cursor = addDays(fim, 1);
    });
  });
  return { inicio, fim:fimObra, feriados:fer, tarefas, origem:"previa", atualizadoEm:agoraIso(), atualizadoPor:S.nome || "" };
}

function renderPlanejamento(){
  const el = $("#v-plano");
  if (!S.obraId){ el.innerHTML = semObra(); setSavebar(""); return; }
  if (precisaCarregar(el, renderPlanejamento)) return;
  const c = S.ext.contrato;
  if (!c?.itens?.length){ el.innerHTML = `<div class="card vazio">Cadastre primeiro a planilha contratual na aba <b>Contrato</b>.</div>`; setSavebar(""); return; }
  const p = S.planoDraft || plano();
  let h = `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Planejamento — ${esc(obraAtual().nome)}</h3>
      ${p ? `<small class="nota" style="margin:0">${p.origem === "msproject" ? "Datas importadas do MS Project" : "Prévia gerada pelo cronograma da proposta"}${p.atualizadoEm ? " · " + new Date(p.atualizadoEm).toLocaleString("pt-BR") : ""}</small>` : ""}</div>
    <div class="row" style="margin-top:10px">
      ${ehGeral() ? `<label>Início da obra <input type="date" id="plIni" value="${p?.inicio || c.inicio || "2026-11-01"}"></label>
      <button class="btn ${p ? "" : "pri"} peq" id="plGerar">${p ? "Refazer prévia" : "Gerar prévia de programação"}</button>` : ""}
      ${p ? `<button class="btn peq" id="plMsp">Exportar para MS Project (.xml)</button>` : ""}
      ${p && ehGeral() ? `<button class="btn peq" id="plAjusta" title="Duração = quantidade ÷ (produção por dia × equipes), mantendo a sequência de cada grupo">Ajustar durações às produções</button>` : ""}
      ${ehGeral() ? `<label class="btn peq" style="cursor:pointer">Importar do MS Project<input type="file" id="plImp" accept=".xml" hidden></label>` : ""}
    </div>
    <p class="nota">Ao <b>salvar</b>, a programação de cada semana da obra vai direto para o Diário (semanas já editadas à mão ou com realizado não são alteradas). No MS Project: <b>Arquivo → Abrir → XML</b> para abrir o exportado; para devolver, <b>Arquivo → Salvar como → XML (*.xml)</b> e importe aqui. A prévia segue os meses do cronograma da proposta e dá a cada serviço um tempo proporcional às horas de equipamento/mão de obra das composições — ajuste no Project ou nas datas abaixo.</p></div>`;
  if (!p){ el.innerHTML = h + `<div class="card vazio">Ainda não há programação. Informe o início e clique em “Gerar prévia de programação”.</div>`; setSavebar(""); return; }
  const fer = p.feriados || FERIADOS_PADRAO;
  const ini = p.tarefas.reduce((m,t) => t.inicio < m ? t.inicio : m, p.inicio), fim = p.tarefas.reduce((m,t) => t.fim > m ? t.fim : m, p.fim || p.inicio);
  const total = Math.max(1, diasEntre(ini, fim) + 1);
  const pos = d => (diasEntre(ini, d) / total * 100);
  // régua de meses
  let regua = "", d = ini.slice(0,8) + "01";
  while (d <= fim){ const a = d < ini ? ini : d, b = addDays(addMeses(d, 1), -1) > fim ? fim : addDays(addMeses(d, 1), -1);
    regua += `<span style="left:${pos(a)}%;width:${pos(addDays(b,1)) - pos(a)}%">${MESES[parseIso(d).getMonth()]}/${String(parseIso(d).getFullYear()).slice(2)}</span>`; d = addMeses(d, 1); }
  const hojeX = hoje() >= ini && hoje() <= fim ? `<i class="hojeln" style="left:${pos(hoje())}%"></i>` : "";
  const ro = !ehGeral();
  // simulação: como ficaria a obra se cada serviço durasse o que a produção × equipes exige
  const sim = clone(p); ajustarPelasProducoes(sim); atualizaMetas(sim);
  const simT = Object.fromEntries(sim.tarefas.map(t => [t.id, t]));
  const fimProd = sim.tarefas.reduce((m,t) => t.fim > m ? t.fim : m, sim.inicio);
  const iniProd = sim.tarefas.reduce((m,t) => t.inicio < m ? t.inicio : m, sim.inicio);
  const fimContr = c.prazoMeses ? addDays(addMeses(p.inicio, c.prazoMeses), -1) : null;
  const duPlan = contaUteis(ini, fim, fer), duProd = contaUteis(iniProd, fimProd, fer);
  const estoura = fimContr && fimProd > fimContr;
  h += `<div class="card"><div class="kpi" style="margin-bottom:10px"><div><b>${fmtBR(proxUtil(ini, fer))}</b><span>Início (1º dia útil)</span></div><div><b>${fmtBR(fim)}</b><span>Término planejado</span></div>
      <div><b>${duPlan}</b><span>Dias úteis planejados (sem sábados, domingos e feriados)</span></div>
      <div><b class="${estoura ? "neg" : ""}">${fmtBR(fimProd)}</b><span>Término pelas produções (equipes atuais)</span></div>
      <div><b class="${duProd > duPlan ? "neg" : ""}">${duProd}</b><span>Dias úteis pelas produções${duProd !== duPlan ? ` (${duProd > duPlan ? "+" : ""}${duProd - duPlan})` : ""}</span></div>
      ${fimContr ? `<div><b>${fmtBR(fimContr)}</b><span>Término contratual (${c.prazoMeses} meses)</span></div>` : ""}
      <div><b>${p.tarefas.filter(t => t.tipo !== "meta").length}</b><span>Tarefas</span></div></div>
    ${estoura ? `<p class="nota neg" style="margin:0 0 10px">Pelas produções a obra termina depois do prazo contratual: aumente as equipes dos serviços em vermelho.</p>` : ""}
    <div class="tbwrap"><table class="tb gantt"><thead><tr><th>EAP</th><th class="l">Tarefa</th><th>Início</th><th>Fim</th><th>Dias úteis</th><th title="Produção de 1 equipe por dia (8 h), tirada da composição">Produção/dia<br><small>1 equipe</small></th><th>Equipes</th><th title="Quantidade ÷ (produção × equipes)">Dias<br>necessários</th><th>% medido</th><th class="gt"><div class="regua">${regua}</div></th></tr></thead><tbody>`;
  for (const t of p.tarefas){
    const it = c.itens.find(i => i.id === t.id);
    const pm = it && it.qtd ? Math.min(1, acumAnterior(it.id, Infinity) / it.qtd) : null;
    const meta = t.tipo === "meta";
    h += `<tr class="${meta ? "g" : ""}" data-tid="${esc(t.id)}"><td>${esc(t.wbs || "")}</td>
      <td class="l" title="${esc((t.item ? t.item + " - " : "") + t.nome)}">${meta ? "" : `<small>${esc(t.item || "")}</small> `}${esc(t.nome)}${t.paralela ? ` <small>(contínua)</small>` : ""}</td>
      <td>${meta || ro ? fmtBR(t.inicio) : `<input type="date" class="pi" value="${t.inicio}">`}</td>
      <td>${meta || ro ? fmtBR(t.fim) : `<input type="date" class="pf" value="${t.fim}">`}</td>
      <td>${contaUteis(t.inicio, t.fim, fer)}</td>${meta ? celMeta(t, simT[t.id], fer) : celProd(t, it, fer, ro)}<td>${pm !== null && pm > 0 ? fmtP(pm) : (meta ? "" : "—")}</td>
      <td class="gt"><div class="trilho">${hojeX}<b class="${meta ? "bm" : t.paralela ? "bp" : ""}" style="left:${pos(t.inicio)}%;width:${Math.max(.6, pos(addDays(t.fim,1)) - pos(t.inicio))}%">${pm ? `<u style="width:${pm*100}%"></u>` : ""}</b></div></td></tr>`;
  }
  h += `<tr class="g tot"><td></td><td class="l">TOTAL DA OBRA</td><td>${fmtBR(proxUtil(ini, fer))}</td><td>${fmtBR(fim)}</td><td>${duPlan}</td><td>—</td><td>—</td>
      <td class="${duProd > duPlan ? "neg" : ""}" title="Pelas produções: ${fmtBR(proxUtil(iniProd, fer))} a ${fmtBR(fimProd)}"><b>${duProd}</b></td><td></td><td class="gt"></td></tr>`;
  h += `</tbody></table></div><p class="nota">Nos grupos e no total, “Dias necessários” é o prazo que o grupo / a obra teria se cada serviço durasse o que a produção × equipes exige, mantendo a sequência. Feriados considerados: ${fer.filter(x => x >= ini && x <= fim).map(fmtBR).join(", ") || "nenhum no período"}. A linha vertical marca hoje.</p></div>`;
  el.innerHTML = h;
  setSavebar(ehGeral() ? `<button class="btn pri" id="plSalvar">Salvar programação</button>` : "");
}
// produção por dia (1 equipe) de um serviço: a ajustada na tarefa ou a da composição (prodH × 8 h)
const prodDiaPadrao = it => it?.prodH ? Math.round(it.prodH * 8 * 100) / 100 : null;
const prodDiaTarefa = (t, it) => t.prodDia != null ? t.prodDia : prodDiaPadrao(it);
function diasNecessarios(t, it){
  const pd = prodDiaTarefa(t, it), eq = Number(t.equipes) || 1;
  return it && pd ? Math.max(1, Math.ceil(it.qtd / (pd * eq) - 1e-9)) : null;
}
// grupo: prazo pelas produções (da simulação) × planejado
function celMeta(t, s, fer){
  if (!s) return `<td>—</td><td>—</td><td>—</td>`;
  const dp = contaUteis(s.inicio, s.fim, fer), du = contaUteis(t.inicio, t.fim, fer);
  return `<td>—</td><td>—</td><td class="${dp > du ? "neg" : ""}" title="Pelas produções: ${fmtBR(s.inicio)} a ${fmtBR(s.fim)}"><b>${dp}</b></td>`;
}
function celProd(t, it, fer, ro){
  if (t.tipo === "meta" || t.paralela || !it) return `<td>—</td><td>—</td><td>—</td>`;
  const pd = prodDiaTarefa(t, it), dn = diasNecessarios(t, it), du = contaUteis(t.inicio, t.fim, fer);
  const fonte = it.prodFonte ? `Composição: ${it.prodFonte}${it.prodH ? ` — ${fmtQ(it.prodH)} ${it.un}/h` : ""}` : "Sem produção na composição";
  const curto = dn !== null && dn > du;
  return `<td title="${esc(fonte)}">${ro ? (pd ? fmtQ(pd) : "—") : `<input class="pp" inputmode="decimal" value="${pd ? fmtNum(pd) : ""}" placeholder="—" style="width:84px">`}<br><small>${esc(it.un)}/dia</small></td>
    <td>${ro ? (t.equipes || 1) : `<input class="pe" inputmode="numeric" value="${t.equipes || 1}" style="width:46px">`}</td>
    <td class="${curto ? "neg" : ""}" title="${curto ? "O prazo planejado é menor que o necessário: aumente as equipes ou a duração" : ""}">${dn ?? "—"}</td>`;
}
// recalcula a duração de cada serviço pela produção × equipes, mantendo a sequência dentro do grupo
function ajustarPelasProducoes(p){
  const c = S.ext.contrato, fer = p.feriados || FERIADOS_PADRAO;
  let mudou = 0;
  for (const meta of p.tarefas.filter(t => t.tipo === "meta")){
    const filhos = p.tarefas.filter(t => t.grupo === meta.id && t.tipo === "item" && !t.paralela);
    if (!filhos.length) continue;
    let cursor = filhos.reduce((m,t) => t.inicio < m ? t.inicio : m, filhos[0].inicio);
    for (const t of filhos){
      const it = c.itens.find(i => i.id === t.id), dn = diasNecessarios(t, it);
      const dur = dn ?? Math.max(1, contaUteis(t.inicio, t.fim, fer));
      const ini = proxUtil(cursor, fer), fim = somaUteis(ini, dur, fer);
      if (ini !== t.inicio || fim !== t.fim) mudou++;
      t.inicio = ini; t.fim = fim; cursor = addDays(fim, 1);
    }
    const contin = p.tarefas.filter(t => t.grupo === meta.id && t.paralela);
    const fimSeq = filhos[filhos.length - 1].fim;
    for (const t of contin) if (t.fim < fimSeq) t.fim = fimSeq;   // transportes acompanham o fim dos serviços do grupo
  }
  return mudou;
}
function syncPlano(){
  const p = S.planoDraft || (plano() && clone(plano())); if (!p) return null;
  $$("#v-plano tr[data-tid]").forEach(tr => {
    const t = p.tarefas.find(x => x.id === tr.dataset.tid); if (!t) return;
    const a = tr.querySelector(".pi")?.value, b = tr.querySelector(".pf")?.value;
    if (a) t.inicio = a; if (b) t.fim = b < t.inicio ? t.inicio : b;
    const pp = tr.querySelector(".pp"), pe = tr.querySelector(".pe");
    if (pp){ const it = S.ext.contrato.itens.find(i => i.id === t.id), v = num(pp.value);
      t.prodDia = v === null || Math.abs(v - (prodDiaPadrao(it) || 0)) < 1e-6 ? null : v; if (t.prodDia === null) delete t.prodDia; }
    if (pe){ const v = parseInt(pe.value, 10); if (v > 1) t.equipes = v; else delete t.equipes; }
  });
  atualizaMetas(p);
  S.planoDraft = p; return p;
}
// metas acompanham os serviços
function atualizaMetas(p){
  for (const m of p.tarefas.filter(t => t.tipo === "meta")){
    const filhos = p.tarefas.filter(t => t.grupo === m.id); if (!filhos.length) continue;
    m.inicio = filhos.reduce((x,t) => t.inicio < x ? t.inicio : x, filhos[0].inicio); m.fim = filhos.reduce((x,t) => t.fim > x ? t.fim : x, filhos[0].fim);
  }
}
// grava a programação semanal de todas as semanas do plano.
// semana vazia → recebe o plano; semana futura que só tem atividades vindas do plano e sem realizado → atualiza;
// semana salva à mão ou com realizado → não mexe.
async function publicarNoDiario(p){
  const fer = p.feriados || FERIADOS_PADRAO, hojeSeg = mondayOf(hoje());
  const fim = p.tarefas.reduce((m,t) => t.fim > m ? t.fim : m, p.inicio);
  let seg = mondayOf(proxUtil(p.inicio, fer)), novas = 0, atualizadas = 0, preservadas = 0;
  while (seg <= fim){
    const sug = programacaoDoPlano(seg, p) || [];
    const id = weekId(S.obraId, seg), doc = await store.get(COL_SEMANAS, id);
    const nt = {}; for (let d = 0; d < 7; d++){ const dia = addDays(seg, d); if (d === 6 || fer.includes(dia)) nt[d] = true; }
    const ativ = {}; sug.forEach((a, i) => ativ[a.id] = { ordem:i, grupo:a.grupo, descricao:a.descricao, unidade:a.unidade, itemContrato:a.itemContrato, prog:a.prog, origem:"plano" });
    const atuais = Object.values(doc?.atividades || {});
    const temReal = atuais.some(a => Object.keys(a.real || {}).length) || Object.keys(doc?.naoProg || {}).length;
    if (!atuais.length){
      if (sug.length){ await store.set(COL_SEMANAS, id, { ...blankWeek(S.obraId, seg), ...(doc || {}), obraNome:obraAtual().nome, atividades:ativ, naoTrab:{ ...nt, ...(doc?.naoTrab || {}) } }); novas++; }
    } else if (seg >= hojeSeg && !temReal && atuais.every(a => a.origem === "plano")){
      const chave = l => JSON.stringify(l.map(a => [a.itemContrato, a.prog]).sort());
      if (chave(atuais) === chave(Object.values(ativ))){ seg = addDays(seg, 7); continue; }   // nada mudou nesta semana
      await store.set(COL_SEMANAS, id, { ...doc, atividades:ativ, naoTrab:{ ...(doc.naoTrab || {}), ...nt } }); atualizadas++;
    } else preservadas++;
    seg = addDays(seg, 7);
  }
  return { novas, atualizadas, preservadas };
}
async function salvarPlano(p, msg){
  const c = { ...S.ext.contrato, planejamento:{ ...p, atualizadoEm:agoraIso(), atualizadoPor:S.nome || "" } };
  await store.set(COL_CONTR, S.obraId, c);
  S.planoDraft = null; await loadExtras(true);
  const r = await publicarNoDiario(plano());
  await loadWeek(); renderPlanejamento();
  toast((msg || "Programação salva.") + ` Diário: ${r.novas || r.atualizadas ? "" : "sem mudanças"}${r.novas ? r.novas + " semana(s) programada(s)" : ""}${r.atualizadas ? `, ${r.atualizadas} atualizada(s)` : ""}${r.preservadas ? `, ${r.preservadas} mantida(s) (já editadas ou com realizado)` : ""}.`);
}

async function importarMSProject(arq){
  const txt = await arq.text();
  const doc = new DOMParser().parseFromString(txt, "application/xml");
  if (doc.querySelector("parsererror") || !doc.getElementsByTagName("Task").length){ toast("Arquivo não reconhecido. No Project, use Arquivo → Salvar como → XML (*.xml).", true); return; }
  const c = S.ext.contrato, base = clone(plano() || gerarPrevia(c, $("#plIni")?.value || "2026-11-01"));
  const val = (el, tag) => el.getElementsByTagName(tag)[0]?.textContent || "";
  let atual = 0, extras = 0, metaAtual = null;
  for (const el of [...doc.getElementsByTagName("Task")]){
    if (el.parentNode?.nodeName !== "Tasks") continue;
    const nome = val(el, "Name"), ini = val(el, "Start").slice(0,10), fim = val(el, "Finish").slice(0,10), nivel = +val(el, "OutlineLevel");
    if (!nome || !ini || nivel === 0 || val(el, "IsNull") === "1") continue;
    // item do contrato pelo campo Texto1; se não houver, pelo número no começo do nome
    let item = "";
    for (const ea of el.getElementsByTagName("ExtendedAttribute")) if (val(ea, "FieldID") === "188743731") item = val(ea, "Value");
    if (!item){ const m = nome.match(/^(\d+(?:\.\d+)+)\s*-/); if (m) item = m[1]; }
    const it = item ? c.itens.find(i => i.item === item) : null;
    let t = it ? base.tarefas.find(x => x.id === it.id) : base.tarefas.find(x => norm(x.nome) === norm(nome));
    if (val(el, "Summary") === "1" && !it){ metaAtual = t?.id || metaAtual; }
    if (t){ if (t.inicio !== ini || t.fim !== fim) atual++; t.inicio = ini; t.fim = fim; continue; }
    if (val(el, "Summary") === "1") continue;
    base.tarefas.push({ id:"ext_" + uid(), tipo:"extra", nome, grupo:metaAtual, wbs:val(el, "WBS"), inicio:ini, fim:fim, pred:[] }); extras++;
  }
  base.origem = "msproject";
  base.inicio = base.tarefas.reduce((m,t) => t.inicio < m ? t.inicio : m, base.tarefas[0].inicio);
  base.fim = base.tarefas.reduce((m,t) => t.fim > m ? t.fim : m, base.inicio);
  S.planoDraft = base;
  renderPlanejamento();
  toast(`MS Project lido: ${atual} tarefa(s) com datas novas${extras ? `, ${extras} tarefa(s) que só existem no Project` : ""}. Confira e clique em Salvar.`);
}

/* ---------------- programação da semana a partir do planejamento ---------------- */
// quantidade por dia útil de cada serviço ativo na semana (quantidade contratada ÷ dias úteis da tarefa)
function programacaoDoPlano(seg, pp){
  const c = S.ext.contrato, p = pp || plano(); if (!p) return null;
  const fer = p.feriados || FERIADOS_PADRAO, out = [];
  for (const t of p.tarefas.filter(x => x.tipo === "item")){
    const it = c.itens.find(i => i.id === t.id); if (!it) continue;
    if (t.fim < seg || t.inicio > addDays(seg, 6)) continue;
    if (/km/i.test(it.un) || /^(h|mês|mes)$/i.test(it.un)) continue;   // transporte e administração não vão para a programação diária
    const dias = Math.max(1, contaUteis(t.inicio, t.fim, fer)), porDia = Math.round(it.qtd / dias * 100) / 100;
    const prog = {};
    if (porDia < 1){
      // poucas unidades (placa, mobilização...): a quantidade inteira no último dia útil da tarefa
      let ult = t.fim; while (!diaUtil(ult, fer) && ult > t.inicio) ult = addDays(ult, -1);
      const d = diasEntre(seg, ult); if (d >= 0 && d < 7) prog[d] = it.qtd;
    } else for (let d = 0; d < 7; d++){ const dia = addDays(seg, d); if (dia >= t.inicio && dia <= t.fim && diaUtil(dia, fer)) prog[d] = porDia; }
    if (Object.keys(prog).length) out.push({ id:uid(), grupo:c.itens.find(i => i.id === t.id).grupo, descricao:it.descricao.toUpperCase().slice(0, 90), unidade:it.un, itemContrato:it.id, prog });
  }
  return out;
}

/* ---------------- mapa de insumos da obra (Excel / PDF) ---------------- */
function dadosMapa(){
  const c = S.ext.contrato, reqs = S.ext.reqs.filter(reqConta);
  const porCod = {}, porServ = [];
  const pedRec = (itemC, cod) => {
    let ped = 0, rec = 0;
    for (const r of reqs) r.itens.forEach((l,k) => { if (l.insumoCod === cod && (!itemC || l.itemContrato === itemC)){ ped += Number(l.qtd) || 0; rec += recebido(r,k); } });
    return { ped, rec };
  };
  for (const it of (c?.itens || [])){
    for (const x of (it.insumos || [])){
      const orc = x.consumo * it.qtd, pr = pedRec(it.id, x.codigo);
      porServ.push({ item:it.item, servico:it.descricao, cod:x.codigo, desc:x.descricao, un:x.un, consumo:x.consumo, orc, pu:x.pu, custo:orc * x.pu, ped:pr.ped, rec:pr.rec });
      const g = porCod[x.codigo] ||= { cod:x.codigo, desc:x.descricao, un:x.un, pu:x.pu, orc:0, custo:0, servicos:[] };
      g.orc += orc; g.custo += orc * x.pu; if (!g.servicos.includes(it.item)) g.servicos.push(it.item);
    }
  }
  const consol = Object.values(porCod).map(g => { const pr = pedRec(null, g.cod); return { ...g, ped:pr.ped, rec:pr.rec }; }).sort((a,b) => b.custo - a.custo);
  const fora = [];
  for (const r of reqs) r.itens.forEach((l,k) => { if (foraPlan(l)) fora.push({ rc:rcNum(r), data:(r.criadoEm||"").slice(0,10), desc:l.descricao, qtd:l.qtd, un:l.un, motivo: l.excedente ? "acima do orçado" : "fora da composição",
    just:r.justificativa || "", status:stReq(r.status).t, pedido: r.pedido ? `${r.pedido.fornecedor} ${fmtR(r.pedido.valor)}` : "", rec:recebido(r,k) }); });
  return { consol, porServ, fora, totOrc: r2(consol.reduce((s,g) => s + g.custo, 0)) };
}

/* ======================================================================
   MEDIÇÃO: memória de cálculo por item e relatório fotográfico
   - memória fica na própria medição: m.memoria = { itemId: [{ local, ei, ef, c, l, h, n }] }
     parcial = n × C × L × H (campos vazios contam 1); sem comprimento e com estacas,
     C = estaca final − estaca inicial (estaca de 20 m; "12+5,50" = 245,50 m)
   - fotos ficam em obra_fotos/{id}: { obraId, medicaoId, item, servico, data, estaca, dataUrl }
   ====================================================================== */
const COL_FOTO = "obra_fotos";
S.memAberto = null;
S.fotosMed = { medId:null, lista:[] };

function estacaM(s){
  s = String(s ?? "").trim(); if (!s) return null;
  const m = s.match(/^(-?\d+)\s*\+\s*([\d.,]+)$/);
  if (m) return Number(m[1]) * 20 + (num(m[2]) || 0);
  const v = num(s); return v === null ? null : v * 20;
}
// tipos de memória: os campos mudam conforme o que se mede (volume, área, massa com densidade, momento de transporte com DMT...)
const TPL_MEM = {
  volume:    { t:"Volume: comprimento × largura × espessura", f:[["c","Compr. (m)"],["l","Largura (m)"],["h","Esp./alt. (m)"],["n","Qtd"]], est:true },
  volArea:   { t:"Volume: área × espessura", f:[["a","Área (m²)"],["h","Esp. (m)"],["n","Qtd"]] },
  area:      { t:"Área: comprimento × largura", f:[["c","Compr. (m)"],["l","Largura (m)"],["n","Qtd"]], est:true },
  linear:    { t:"Extensão: comprimento", f:[["c","Compr. (m)"],["n","Qtd"]], est:true },
  massa:     { t:"Massa: volume × densidade", f:[["v","Volume (m³)"],["d","Densidade (t/m³)"]] },
  massaArea: { t:"Massa: área × espessura × densidade", f:[["a","Área (m²)"],["h","Esp. (m)"],["d","Densidade (t/m³)"]] },
  taxa:      { t:"Massa: área × taxa (kg/m²) ÷ 1000", f:[["a","Área (m²)"],["tx","Taxa (kg/m²)"]], k:.001 },
  dmtMassa:  { t:"Momento de transporte: volume × densidade × DMT", f:[["v","Volume (m³)"],["d","Densidade (t/m³)"],["dmt","DMT (km)"]] },
  dmtPeso:   { t:"Momento de transporte: massa × DMT", f:[["p","Massa (t)"],["dmt","DMT (km)"]] },
  dmtVol:    { t:"Momento de transporte: volume × DMT", f:[["v","Volume (m³)"],["dmt","DMT (km)"]] },
  qtd:       { t:"Quantidade", f:[["n","Quantidade"]] }
};
function tipoPadrao(un){
  const u = String(un || "").toLowerCase().replace(/\s/g, "");
  if (/^t[x.]?km$/.test(u)) return "dmtMassa";
  if (/^m(3|³)[x.]?km$/.test(u)) return "dmtVol";
  if (/^m(3|³)$/.test(u)) return "volume";
  if (/^m(2|²)$/.test(u)) return "area";
  if (u === "m") return "linear";
  if (/^(t|ton|tonelada)$/.test(u)) return "massa";
  return "qtd";
}
const tipoMem = (i, m) => (m?.memoriaTipo?.[i.id]) || tipoPadrao(i.un);
const tipoMemId = id => { const i = S.ext.contrato?.itens?.find(x => x.id === id); return i ? tipoMem(i, S.medDraft) : "volume"; };
// valor de um campo: número, ou "=1.6.4" para usar a quantidade medida do item 1.6.4 nesta medição
function valMem(s){
  s = String(s ?? "").trim(); if (!s) return null;
  const ref = s.match(/^=\s*(\d+(?:\.\d+)+)$/);
  if (ref){ const it = S.ext.contrato?.itens?.find(i => i.item === ref[1]); const m = S.medDraft || medAtual(); return it ? Number(m?.qtd?.[it.id] || 0) : null; }
  const v = num(s); return v === null ? null : v;
}
// valores dos campos do tipo (com o comprimento vindo das estacas quando não informado)
function valoresMem(l, tk){
  const tpl = TPL_MEM[tk] || TPL_MEM.volume;
  return tpl.f.map(([k]) => {
    let v = valMem(l[k]);
    if (v === null && k === "c" && tpl.est){ const a = estacaM(l.ei), b = estacaM(l.ef); if (a !== null && b !== null) v = Math.abs(b - a); }
    return v;
  });
}
function parcialMem(l, tk){
  const tpl = TPL_MEM[tk] || TPL_MEM.volume, vs = valoresMem(l, tk);
  if (vs.every(v => v === null)) return 0;
  return r2(vs.reduce((s, v) => s * (v ?? 1), 1) * (tpl.k || 1) * 1000) / 1000;
}
const somaMem = (linhas, tk) => r2((linhas || []).reduce((s,l) => s + parcialMem(l, tk), 0) * 1000) / 1000;
function memEditor(i, m, travada){
  const linhas = m.memoria?.[i.id] || [], tk = tipoMem(i, m), tpl = TPL_MEM[tk];
  const cel = (k, l, f, ph, w) => travada ? `<td>${esc(l[f] ?? "")}</td>` : `<td><input class="ml" data-k="${k}" data-f="${f}" value="${esc(l[f] ?? "")}" placeholder="${ph}" style="width:${w}px"></td>`;
  const ncols = 2 + (tpl.est ? 2 : 0) + tpl.f.length + 1;
  return `<div class="mem"><div class="row" style="justify-content:space-between;align-items:center"><b>Memória de cálculo — ${esc(i.item)} ${esc(i.descricao.slice(0,70))} (${esc(i.un)})</b>
      ${travada ? `<small>${esc(tpl.t)}</small>` : `<label class="row" style="gap:6px">Tipo de cálculo <select data-memtipo="${i.id}">${Object.entries(TPL_MEM).map(([k, x]) => `<option value="${k}" ${k === tk ? "selected" : ""}>${esc(x.t)}</option>`).join("")}</select></label>`}</div>
    <small class="nota" style="margin:4px 0 0;display:block">Parcial = ${tpl.f.map(x => x[1].replace(/ \(.*\)/, "")).join(" × ")}${tpl.k ? " ÷ 1000" : ""} (campo vazio conta 1).${tpl.est ? " Sem comprimento, usa a distância entre as estacas (20 m por estaca; ex.: 12+5,50)." : ""} Digite <b>=1.6.4</b> num campo para usar a quantidade medida do item 1.6.4 nesta medição.</small>
    <div class="memwrap"><table class="tb memt" data-mi="${i.id}"><thead><tr><th></th><th class="l">Local / descrição</th>${tpl.est ? "<th>Est. inicial</th><th>Est. final</th>" : ""}${tpl.f.map(x => `<th>${esc(x[1])}</th>`).join("")}<th>Parcial (${esc(i.un)})</th></tr></thead><tbody>
    ${linhas.map((l,k) => `<tr data-k="${k}"><td>${travada ? "" : `<button class="x" data-memrm="${k}" title="Excluir esta linha">✕</button>`}</td>${cel(k,l,"local","ex.: Rua A, lado direito",190)}${tpl.est ? cel(k,l,"ei","0+0,00",72) + cel(k,l,"ef","12+5,00",72) : ""}${tpl.f.map(([f]) => cel(k,l,f,f === "d" ? "2,40" : "",f === "dmt" || f === "d" ? 64 : 70)).join("")}
      <td class="mp">${fmtQ(parcialMem(l, tk))}</td></tr>`).join("")}
    </tbody><tfoot><tr><td></td><td colspan="${ncols - 2}" class="l">TOTAL MEDIDO NO ITEM</td><td class="mt">${fmtQ(somaMem(linhas, tk))}</td></tr></tfoot></table></div>
    ${travada ? "" : `<div class="row" style="margin-top:6px"><button class="btn peq" data-memadd="${i.id}">+ Linha</button>${linhas.length ? `<button class="btn peq" data-memlimpa="${i.id}">Tirar memória deste item</button>` : ""}</div>`}</div>`;
}
function syncMemDom(){
  const m = S.medDraft; if (!m) return;

// reduz a foto para caber no banco (no máximo ~1600 px, JPEG)
function comprimeFoto(arq){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      let q = .78, lado = 1600, url;
      do {
        const k = Math.min(1, lado / Math.max(im.width, im.height));
        const cv = document.createElement("canvas"); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
        cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
        url = cv.toDataURL("image/jpeg", q); q -= .12; lado -= 200;
      } while (url.length > 900000 && q > .3);
      res({ dataUrl:url, w:Math.round(im.width * Math.min(1, (lado + 200) / Math.max(im.width, im.height))), h:0 });
    }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(arq);
  });
}

function lerRDO(){
  const ef = {}, eq = {};

// início do período do BM em que o dia cai (para numerar o RDO dentro da medição, como no modelo)
function inicioBM(dia){
  const meds = S.ext.meds || [];
  const m = meds.find(x => x.inicio <= dia && dia <= x.fim); if (m) return m.inicio;
  const ant = meds.filter(x => x.fim < dia).sort((a,b) => b.fim.localeCompare(a.fim))[0];
  return ant ? addDays(ant.fim, 1) : (S.ext.contrato?.inicio || plano()?.inicio || dia);
}

  const out = [];

  return out;
}

    cel("A31:A36", "PRODUÇÃO", { size:9, bold:true, fill:CINZA, bm:true });
    for (let k = 0; k < 6; k++){ cel(`B${31+k}`, k + 1, { size:9 }); cel(`C${31+k}:U${31+k}`, k < 5 ? (prod[k] || "") : prod.slice(5).join(" · "), { font:"Calibri", size:10, h:"left" }); }
    // observações
    const linhas = s => String(s || "").split(/\n+|(?<=\.)\s+(?=[A-ZÁÉÍÓÚÂÊÔÃÕÇ])/).map(x => x.trim()).filter(Boolean);
    const obsLM = linhas((w.obs || {})[d]), obsF = linhas((w.obsFisc || {})[d]);
    cel("A37:B37", "ITEM", { size:9, bold:true, bm:true }); cel("C37:U37", "", {});
    cel("A38:A42", "OBSERVAÇÕES\nLM EMPREENDIMENTOS E CONSULTORIA LTDA", { size:9, bold:true, fill:AZ, bm:true });
    for (let k = 0; k < 5; k++){ cel(`B${38+k}`, k + 1, { size:9 }); cel(`C${38+k}:U${38+k}`, k < 4 ? (obsLM[k] || "") : obsLM.slice(4).join(" "), { font:"Calibri", size:10, h:"left" }); }
    cel("A43:B43", "ITEM", { size:9, bold:true, bm:true }); cel("C43:U43", "", {});
    cel("A44:A48", "OBSERVAÇÕES \nFISCALIZAÇÃO", { size:9, bold:true, fill:LAR, bm:true });
    for (let k = 0; k < 5; k++){ cel(`B${44+k}`, k + 1, { size:9 }); cel(`C${44+k}:U${44+k}`, k < 4 ? (obsF[k] || "") : obsF.slice(4).join(" "), { font:"Calibri", size:10, h:"left" }); }
    // galeria de fotos (3 do dia)
    cel("A49:U49", "GALERIA DE FOTOS", { font:"Calibri", size:11, bold:true, bm:true });
    const fotos = (await store.list(COL_FOTO, "obraDia", S.obraId + "_" + dia)).sort((a,b) => (a.criadoEm || "").localeCompare(b.criadoEm || "")).slice(0, 3);
    const boxes = [["A50:G55","A56:G56",0,6],["H50:N55","H56:N56",7,13],["O50:U55","O56:U56",14,20]];
    const colPx = L => Math.round((({ A:8.3, R:9.4, S:8.3 })[L] || 8) * 7 + 5), boxH = 6 * 39 * 96 / 72;
    boxes.forEach(([b, lg, c1, c2], k) => {
      cel(b, "", {}); const f = fotos[k];
      cel(lg, f ? `${(f.servico || "").toUpperCase()}${f.estaca ? " — Est. " + f.estaca : ""}` : "", { size:7 });
      if (!f) return;
      const boxW = LET.slice(c1, c2 + 1).reduce((s,L) => s + colPx(L), 0) - 8, iw = f.w || 1600, ih = f.hh || 1200;
      const kk = Math.min(boxW / iw, (boxH - 8) / ih), wpx = Math.round(iw * kk), hpx = Math.round(ih * kk);
      let off = (boxW + 8 - wpx) / 2, col = c1; while (off > colPx(LET[col]) && col < c2){ off -= colPx(LET[col]); col++; }
      ws.addImage(wb.addImage({ base64:f.dataUrl, extension:"jpeg" }), { tl:{ col: col + off / colPx(LET[col]), row: 49 + ((boxH - hpx) / 2) / (39 * 96 / 72) }, ext:{ width:wpx, height:hpx } });
    });
    cel("A57:U57", "ASSINATURAS", { font:"Calibri", size:11, bold:true, bm:true });
    cel("A58:G59", "RESPONSAVEL PELA OBRA", { size:9, bold:true, v:"bottom", bm:true }); cel("H58:N59", "RESPONSAVEL TECNICO", { size:9, bold:true, v:"bottom", bm:true }); cel("O58:U59", "FISCALIZACAO", { size:9, bold:true, v:"bottom", bm:true });
    ws.pageSetup.printArea = "A1:U59";
  }
  const buf = await wb.xlsx.writeBuffer();
  baixar(new Blob([buf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), nomeArq);
  toast(`RDO gerado (${dias.length} dia${dias.length > 1 ? "s" : ""}).`);
}
document.addEventListener("click", async ev => {
  const t = ev.target.closest("button"); if (!t) return;
  try {
    if (t.id === "rdoAddMO" || t.id === "rdoAddEQ"){
      const n = (prompt(t.id === "rdoAddMO" ? "Função (ex.: SERVENTE, RASTELEIRO):" : "Equipamento (ex.: ESCAVADEIRA, CAMINHÃO BASCULANTE 18 M³):") || "").trim().toUpperCase(); if (!n) return;
      const r = lerRDO(); S.rdoExtra[t.id === "rdoAddMO" ? "mo" : "eq"].push(n);
      const card = $("#rdoCard"); const ds = String(dayIdx(S.dia));
      const tmp = { ...S.week, efetivo:{ ...(S.week.efetivo || {}), [ds]:r.ef }, equip:{ ...(S.week.equip || {}), [ds]:r.eq }, chuva:{ ...(S.week.chuva || {}), [ds]:r.chuva }, obsFisc:{ ...(S.week.obsFisc || {}), [ds]:r.obsFisc } };
      card.outerHTML = cardRDO(tmp, ds); return;
    }
    if (t.id === "rdoCopiar"){
      // procura o último dia anterior com efetivo lançado (até 4 semanas para trás)
      for (let k = 1; k <= 28; k++){
        const dia = addDays(S.dia, -k), w = await semanaDe(dia), ds = String(dayIdx(dia));
        const ef = (w.efetivo || {})[ds], eq = (w.equip || {})[ds];
        if (ef && Object.keys(ef).length || eq && Object.keys(eq).length){
          const dAt = String(dayIdx(S.dia)), r = lerRDO();
          const tmp = { ...S.week, efetivo:{ ...(S.week.efetivo || {}), [dAt]:ef || {} }, equip:{ ...(S.week.equip || {}), [dAt]:eq || {} }, chuva:{ ...(S.week.chuva || {}), [dAt]:r.chuva }, obsFisc:{ ...(S.week.obsFisc || {}), [dAt]:r.obsFisc } };
          $("#rdoCard").outerHTML = cardRDO(tmp, dAt); toast(`Copiado de ${fmtBR(dia)}. Ajuste e salve o diário.`); return;
        }
      }
      toast("Não achei efetivo lançado nas últimas 4 semanas.", true); return;
    }
    if (t.id === "rdoDia"){
      const ds = String(dayIdx(S.dia));
      if (!(S.week.atualizado || {})[ds]){ toast("Salve o diário deste dia antes de gerar o RDO.", true); return; }
      delete semanasCache[S.obraId + "_" + S.semana];
      if (S.ext.obraId !== S.obraId) await loadExtras();
      await exportarRDO([S.dia], `RDO ${S.dia.slice(8,10)}-${S.dia.slice(5,7)}-${S.dia.slice(0,4)} - ${obraAtual().nome}.xlsx`); return;
    }
    if (t.id === "rdoPeriodo"){
      const m = medAtual(); for (const k of Object.keys(semanasCache)) delete semanasCache[k];
      const dias = await diasComDiario(m.inicio, m.fim);
      await exportarRDO(dias, `RDO BM ${String(m.numero).padStart(2,"0")} - ${obraAtual().nome}.xlsx`); return;
    }
  } catch(e){ console.error(e); toast("Erro: " + e.message, true); }
});

async function carregaObras(){ S.obras = await store.list(COL_OBRAS); }
function senhaValida(senha, id){
  if (!senha) return true; // sem senha: só a senha geral acessa a obra
  if (senha.length < 4){ toast("A senha da obra precisa ter ao menos 4 caracteres.", true); return false; }
  if (senha === SITE_PASSWORD){ toast("A senha da obra não pode ser igual à senha geral.", true); return false; }
  if (S.obras.find(o => o.id !== id && o.senha === senha)){ toast("Essa senha já é usada em outra obra.", true); return false; }
  return true;
}

async function abrir(){
  $("#gate").style.display = "none";
  renderObraSel();
  aplicaAcessoUI();
  await loadWeek();
  render();
}

async function boot(){
  document.body.insertAdjacentHTML("beforeend", `<datalist id="unidades">${UNIDADES.map(u => `<option value="${u}">`).join("")}</datalist>`);
  try {
    await initDb();
    await carregaObras();
  } catch(e){
    console.error(e);
    $("#gateMsg").innerHTML = `Não foi possível conectar ao banco de dados.<br>${esc(e.message)}<br><a href="#" onclick="location.reload()">Tentar de novo</a>`;
    return;
  }
  // a senha guardada neste aparelho é revalidada a cada abertura (se a senha da obra mudar, perde o acesso)
  S.acesso = resolveAcesso(localStorage.getItem("diarioLM_senha"));
  if (S.acesso){ await abrir(); return; }
  localStorage.removeItem("diarioLM_senha");
  $("#gateMsg").textContent = "Digite a senha da sua obra (ou a senha geral).";
  $("#gatePwd").disabled = false; $("#gateBtn").disabled = false;
  const tenta = async () => {
    const senha = $("#gatePwd").value.trim();
    const ac = resolveAcesso(senha);
    if (!ac){ toast("Senha incorreta.", true); $("#gatePwd").select(); return; }
    S.acesso = ac; localStorage.setItem("diarioLM_senha", senha);
    await abrir();
  };
  $("#gateBtn").onclick = tenta;
  $("#gatePwd").addEventListener("keydown", e => { if (e.key === "Enter") tenta(); });
  $("#gatePwd").focus();
}
const TEMAS = { escuro:"🌙 Escuro", claro:"☀️ Claro", auto:"🖥️ Automático" };
function aplicaTema(p){
  const c = p === "auto" ? (matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "escuro") : p;
  document.documentElement.dataset.tema = c; document.documentElement.dataset.temaPref = p;
  $("#temaBtn").textContent = TEMAS[p];
  try { localStorage.setItem("lmTema", p); } catch(e){}
}
aplicaTema(document.documentElement.dataset.temaPref || "escuro");
$("#temaBtn").onclick = () => { const ordem = ["escuro","claro","auto"], p = document.documentElement.dataset.temaPref || "escuro"; aplicaTema(ordem[(ordem.indexOf(p) + 1) % 3]); };
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (document.documentElement.dataset.temaPref === "auto") aplicaTema("auto"); });
$("#sair").onclick = () => { if (confirm("Sair e digitar outra senha?")){ localStorage.removeItem("diarioLM_senha"); location.reload(); } };
localStorage.removeItem("diarioLM_ok");
boot();
</script>
