<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão de Obras — LM</title>
<link rel="icon" href="logo-setor.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --azul:#1F497D; --azul2:#0070C0; --azulClaro:#DCE6F1; --acc:#4F81BD;
    --bg:#F3F5F9; --card:#fff; --txt:#1d2433; --mut:#6b7385; --borda:#d9dee8;
    --ok:#1e8e3e; --erro:#c62828; --ader:#C1FFDD;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  button,input,select,textarea{font:inherit}
  input,select,textarea{font-size:16px}
  .topo{position:sticky;top:0;z-index:20}
  header{background:var(--azul);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header img{height:34px;background:#fff;border-radius:6px;padding:2px 4px}
  header img.setor{height:40px;width:40px;padding:1px;border-radius:50%}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
  header .sp{flex:1}
  header select{min-width:200px;max-width:100%;padding:7px 10px;border-radius:8px;border:0}
  .badge{background:#ffb300;color:#000;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
  nav{display:flex;gap:4px;padding:8px 16px 0;background:var(--azul);overflow-x:auto}
  nav button{background:transparent;border:0;color:#cfe0f5;padding:9px 14px;border-radius:10px 10px 0 0;font-weight:600;cursor:pointer;white-space:nowrap}
  nav button.on{background:var(--bg);color:var(--azul)}
  main{max-width:1180px;margin:0 auto;padding:16px 16px 110px}
  .view{display:none}.view.on{display:block}
  .card{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:15px;color:var(--azul)}
  .grp{font-weight:700;color:#fff;background:var(--acc);border-radius:8px;padding:6px 10px;margin:14px 0 8px;font-size:14px}
  .act{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;border-bottom:1px solid #eef1f6;padding:10px 0}
  .act:last-child{border-bottom:0}
  .act .d{font-weight:600}
  .act .m{color:var(--mut);font-size:13px}
  .act input{width:118px;text-align:right;padding:9px 10px;border:1px solid var(--borda);border-radius:8px}
  .act .un{color:var(--mut);font-size:13px;margin-left:4px}
  .daybar,.weekbar{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
  .daybar button,.weekbar button{width:42px;height:42px;border-radius:10px;border:1px solid var(--borda);background:#fff;font-size:20px;cursor:pointer}
  .daybar input{padding:8px 10px;border:1px solid var(--borda);border-radius:8px}
  .daybar .wd,.weekbar .wk{font-weight:700;color:var(--azul);min-width:70px;text-align:center}
  .clima{display:grid;grid-template-columns:70px repeat(3,1fr);gap:6px;align-items:center}
  .clima b{font-size:13px;color:var(--mut)}
  .clima button{padding:9px 4px;border-radius:8px;border:2px solid var(--borda);background:#fff;cursor:pointer;font-weight:600;font-size:13px}
  .clima button.sel{border-color:#000}
  textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--borda);border-radius:8px;resize:vertical}
  .btn{padding:10px 16px;border-radius:10px;border:1px solid var(--borda);background:#fff;cursor:pointer;font-weight:600}
  .btn.pri{background:var(--azul2);border-color:var(--azul2);color:#fff}
  .btn.peq{padding:6px 10px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--borda);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:30}
  .savebar .btn{min-width:240px}
  .np-new{display:grid;grid-template-columns:1fr 70px 95px 95px 36px;gap:6px;margin-top:8px}
  @media (max-width:600px){ .np-new{grid-template-columns:1fr 1fr 1fr 36px} .np-new .npd{grid-column:1/-1} }
  .np2{display:flex;gap:6px;align-items:center}
  .np2 input{width:84px!important}
  .np2 small{color:var(--mut);font-size:11px;display:block;text-align:center}
  .ntchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .ntchips button{padding:7px 10px;border-radius:8px;border:1px solid var(--borda);background:#fff;cursor:pointer;font-size:13px}
  .ntchips button.on{background:#A6A6A6;color:#000;border-color:#888;font-weight:700}
  table.sem td.nt{background:#A6A6A6!important}
  table.sem td.adr{background:#FF0000;color:#fff;font-weight:700}
  table.sem td.adg{background:#92D050;font-weight:700}
  .av{display:grid;grid-template-columns:1.4fr 1fr 90px 90px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eef1f6}
  .av input{padding:8px;border:1px solid var(--borda);border-radius:8px;min-width:0}
  @media (max-width:700px){ .av{grid-template-columns:1fr 1fr} .av b{grid-column:1/-1} }
  .np-new input,.np-new select{padding:9px;border:1px solid var(--borda);border-radius:8px;min-width:0}
  .x{border:0;background:#fde8e8;color:var(--erro);border-radius:8px;cursor:pointer;font-weight:700}
  .vazio{color:var(--mut);text-align:center;padding:24px}
  .info{background:#fff8e1;border:1px solid #ffe08a;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
  /* Programação */
  .pa{border:1px solid var(--borda);border-radius:10px;padding:10px;margin-bottom:10px;background:#fff}
  .pa .top{display:grid;grid-template-columns:170px 1fr 90px 110px auto;gap:6px}
  .pa input,.pa select{padding:8px;border:1px solid var(--borda);border-radius:8px;min-width:0;width:100%}
  .pa .dias{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
  .pa .dias label{font-size:11px;color:var(--mut);text-align:center;display:block}
  .pa .dias input{text-align:right;padding:7px 5px}
  .pa .dias .fds input{background:#f2f2f2}
  .pa .ctl{display:flex;gap:4px}
  .pa .ctl button{width:34px;height:36px;border-radius:8px;border:1px solid var(--borda);background:#fff;cursor:pointer}
  .pa .lbl{font-size:11px;color:var(--mut)}
  @media (max-width:700px){ .pa .top{grid-template-columns:1fr 1fr} .pa .top .desc{grid-column:1/-1} .pa .ctl{grid-column:1/-1;justify-content:flex-end} }
  /* Semana */
  .tbwrap{overflow-x:auto;border:1px solid var(--borda);border-radius:10px;background:#fff}
  table.sem{border-collapse:collapse;font-size:13px;min-width:900px;width:100%}
  table.sem th,table.sem td{border:1px solid #c9d1de;padding:5px 6px;text-align:center;white-space:nowrap}
  table.sem th{background:#fff;color:var(--azul)}
  table.sem td.desc{text-align:left;white-space:normal;min-width:200px}
  table.sem tr.g td{background:var(--acc);color:#fff;font-weight:700}
  table.sem tr.p td.v,table.sem tr.p td.pr{background:var(--azulClaro)}
  table.sem td.ad{background:var(--ader);font-weight:700}
  table.sem td.baixo{color:#C00000;font-weight:700}
  table.sem th.fds{background:#efefef}
  /* Obras */
  .ob{display:grid;grid-template-columns:1.4fr 1fr 130px auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eef1f6}
  .ob input{padding:8px;border:1px solid var(--borda);border-radius:8px;min-width:0}
  .ob.inativa{opacity:.55}
  @media (max-width:700px){ .ob{grid-template-columns:1fr 1fr} }
  #sair{background:transparent;color:#fff;border:1px solid #8fb0d9;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
  #acessoLbl{font-size:12px;color:#cfe0f5}
  .rel{width:1400px;background:#fff;color:#000;padding:16px;border:2px solid #000;font-family:"Aptos Narrow","Calibri","Arial Narrow",Arial,sans-serif}
  .rel table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:13px}
  .rel td{border:1px solid #000;text-align:center;vertical-align:middle;padding:2px 4px;height:22px;overflow:hidden;word-wrap:break-word}
  .rel td.nb{border:none;background:#fff}
  .rel td.l{text-align:left}.rel td.r{text-align:right;padding-right:8px}
  .rel .b,.rel .b td{font-weight:700}
  .rel tr.sp td{height:12px}
  .rel .rod{font-size:10px;color:#7f7f7f;font-style:italic;margin-top:6px}
  #toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
  #toast.on{opacity:1}#toast.err{background:var(--erro)}
  #gate{position:fixed;inset:0;background:var(--azul);display:flex;align-items:center;justify-content:center;z-index:100}
  #gate .box{background:#fff;border-radius:14px;padding:24px;width:min(340px,90vw);text-align:center}
  #gate input{width:100%;padding:11px;border:1px solid var(--borda);border-radius:8px;margin:12px 0}
  .kpi{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .kpi div{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:8px 12px}
  .kpi b{display:block;font-size:20px;color:var(--azul)}
  .kpi span{font-size:12px;color:var(--mut)}
  /* contrato · medições · compras */
  .dados{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 18px;margin-top:10px}
  .dados div{display:flex;flex-direction:column;gap:2px;min-width:0}
  .dados .full{grid-column:1/-1}
  .dados span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
  .dados b{font-weight:600;word-break:break-word}
  .kpi div{min-width:150px;flex:1}
  table.tb{border-collapse:collapse;width:100%;font-size:13px}
  table.tb th,table.tb td{border-bottom:1px solid var(--borda);padding:7px 8px;text-align:center;vertical-align:middle}
  table.tb th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--azul);white-space:nowrap;background:#fff;position:sticky;top:0;z-index:1}
  table.tb .l{text-align:left}
  table.tb small{color:var(--mut);font-size:11px}
  table.tb tr.g td{background:var(--azulClaro);font-weight:700;font-size:12px}
  table.tb tfoot td{font-weight:700;background:#f3f5f9}
  table.tb tfoot tr.real td{color:var(--azul2)}
  table.tb tr.estouro td{background:#fde8e8}
  table.tb tr.atraso td:first-child{box-shadow:inset 3px 0 0 var(--erro)}
  table.tb tr.melhor td{background:rgba(30,142,62,.08)}
  table.tb input{width:110px;text-align:right;padding:7px 8px;border:1px solid var(--borda);border-radius:8px}
  table.tb input.pct{width:72px}
  table.tb input.erro,.rqlin input.erro{border-color:var(--erro)!important}
  table.med td:nth-child(2){min-width:240px}
  .neg{color:var(--erro)!important;font-weight:700}.pos{color:var(--ok)!important;font-weight:700}
  .nota{font-size:12px;color:var(--mut);margin:8px 0 0}
  .barra{height:6px;border-radius:6px;background:#e7ebf2;overflow:hidden;min-width:60px}
  .barra i{display:block;height:100%;background:var(--azul2);border-radius:6px}
  .barra i.estouro{background:var(--erro)}
  .barlinha{display:grid;grid-template-columns:minmax(120px,1fr) 2fr auto;gap:10px;align-items:center;padding:5px 0;font-size:13px}
  .chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;
    color:var(--c);border:1px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
  .pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
  .pipe div{background:var(--card);border:1px solid var(--borda);border-top:3px solid var(--c);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column}
  .pipe span{font-size:11px;color:var(--mut);text-transform:uppercase}
  .pipe b{font-size:22px;color:var(--c)}
  .pipe small{font-size:11px;color:var(--mut)}
  .trilha{display:flex;gap:6px;flex-wrap:wrap}
  .trilha div{flex:1;min-width:120px;display:flex;flex-direction:column;gap:3px;opacity:.45;font-size:12px}
  .trilha div i{height:5px;border-radius:5px;background:var(--c)}
  .trilha div.ok{opacity:1}
  .trilha small{color:var(--mut)}
  .form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
  .form label,main label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
  .row > label{flex-direction:row;align-items:center;gap:6px}
  .form .full,label.full{grid-column:1/-1}
  .form input,.form textarea,.row input[type=date],.imp textarea,label.full textarea,#reqFiltro,.ic select{padding:8px 10px;border:1px solid var(--borda);border-radius:8px;width:100%;min-width:0}
  .form label.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--txt)}
  .form label.chk input{width:auto}
  .imp textarea{min-height:110px;margin:10px 0;font-family:ui-monospace,monospace;font-size:12px}
  .imp p{font-size:13px;color:var(--mut)}
  .rqlin{display:grid;grid-template-columns:2fr 90px 80px 2fr 36px;gap:6px;margin-bottom:6px}
  .rqlin.cot{grid-template-columns:1.4fr 130px 130px 2fr auto}
  .rqlin input,.rqlin select{padding:8px;border:1px solid var(--borda);border-radius:8px;min-width:0}
  @media (max-width:700px){ .rqlin,.rqlin.cot{grid-template-columns:1fr 1fr} .rqlin [data-f=descricao],.rqlin select,#ctForn,#ctObs{grid-column:1/-1} }
  .ic{margin-top:8px}
  .rdogrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
  @media (max-width:800px){ .rdogrid{grid-template-columns:1fr} }
  table.tb.rdot td,table.tb.rdot th{padding:2px 6px;font-size:12px}
  .rdot input{width:58px!important;height:26px;text-align:center;padding:2px 4px!important;font-size:13px!important;border:1px solid var(--borda);border-radius:6px}
  tr.memrow > td{background:rgba(0,112,192,.04);padding:10px}
  .mem .memt{margin-top:0;width:auto;min-width:100%}
  .memwrap{overflow-x:auto;margin-top:8px;max-width:calc(100vw - 80px);position:sticky;left:0}
  .mem{position:sticky;left:0;max-width:calc(100vw - 80px)}
  .mem .memt td,.mem .memt th{padding:5px 6px;white-space:nowrap}
  .mem .memt td:first-child{width:34px}
  .mem select{padding:6px 8px;border:1px solid var(--borda);border-radius:8px;max-width:100%}
  .mem .memt input{width:auto;text-align:left;padding:5px 6px;border:1px solid var(--borda);border-radius:6px}
  .mem .memt td.mp,.mem .memt td.mt{font-weight:700}
  .fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:10px}
  .foto{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--borda);border-radius:10px}
  .foto img{width:100%;height:170px;object-fit:cover;border-radius:6px;background:#000}
  .foto select,.foto input{width:100%;padding:6px 8px;border:1px solid var(--borda);border-radius:6px;min-width:0}
  table.gantt th.gt,table.gantt td.gt{min-width:460px;width:46%;padding:4px 8px}
  table.gantt td.l{min-width:280px;max-width:380px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.gantt td,table.gantt th{padding-top:4px;padding-bottom:4px}
  table.gantt input[type=date]{font-size:12px}
  table.gantt input[type=date]{width:132px;padding:5px;border:1px solid var(--borda);border-radius:8px}
  table.gantt input.pp,table.gantt input.pe{padding:4px 6px;text-align:right;border:1px solid var(--borda);border-radius:6px}
  .regua{position:relative;height:18px}
  .regua span{position:absolute;top:0;font-size:10px;text-align:center;border-left:1px solid var(--borda);white-space:nowrap;overflow:hidden}
  .trilho{position:relative;height:16px}
  .trilho b{position:absolute;top:3px;height:10px;border-radius:5px;background:var(--azul2);overflow:hidden}
  .trilho b.bm{top:5px;height:6px;background:var(--azul);border-radius:2px}
  .trilho b.bp{opacity:.45}
  .trilho b u{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
  .trilho .hojeln{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--erro);opacity:.7}
  .card.previa{border-left:4px solid var(--azul2)}
  table.hist input.hq{width:62px;padding:6px}
  table.hist input.hc{width:110px;padding:6px}
  table.hist select{padding:6px;border:1px solid var(--borda);border-radius:8px}
  table.hist input::placeholder{color:#9aa3b5}
  .rqlin2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,2fr) 110px 80px 36px;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--borda)}
  .rqlin2 select,.rqlin2 input{padding:8px;border:1px solid var(--borda);border-radius:8px;min-width:0;width:100%}
  .rqlin2 [data-f=descricao]{grid-column:1/-1;grid-row:2}
  .rqlin2 .orc{grid-column:1/-1;font-size:12px;color:var(--mut);padding:6px 8px;border-radius:8px;background:rgba(30,142,62,.07)}
  .rqlin2 .orc.passa{background:rgba(255,179,0,.14);color:#8a5a00}
  @media (max-width:700px){ .rqlin2{grid-template-columns:1fr 1fr 36px} .rqlin2 select{grid-column:1/-1} .rqlin2 [data-f=descricao]{grid-row:auto} }
  table.tb tr.foraplan td{background:rgba(255,179,0,.08)}
  .rqx{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
  .rqx label{flex-direction:row!important;align-items:center;gap:6px}
  .rqx input{width:150px}.rqx select{width:auto}
  .eqbox{margin-top:12px;padding:10px 12px;border:1px dashed var(--borda);border-radius:10px}
  #rqEqSel{padding:8px;border:1px solid var(--borda);border-radius:8px;max-width:100%;min-width:0;flex:1}
  .eqbox .form input,.eqbox .form select{padding:8px 10px;border:1px solid var(--borda);border-radius:8px;width:100%}
  .dados small{font-size:11px;color:var(--mut)}
  .teto{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding:10px 12px;border:1px solid var(--borda);border-left:4px solid var(--azul2);border-radius:10px}
  .teto span{font-size:11px;text-transform:uppercase;color:var(--mut)}
  .teto b{font-size:18px}
  .teto small{color:var(--mut);font-size:11px}
  .hist{font-size:13px;padding:5px 0;border-bottom:1px solid #eef1f6}
  details summary{cursor:pointer;color:var(--azul);font-weight:600;font-size:13px}
  .btn.on{background:var(--azul2);color:#fff;border-color:var(--azul2)}
  .view label{color:var(--mut)}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="tema-lm">
/* ==========================================================================
   TEMA LM — mesmo visual do Portal LM (escuro / futurista).
   Vale só para a tela (@media screen): impressão, PDF, imagem e Excel
   exportados continuam com o desenho original.
   ========================================================================== */
@media screen{
  :root{
    color-scheme:dark;
    --lm-bg:#050B14; --lm-bg2:#0A1626; --lm-glass:rgba(16,32,52,.62); --lm-glass2:rgba(24,46,72,.72);
    --lm-line:rgba(61,242,255,.16); --lm-line2:rgba(61,242,255,.3); --lm-cyan:#3DF2FF; --lm-acc:#00A3DA;
    --lm-acc2:#0B83B2; --lm-violet:#7B5CFF; --lm-text:#E6F4FF; --lm-muted:#8AA4BC; --lm-input:rgba(0,0,0,.32);
    --lm-ok:#2BFF9A; --lm-warn:#FFC14D; --lm-err:#FF6B7A;
  }
  html{background:var(--lm-bg)!important}
  body{background:transparent!important;color:var(--lm-text);font-family:Montserrat,"Segoe UI",system-ui,sans-serif}
  body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:radial-gradient(600px 400px at 12% 6%,rgba(0,163,218,.2),transparent 70%),

const parseIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseIso(s); d.setDate(d.getDate()+n); return iso(d); };
const mondayOf = s => { const d = parseIso(s); d.setDate(d.getDate() - (d.getDay()+6)%7); return iso(d); };
const dayIdx = s => (parseIso(s).getDay()+6)%7;
const fmtBR = s => s ? s.split("-").reverse().join("/") : "";
const fmtCurto = s => { const [,m,d] = s.split("-"); return `${d}/${m}`; };
const hoje = () => iso(new Date());
const ontem = () => addDays(hoje(), -1);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const norm = s => String(s||"").trim().toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function num(v){
  if (v === null || v === undefined) return null;
  let s = String(v).trim(); if (!s) return null;
  if (s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");   // "1.500" = mil e quinhentos (como a tela mostra)
  const n = Number(s); return isFinite(n) ? n : null;
}
const fmtNum = n => (n === null || n === undefined || n === "") ? "" : Number(n).toLocaleString("pt-BR",{maximumFractionDigits:2});
const fmtPct = n => n === null ? "—" : Math.round(n*100) + "%";
function toast(msg, err){
  const t = $("#toast"); t.textContent = msg; t.className = "on" + (err ? " err" : "");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = "", 3200);
}

/* ------------------------------ armazenamento ------------------------------ */
const DEL = { __del: true };
let fs = null, db = null;
const LS_KEY = "diarioLM_local";
const localData = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } };
const localSave = d => localStorage.setItem(LS_KEY, JSON.stringify(d));
const clone = o => JSON.parse(JSON.stringify(o));

const store = {
  async del(col, id){
    if (LOCAL){ const d = localData(); if (d[col]) delete d[col][id]; localSave(d); return; }
    await fs.deleteDoc(fs.doc(db,col,id));
  },
  async list(col, field, val){
    if (LOCAL){
      const c = localData()[col] || {};
      return Object.entries(c).map(([id,v]) => ({ id, ...v })).filter(r => !field || r[field] === val);
    }
    const q = field ? fs.query(fs.collection(db,col), fs.where(field,"==",val)) : fs.collection(db,col);
    const snap = await fs.getDocs(q);
    return snap.docs.map(d => ({ id:d.id, ...d.data() }));
  },
  async get(col, id){
    if (LOCAL){ const v = (localData()[col] || {})[id]; return v ? clone(v) : null; }
    const s = await fs.getDoc(fs.doc(db,col,id));
    return s.exists() ? s.data() : null;
  },
  async set(col, id, data){
    if (LOCAL){ const d = localData(); (d[col] ||= {})[id] = clone(data); localSave(d); return; }
    await fs.setDoc(fs.doc(db,col,id), data);
  },
  // paths: { "a.b.c": valor | DEL } — só mexe nos campos indicados
  async patch(col, id, paths){
    if (LOCAL){
      const d = localData(); const docu = (d[col] ||= {})[id] ||= {};
      for (const [p,v] of Object.entries(paths)){
        const ks = p.split("."); let o = docu;
        for (const k of ks.slice(0,-1)) o = (o[k] && typeof o[k] === "object") ? o[k] : (o[k] = {});
        const last = ks[ks.length-1];
        if (v === DEL) delete o[last]; else o[last] = clone(v);
      }
      localSave(d); return;
    }
    const upd = {};
    for (const [p,v] of Object.entries(paths)) upd[p] = v === DEL ? fs.deleteField() : v;
    await fs.updateDoc(fs.doc(db,col,id), upd);
  }
};

async function initDb(){
  if (LOCAL){ $("#modo").innerHTML = '<span class="badge">MODO TESTE (local)</span>'; return; }
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const app = initializeApp(firebaseConfig);
  db = fs.initializeFirestore(app, { experimentalAutoDetectLongPolling:true, useFetchStreams:false });
}

};
const podeVer = o => S.acesso?.geral || (S.acesso?.ids || []).includes(o.id);
function resolveAcesso(senha){
  if (!senha) return null;
  if (senha === SITE_PASSWORD) return { geral:true };
  const ids = S.obras.filter(o => o.ativa !== false && o.senha && o.senha === senha).map(o => o.id);
  return ids.length ? { geral:false, ids } : null;
}
const weekId = (obraId, inicio) => `${obraId}_${inicio}`;
const blankWeek = (obraId, inicio) => ({ obraId, inicio, atividades:{}, naoProg:{}, clima:{}, obs:{}, atualizado:{} });
const obraAtual = () => S.obras.find(o => o.id === S.obraId);

async function getWeek(obraId, inicio){
  const w = await store.get(COL_SEMANAS, weekId(obraId, inicio));
  return Object.assign(blankWeek(obraId, inicio), w || {}, { _existe: !!w });
}
async function patchWeek(paths){
  const id = weekId(S.obraId, S.semana);
  const atual = await store.get(COL_SEMANAS, id);
  if (!atual){
    const o = obraAtual();
    await store.set(COL_SEMANAS, id, { ...blankWeek(S.obraId, S.semana), obraNome: o?.nome || "" });
  }
  paths.obraNome = obraAtual()?.nome || "";
  await store.patch(COL_SEMANAS, id, paths);
}
async function loadWeek(){
  if (!S.obraId){ S.week = null; return; }
  S.week = await getWeek(S.obraId, S.semana);
  S.draft = null;
}

// atividades ordenadas e agrupadas, com numeração de item igual ao modelo (1.g.a)
function estrutura(w){
  const acts = Object.entries(w.atividades || {}).map(([id,a]) => ({ id, ...a })).sort((a,b) => (a.ordem??0)-(b.ordem??0));
  const grupos = [];
  for (const a of acts){
    let g = grupos.find(g => norm(g.nome) === norm(a.grupo));
    if (!g){ g = { nome: a.grupo || "SEM GRUPO", acts: [] }; grupos.push(g); }
    g.acts.push(a);
  }
  grupos.forEach((g,gi) => { g.item = `1.${gi+1}`; g.acts.forEach((a,ai) => a.item = `1.${gi+1}.${ai+1}`); });
  return grupos;
}
// dias não trabalhados da semana (padrão: domingo)
const naoTrab = w => w.naoTrab || { "6": true };
const naoProgList = w => Object.entries(w.naoProg || {}).map(([id,a]) => ({ id, ...a })).sort((a,b) => (a.ordem??0)-(b.ordem??0));
const val = (m, d) => (m && m[d] !== undefined && m[d] !== null) ? Number(m[d]) : null;

// aderência acumulada até o dia "ate" (índice 0..6): soma realizado / soma programado
function aderencia(a, ate){
  let p = 0, r = 0;
  for (let d = 0; d <= ate; d++){ p += val(a.prog,d) || 0; r += val(a.real,d) || 0; }
  return p > 0 ? r/p : null;
}
function aderenciaMedia(w, ate){
  const xs = Object.values(w.atividades || {}).map(a => aderencia(a, ate)).filter(x => x !== null);
  return xs.length ? xs.reduce((s,x) => s+x, 0)/xs.length : null;
}
const somaSemana = m => { let s = 0, tem = false; for (let d = 0; d < 7; d++){ const v = val(m,d); if (v !== null){ s += v; tem = true; } } return tem ? s : null; };

function renderDiario(){

  if (!S.obraId){ el.innerHTML = semObra(); setSavebar(""); return; }
  const w = S.week, d = dayIdx(S.dia), ds = String(d);

  S.clima = clone((w.clima || {})[ds] || {});
  const atu = (w.atualizado || {})[ds];
  let h = `<div class="daybar">
      <button data-navdia="-1" aria-label="Dia anterior">‹</button>
      <input type="date" id="diaInp" value="${S.dia}">
      <span class="wd">${DIAS_LONGO[d]}</span>
      <button data-navdia="1" aria-label="Próximo dia">›</button>
    </div>`;
  h += `<div class="row" style="justify-content:space-between;margin-bottom:10px">
      <span style="color:var(--mut);font-size:13px">Engenheiro: <b>${esc(S.nome || "—")}</b> <a href="#" id="trocaNome">trocar</a></span>
      <span style="color:var(--mut);font-size:13px">${atu ? `Salvo por ${esc(atu.por)} em ${new Date(atu.em).toLocaleString("pt-BR")}` : "Ainda não preenchido"}</span>
    </div>`;

  if (naoTrab(w)[ds]) h += `<div class="info">Este dia está marcado como <b>não trabalhado</b> na programação da semana.</div>`;
  if (S.ext.obraId !== S.obraId) loadExtras().then(() => { if (S.tab === "diario" && !estrutura(S.week).length) renderDiario(); }).catch(console.error);
  const plD = S.ext.obraId === S.obraId ? plano() : null;
  if (!grupos.length && plD){
    const iniD = proxUtil(plD.inicio, plD.feriados || FERIADOS_PADRAO);
    if (addDays(S.semana, 6) < iniD)
      h += `<div class="info">A obra começa em <b>${fmtBR(iniD)}</b> (Planejamento). O diário fica disponível a partir da semana de início. <button class="btn peq" data-irinicio>Ir para o início da obra</button></div>`;
    else {
      const n = (programacaoDoPlano(S.semana) || []).length;
      h += `<div class="info">A <b>Programação desta semana</b> ainda não foi salva${n ? ` — o Planejamento prevê <b>${n} serviço(s)</b> para ela` : ""}. Abra a programação, confira e salve para lançar o realizado aqui.
        <button class="btn pri peq" data-abreprog>Abrir Programação da semana</button></div>`;
    }
  } else if (!grupos.length){
    h += `<div class="info">Não há atividades programadas para a semana de ${fmtBR(S.semana)}. Cadastre em <b>Programação da semana</b>
      (ou lance abaixo como atividade não programada).</div>`;
  } else {
    h += `<div class="card"><h3>Produção realizada — ${fmtBR(S.dia)}</h3>`;
    for (const g of grupos){
      h += `<div class="grp">${g.item} · ${esc(g.nome)}</div>`;
      for (const a of g.acts){
        const p = val(a.prog,d), r = val(a.real,d);
        const sp = somaSemana(a.prog), sr = somaSemana(a.real);
        h += `<div class="act">
          <div><div class="d">${esc(a.descricao)}</div>
            <div class="m">Programado hoje: <b>${p===null?"—":fmtNum(p)+" "+esc(a.unidade)}</b> · Semana: ${fmtNum(sr)||0} / ${fmtNum(sp)||0} ${esc(a.unidade)}</div></div>
          <div><input inputmode="decimal" data-real="${a.id}" value="${r===null?"":fmtNum(r)}" placeholder="0"><span class="un">${esc(a.unidade)}</span></div>
        </div>`;
      }
    }
    h += `</div>`;
  }

  // não programadas
  const nps = naoProgList(w);
  h += `<div class="card"><h3>Atividades não programadas</h3>`;
  for (const a of nps){
    const p = val(a.prog,d), r = val(a.real,d);
    h += `<div class="act"><div><div class="d">${esc(a.descricao)}</div><div class="m">Semana: ${fmtNum(somaSemana(a.real))||0} / ${fmtNum(somaSemana(a.prog))||0} ${esc(a.unidade)}</div></div>
      <div class="np2"><div><small>Prog.</small><input inputmode="decimal" data-npp="${a.id}" value="${p===null?"":fmtNum(p)}" placeholder="0"></div>
        <div><small>Real.</small><input inputmode="decimal" data-np="${a.id}" value="${r===null?"":fmtNum(r)}" placeholder="0"></div><span class="un">${esc(a.unidade)}</span></div></div>`;
  }
  h += `<div id="npNovos"></div><button class="btn peq" id="addNp" style="margin-top:10px">+ Atividade não programada</button></div>`;

  // clima
  h += `<div class="card"><h3>Clima</h3><div class="clima">`;
  for (const [k,lbl] of TURNOS){
    h += `<b>${lbl}</b>` + CLIMAS.map(c => `<button data-clima="${k}" data-v="${c.k}" style="background:${S.clima[k]===c.k?c.cor:"#fff"};color:${S.clima[k]===c.k?c.txt:"#000"}" class="${S.clima[k]===c.k?"sel":""}">${c.k}</button>`).join("");
  }
  h += `</div></div>`;

  h += `<div class="card"><h3>Observações do dia</h3><textarea id="obsInp" placeholder="Ocorrências, equipamento parado, falta de material, interferências...">${esc((w.obs||{})[ds] || "")}</textarea></div>`;
  h += cardRDO(w, ds);
  h += cardFotosDia();
  el.innerHTML = h;
  setSavebar(`<button class="btn pri" id="salvarDia">Salvar diário de ${fmtCurto(S.dia)}</button>`);
  desenhaFotosDia().catch(e => { console.error(e); const b = $("#fotosDiaGrade"); if (b) b.innerHTML = `<div class="vazio">Erro ao carregar fotos: ${esc(e.message)}</div>`; });
}

async function ensureNome(){
  if (S.nome) return true;
  const n = prompt("Seu nome (fica registrado em quem preencheu o diário):");
  if (!n || !n.trim()) return false;
  S.nome = n.trim(); localStorage.setItem("diarioLM_nome", S.nome); return true;
}

async function salvarDiario(){
  if (!await ensureNome()) return;
  const ds = String(dayIdx(S.dia));
  const paths = {};
  let erro = false;
  $$("[data-real]").forEach(i => {
    const v = num(i.value); if (i.value.trim() && v === null) erro = true;
    paths[`atividades.${i.dataset.real}.real.${ds}`] = v === null ? DEL : v;
  });
  $$("[data-np]").forEach(i => {
    const v = num(i.value); if (i.value.trim() && v === null) erro = true;
    paths[`naoProg.${i.dataset.np}.real.${ds}`] = v === null ? DEL : v;
  });
  $$("[data-npp]").forEach(i => {
    const v = num(i.value); if (i.value.trim() && v === null) erro = true;
    paths[`naoProg.${i.dataset.npp}.prog.${ds}`] = v === null ? DEL : v;
  });
  let ordem = naoProgList(S.week).length;
  for (const row of $$(".np-new")){
    const desc = row.querySelector(".npd").value.trim(); if (!desc) continue;
    const q = num(row.querySelector(".npq").value), pq = num(row.querySelector(".npp").value);
    if ((row.querySelector(".npq").value.trim() && q === null) || (row.querySelector(".npp").value.trim() && pq === null)) erro = true;
    paths[`naoProg.${uid()}`] = { ordem: ordem++, descricao: desc.toUpperCase(), unidade: row.querySelector(".npu").value.trim() || "un",
      prog: pq === null ? {} : { [ds]: pq }, real: q === null ? {} : { [ds]: q } };
  }
  if (erro){ toast("Há um valor que não é número. Use apenas números (ex.: 12,5).", true); return; }
  if ($("#rdoCard")){
    const r = lerRDO();
    paths[`efetivo.${ds}`] = r.ef; paths[`equip.${ds}`] = r.eq;
    paths[`chuva.${ds}`] = r.chuva === null ? DEL : r.chuva; paths[`obsFisc.${ds}`] = r.obsFisc ? r.obsFisc : DEL;
  }
  paths[`clima.${ds}`] = S.clima;
  const obs = $("#obsInp").value.trim();
  paths[`obs.${ds}`] = obs ? obs : DEL;
  paths[`atualizado.${ds}`] = { por: S.nome, em: new Date().toISOString() };
  const b = $("#salvarDia"); b.disabled = true; b.textContent = "Salvando...";
  try {
    await patchWeek(paths);
    await loadWeek();
    renderDiario();
    const ad = aderenciaMedia(S.week, dayIdx(S.dia));
    toast(`Diário salvo. Aderência acumulada da semana: ${fmtPct(ad)}`);
  } catch(e){
    console.error(e); toast("Erro ao salvar: " + e.message, true);
    b.disabled = false; b.textContent = `Salvar diário de ${fmtCurto(S.dia)}`;
  }
}

function weekbar(){

    <button data-navsem="-1" aria-label="Semana anterior">‹</button>
    <span class="wk">Semana ${fmtCurto(S.semana)} a ${fmtCurto(addDays(S.semana,6))}</span>
    <button data-navsem="1" aria-label="Próxima semana">›</button></div>`;

function draftFromWeek(w){
  return estrutura(w).flatMap(g => g.acts).map(a => ({ id:a.id, grupo:a.grupo||"", descricao:a.descricao||"", unidade:a.unidade||"", itemContrato:a.itemContrato||"", prog:{...(a.prog||{})} }));
}

  h += `<div class="ntchips"><span style="font-size:13px;color:var(--mut)">Dia não trabalhado (fica cinza no Excel):</span>
    ${DIAS.map((dn,d) => `<button data-nt="${d}" class="${S.draftNT[d]?"on":""}">${dn} ${fmtCurto(addDays(S.semana,d))}</button>`).join("")}</div>`;
  h += `<datalist id="grupos">${grupos.map(g => `<option value="${esc(g)}">`).join("")}</datalist>`;
  if (!S.draft.length) h += `<div class="card vazio">Nenhuma atividade programada nesta semana.</div>`;
  S.draft.forEach((a,i) => {
    h += `<div class="pa" data-i="${i}">
      <div class="top">
        <div><div class="lbl">Grupo</div><input list="grupos" data-f="grupo" value="${esc(a.grupo)}" placeholder="TERRAPLANAGEM"></div>
        <div class="desc"><div class="lbl">Descrição</div><input data-f="descricao" value="${esc(a.descricao)}" placeholder="TUBO DE CONCRETO DM 800MM"></div>
        <div><div class="lbl">Unidade</div><input list="unidades" data-f="unidade" value="${esc(a.unidade)}" placeholder="m"></div>
        <div class="ctl"><button data-mv="-1" title="Subir">↑</button><button data-mv="1" title="Descer">↓</button><button data-rm title="Excluir" style="color:var(--erro)">✕</button></div>
      </div>
      ${itensC.length ? `<div class="ic"><div class="lbl">Item do contrato (para a medição)</div><select data-ic>
        <option value="">— não medir / sem item —</option>${itensC.map(i => `<option value="${i.id}" ${a.itemContrato===i.id?"selected":""}>${esc(i.item)} — ${esc(i.descricao.slice(0,80))} (${esc(i.un)})</option>`).join("")}</select></div>` : ""}
      <div class="dias">${DIAS.map((dn,d) => `<div class="${S.draftNT[d]?"fds":""}"><label>${dn} ${fmtCurto(addDays(S.semana,d))}</label>
        <input inputmode="decimal" data-d="${d}" value="${val(a.prog,d)===null?"":fmtNum(val(a.prog,d))}"></div>`).join("")}</div>
    </div>`;
  });

}
function syncDraftFromDom(){
  $$("#v-prog .pa").forEach(div => {
    const a = S.draft[+div.dataset.i];
    div.querySelectorAll("[data-f]").forEach(i => {
      a[i.dataset.f] = i.value.trim().toUpperCase();
      if (i.dataset.f === "unidade") a.unidade = i.value.trim();
    });
    const ic = div.querySelector("[data-ic]"); if (ic) a.itemContrato = ic.value;
    a.prog = {};
    div.querySelectorAll("[data-d]").forEach(i => { const v = num(i.value); if (v !== null) a.prog[i.dataset.d] = v; });
  });
}
async function salvarProg(){
  syncDraftFromDom();
  if (S.draft.some(a => !a.descricao || !a.grupo)){ toast("Preencha grupo e descrição de todas as atividades.", true); return; }
  // ordena pelo grupo (na ordem em que aparecem) para manter a numeração do modelo
  const ordemGrupo = []; S.draft.forEach(a => { if (!ordemGrupo.includes(norm(a.grupo))) ordemGrupo.push(norm(a.grupo)); });
  const lista = [...S.draft].sort((x,y) => ordemGrupo.indexOf(norm(x.grupo)) - ordemGrupo.indexOf(norm(y.grupo)));
  const paths = {};
  lista.forEach((a,i) => {
    const b = `atividades.${a.id}`;
    paths[`${b}.ordem`] = i; paths[`${b}.grupo`] = a.grupo; paths[`${b}.descricao`] = a.descricao;
    paths[`${b}.unidade`] = (a.unidade || "un").replace(/^m2$/i,"m²").replace(/^m3$/i,"m³");
    paths[`${b}.prog`] = a.prog;
    if (a.itemContrato !== undefined) paths[`${b}.itemContrato`] = a.itemContrato || null;
    paths[`${b}.origem`] = "manual";
  });
  for (const id of Object.keys(S.week.atividades || {})) if (!lista.find(a => a.id === id)) paths[`atividades.${id}`] = DEL;
  paths.naoTrab = S.draftNT;
  const b = $("#salvarProg"); b.disabled = true; b.textContent = "Salvando...";
  try { await patchWeek(paths); await loadWeek(); renderProg(); toast("Programação salva."); }
  catch(e){ console.error(e); toast("Erro ao salvar: " + e.message, true); b.disabled = false; b.textContent = "Salvar programação"; }
}
async function copiarAnterior(){
  syncDraftFromDom();
  const ant = await getWeek(S.obraId, addDays(S.semana,-7));
  const acts = draftFromWeek(ant);
  if (!acts.length){ toast("A semana anterior não tem programação.", true); return; }
  if (S.draft.length && !confirm("Substituir as atividades desta tela pelas da semana anterior?")) return;
  S.draft = acts.map(a => ({ ...a, prog:{...a.prog} }));
  S.draftNT = { ...naoTrab(ant) };
  renderProg(); toast("Copiado. Revise as quantidades e salve.");
}

/* ------------------------------- exportação ------------------------------- */
const FONT = "Aptos Narrow";
const C = { DK2:"FF17375E", ACC:"FF4F81BD", ACCL:"FFDCE6F1", ADER:"FFC1FFDD", AMAR:"FFFFFF00", CINZA35:"FFA6A6A6", CINZA25:"FFBFBFBF",
            TAN25:"FFC4BD97", TAN10:"FFDDD9C4", BRANCO:"FFFFFFFF", MOLDURA:"FF0070C0", VERM:"FFC00000" };
const thin = { style:"thin", color:{ argb:"FF000000" } };
const BOX = { top:thin, left:thin, bottom:thin, right:thin };
const NUM = '#,##0.00;-#,##0.00;;@';
const col = n => { let s = ""; while (n > 0){ const m = (n-1)%26; s = String.fromCharCode(65+m) + s; n = Math.floor((n-1)/26); } return s; };
const xlDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };

function sty(cell, o = {}){
  cell.font = { name:FONT, size:o.size||12, bold:!!o.bold, italic:!!o.italic, color:{ argb:o.color||"FF000000" } };
  cell.alignment = { horizontal:o.h||"center", vertical:o.v||"middle", wrapText:o.wrap!==false };
  if (o.fill) cell.fill = { type:"pattern", pattern:"solid", fgColor:{ argb:o.fill } };
  if (o.border !== false) cell.border = BOX;
  if (o.fmt) cell.numFmt = o.fmt;
}
// mescla, escreve o valor e aplica o estilo em todas as células do intervalo (bordas inclusive)
function bloco(ws, r1, c1, r2, c2, value, o){
  if (r1 !== r2 || c1 !== c2) ws.mergeCells(r1, c1, r2, c2);
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) sty(ws.getCell(r,c), o);
  if (value !== undefined) ws.getCell(r1,c1).value = value;
}

let IMGS = null;
async function carregaImgs(){
  if (IMGS) return IMGS;
  const b64 = async f => { const blob = await (await fetch(f)).blob(); return await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); }); };
  IMGS = { setor: await b64("logo-setor.png"), icone: await b64("icone-obra.png") };
  return IMGS;
}

function montaPlanilha(wb, nomeAba, obra, w, ref, imgs){
  const ws = wb.addWorksheet(nomeAba, {
    views: [{ state:"frozen", ySplit:6, showGridLines:false, zoomScale:80 }],
    pageSetup: { orientation:"landscape", paperSize:9, fitToPage:true, fitToWidth:1, fitToHeight:0,
                 margins:{ left:0.25, right:0.25, top:0.4, bottom:0.4, header:0.2, footer:0.2 } }
  });
  // B moldura | C item | D resumo | E prog/real | F qtde semanal | G unidade | H..N dias | O espaço | P aderência | Q moldura
  const larg = { 1:2, 2:1.5, 3:11, 4:40, 5:15, 6:15, 7:11, 15:2.5, 16:17, 17:1.5 };
  for (let c = 1; c <= 17; c++) ws.getColumn(c).width = larg[c] || 11.5;
  const CH = 8, CN = 14, CP = 16, CQ = 17;
  const H = col(CH), N = col(CN), P = col(CP);
  const ate = dayIdx(ref), nt = naoTrab(w);
  const datas = DIAS.map((_,d) => addDays(w.inicio, d));
  const VERDE = "FF00B050", VERM = "FFFF0000", VERDE2 = "FF92D050";

  // ---- cabeçalho
  ws.getRow(2).height = 6; ws.getRow(3).height = 22; ws.getRow(4).height = 19; ws.getRow(5).height = 19; ws.getRow(6).height = 28; ws.getRow(7).height = 20;
  bloco(ws, 3,3, 5,3, "", {});
  bloco(ws, 3,4, 5,5, `PROGRAMAÇÃO SEMANAL\nOBRA ${obra.nome}`, { bold:true, size:15 });
  bloco(ws, 3,6, 5,6, "", {});
  bloco(ws, 3,7, 3,8, "DATA DE ATUALIZAÇÃO:", { bold:true, size:8 });
  bloco(ws, 4,7, 5,8, xlDate(ref), { bold:true, size:12, fmt:"dd/mm/yyyy" });
  const av = obra.avanco || {};
  bloco(ws, 3,9, 3,14, "AVANÇO FÍSICO/FINANCEIRO" + (av.ref ? ` - ATÉ ${av.ref}` : ""), { bold:true, size:12 });
  [["PREVISTO",9],["REALIZADO",11],["DESVIO",13]].forEach(([t,c]) => bloco(ws, 4,c, 4,c+1, t, { bold:true, size:12 }));
  const temAv = av.previsto != null && av.realizado != null;
  const desv = temAv ? (av.realizado - av.previsto)/100 : null;
  bloco(ws, 5,9, 5,10, av.previsto != null ? av.previsto/100 : null, { bold:true, size:12, fmt:"0.00%", fill: av.previsto != null ? VERDE : undefined });
  bloco(ws, 5,11, 5,12, av.realizado != null ? av.realizado/100 : null, { bold:true, size:12, fmt:"0.00%", fill: temAv ? (av.realizado >= av.previsto ? VERDE : VERM) : undefined });
  bloco(ws, 5,13, 5,14, temAv ? { formula:"K5-I5", result: desv } : null, { bold:true, size:12, fmt:"0.00%", fill: temAv ? (desv >= 0 ? VERDE : VERM) : undefined });
  bloco(ws, 3,CP, 6,CP, "ADERÊNCIA\nDIÁRIA\nACUMULADA\n(REAL/PROG)\n%", { bold:true, size:11 });
  ws.addImage(wb.addImage({ base64:imgs.icone, extension:"png" }), { tl:{ col:2.12, row:2.08 }, ext:{ width:66, height:61 } });
  ws.addImage(wb.addImage({ base64:imgs.setor, extension:"png" }), { tl:{ col:5.27, row:2.05 }, ext:{ width:64, height:64 } });

  ["ITEM","RESUMO GERAL DA SEMANA","PROG. / REAL","QDTE. SEMANAL","UNIDADE"].forEach((t,i) => bloco(ws, 6,3+i, 6,3+i, t, { bold:true, size:11 }));
  datas.forEach((dt,d) => bloco(ws, 6,CH+d, 6,CH+d, xlDate(dt), { bold:true, size:11, fmt:"dd/mm" }));

  bloco(ws, 7,3, 7,3, 1, { fill:C.DK2, color:C.BRANCO });
  bloco(ws, 7,4, 7,4, "ITEM", { fill:C.DK2, color:C.BRANCO, bold:true, size:13, h:"left" });
  for (let c = 5; c <= CN; c++) bloco(ws, 7,c, 7,c, "", { fill:C.DK2 });
  bloco(ws, 7,CP, 7,CP, "", { fill:C.DK2 });

  // par PROGRAMADO / REALIZADO (atividades e tarefas não programadas usam o mesmo desenho)
  const fillProg = np => np ? C.TAN10 : C.ACCL;
  function par(r, item, desc, a, np){
    const rp = r, rr = r+1;
    ws.getRow(rp).height = 18; ws.getRow(rr).height = 18;
    if (np) bloco(ws, rp,3, rr,4, desc, { size:11 });
    else { bloco(ws, rp,3, rr,3, item, { size:11 }); bloco(ws, rp,4, rr,4, desc, { size:11, h:"left" }); }
    bloco(ws, rp,5, rp,5, "PROGRAMADO", { fill:fillProg(np), size:11 });
    bloco(ws, rr,5, rr,5, "REALIZADO", { size:11 });
    bloco(ws, rp,6, rp,6, { formula:`SUM(${H}${rp}:${N}${rp})`, result: somaSemana(a?.prog) || 0 }, { fill:fillProg(np), size:11, fmt:NUM });
    bloco(ws, rr,6, rr,6, { formula:`SUM(${H}${rr}:${N}${rr})`, result: somaSemana(a?.real) || 0 }, { size:11, fmt:NUM });
    bloco(ws, rp,7, rp,7, a?.unidade || "", { fill:fillProg(np), size:11 });
    bloco(ws, rr,7, rr,7, a?.unidade || "", { size:11 });
    for (let d = 0; d < 7; d++){
      const p = a ? val(a.prog,d) : null, x = a ? val(a.real,d) : null;
      const cinza = nt[d] && !np;
      // nos dias, zero lançado aparece como 0,00 (diferente de célula vazia = não lançado)
      bloco(ws, rp,CH+d, rp,CH+d, p, { fill: cinza ? C.CINZA35 : fillProg(np), size:11, fmt:"#,##0.00" });
      bloco(ws, rr,CH+d, rr,CH+d, x, { fill: cinza ? C.CINZA35 : undefined, size:11, fmt:"#,##0.00" });
    }
    const ad = a ? aderencia(a, ate) : null;
    bloco(ws, rp,CP, rr,CP, a ? { formula:`IFERROR(SUMIF($${H}$6:$${N}$6,"<="&$G$4,${H}${rr}:${N}${rr})/SUMIF($${H}$6:$${N}$6,"<="&$G$4,${H}${rp}:${N}${rp}),"")`, result: ad === null ? "" : ad } : "",
          a ? { fill:VERM, color:C.BRANCO, bold:true, size:11, fmt:"0.00%" } : {});
  }

  // ---- atividades programadas
  let r = 8;
  for (const g of estrutura(w)){
    ws.getRow(r).height = 18;
    bloco(ws, r,3, r,3, g.item, { fill:C.ACC, bold:true, size:12 });
    bloco(ws, r,4, r,4, g.nome, { fill:C.ACC, bold:true, size:12, h:"left" });
    for (let c = 5; c <= CN; c++) bloco(ws, r,c, r,c, "", { fill:C.ACC });
    bloco(ws, r,CP, r,CP, "", { fill:C.ACC });
    r++;
    for (const a of g.acts){ par(r, a.item, a.descricao, a, false); r += 2; }
  }
  const fimAt = r - 1;

  // ---- dia não trabalhado, clima e observações
  ws.getRow(r).height = 12; r++;
  const rc = r;
  for (let x = rc; x <= rc+7; x++) ws.getRow(x).height = 18;
  bloco(ws, rc,3, rc,4, "DIA NÃO TRABALHADO", { h:"right", size:11, border:false });
  bloco(ws, rc,5, rc,5, "", { fill:C.CINZA35 });
  bloco(ws, rc,7, rc,7, "CLIMA", { fill:C.AMAR, bold:true, size:13 });
  datas.forEach((dt,d) => bloco(ws, rc,CH+d, rc,CH+d, xlDate(dt), { fill:C.AMAR, size:11, fmt:"dd/mmm" }));
  CLIMAS.forEach((c,i) => bloco(ws, rc+1+i,6, rc+1+i,6, c.k, { fill:c.argb, color:c.fargb, bold:true, size:9 }));
  TURNOS.forEach(([k,lbl],i) => {
    bloco(ws, rc+1+i,7, rc+1+i,7, lbl, { size:11 });
    for (let d = 0; d < 7; d++){
      const c = CLIMAS.find(x => x.k === ((w.clima||{})[d] || {})[k]);
      bloco(ws, rc+1+i,CH+d, rc+1+i,CH+d, "", { fill: c ? c.argb : (nt[d] ? C.CINZA35 : undefined) });
    }
  });
  bloco(ws, rc+2,3, rc+2,5, "OBS.:", { fill:C.CINZA35, bold:true, size:11, h:"left" });
  const obsTxt = Object.entries(w.obs||{}).sort().map(([d,t]) => `${fmtCurto(addDays(w.inicio,+d))}: ${t}`).join("\n");
  bloco(ws, rc+3,3, rc+7,5, obsTxt, { h:"left", v:"top", bold:true, size:11 });
  const nl = obsTxt ? obsTxt.split("\n").length : 0;
  if (nl > 4) for (let x = rc+3; x <= rc+7; x++) ws.getRow(x).height = Math.ceil(nl*16/5) + 4;
  r = rc + 8;

  // ---- tarefas não programadas
  ws.getRow(r).height = 12; r++;
  const rn = r;
  ws.getRow(rn).height = 18;
  bloco(ws, rn,3, rn,4, "TAREFAS NÃO PROGRAMADAS", { fill:C.TAN25, bold:true, size:10 });
  [["PROG. / REAL",5],["QUANTIDADE",6],["UNIDADE",7]].forEach(([t,c]) => bloco(ws, rn,c, rn,c, t, { fill:C.TAN25, bold:true, size:10 }));
  datas.forEach((dt,d) => bloco(ws, rn,CH+d, rn,CH+d, xlDate(dt), { fill:C.TAN25, bold:true, size:10, fmt:"dd/mm/yy" }));
  r++;
  const iniNp = r;
  const nps = naoProgList(w);
  for (const a of nps){ par(r, "", a.descricao, a, true); r += 2; }
  par(r, "", "", null, true); r += 2;          // linha livre no fim, como no modelo
  const fimNp = r - 1;

  // aderência: vermelho até atingir 100%, verde quando >= 100% (continua valendo se alguém editar o arquivo)
  const verde = { type:"expression", style:{ fill:{ type:"pattern", pattern:"solid", bgColor:{ argb:VERDE2 } }, font:{ color:{ argb:"FF000000" }, bold:true } } };
  if (fimAt >= 8) ws.addConditionalFormatting({ ref:`${P}8:${P}${fimAt}`, rules:[{ ...verde, formulae:[`AND(ISNUMBER(${P}8),${P}8>=1)`] }] });
  ws.addConditionalFormatting({ ref:`${P}${iniNp}:${P}${fimNp}`, rules:[{ ...verde, formulae:[`AND(ISNUMBER(${P}${iniNp}),${P}${iniNp}>=1)`] }] });

  // ---- moldura
  const fim = r;
  ws.getRow(fim).height = 8;
  const fino = { style:"thin", color:{ argb:"FF000000" } };
  for (let c = 2; c <= CQ; c++){
    ws.getCell(2,c).border = { ...(ws.getCell(2,c).border||{}), top:fino };
    ws.getCell(fim,c).border = { ...(ws.getCell(fim,c).border||{}), bottom:fino };
  }
  for (let x = 2; x <= fim; x++){
    ws.getCell(x,2).border = { ...(ws.getCell(x,2).border||{}), left:fino };
    ws.getCell(x,CQ).border = { ...(ws.getCell(x,CQ).border||{}), right:fino };
  }
  const ult = Object.values(w.atualizado||{}).sort((a,b) => a.em < b.em ? 1 : -1)[0];
  bloco(ws, fim+1,3, fim+1,CN, `Gerado pelo Diário de Produção LM em ${new Date().toLocaleString("pt-BR")}` + (ult ? ` · último lançamento: ${ult.por}, ${new Date(ult.em).toLocaleString("pt-BR")}` : ""),
        { h:"left", italic:true, size:8, color:"FF7F7F7F", border:false });
  ws.pageSetup.printArea = `B2:${col(CQ)}${fim}`;
  return ws;
}

/* ----------------------- imagem A4 (mesmo desenho do Excel) ----------------------- */
function relatorioHTML(obra, w, ref){
  const ate = dayIdx(ref), nt = naoTrab(w), datas = DIAS.map((_,d) => addDays(w.inicio, d));
  const av = obra.avanco || {};
  const n2 = v => (v === null || v === undefined || v === "") ? "" : Number(v).toLocaleString("pt-BR",{ minimumFractionDigits:2, maximumFractionDigits:2 });
  const soma = m => { const v = somaSemana(m); return v ? n2(v) : ""; };
  const pct = v => v === null ? "" : (v*100).toLocaleString("pt-BR",{ minimumFractionDigits:2, maximumFractionDigits:2 }) + "%";
  const dm = s => fmtCurto(s), dmy = s => { const [y,m,d] = s.split("-"); return `${d}/${m}/${y.slice(2)}`; };
  const MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  const dmes = s => { const [,m,d] = s.split("-"); return `${d}/${MES[+m-1]}`; };
  const AZ = "#17375E", AC = "#4F81BD", ACL = "#DCE6F1", CZ = "#A6A6A6", T25 = "#C4BD97", T10 = "#DDD9C4", AM = "#FFFF00";
  const corAd = v => v !== null && v >= 1 ? "background:#92D050;color:#000" : "background:#FF0000;color:#fff";
  const gap = '<td class="nb"></td>';
  const temAv = av.previsto != null && av.realizado != null, desv = temAv ? (av.realizado - av.previsto)/100 : null;
  const VD = "background:#00B050", VM = "background:#FF0000";

  let h = `<div class="rel"><table>
    <colgroup><col style="width:70px"><col style="width:330px"><col style="width:100px"><col style="width:105px"><col style="width:72px">
    ${DIAS.map(() => '<col style="width:80px">').join("")}<col style="width:14px"><col style="width:118px"></colgroup>
    <tr style="height:30px"><td rowspan="3"><img src="icone-obra.png" style="height:62px"></td>
      <td colspan="2" rowspan="3" class="b" style="font-size:19px;line-height:1.25">PROGRAMAÇÃO SEMANAL<br>OBRA ${esc(obra.nome)}</td>
      <td rowspan="3"><img src="logo-setor.png" style="height:66px"></td>
      <td colspan="2" class="b" style="font-size:10px">DATA DE ATUALIZAÇÃO:</td>
      <td colspan="6" class="b" style="font-size:15px">AVANÇO FÍSICO/FINANCEIRO${av.ref ? " - ATÉ " + esc(av.ref) : ""}</td>
      ${gap}<td rowspan="4" class="b" style="font-size:13px;line-height:1.3">ADERÊNCIA<br>DIÁRIA<br>ACUMULADA<br><span style="font-weight:400">(REAL/PROG)<br>%</span></td></tr>
    <tr style="height:24px"><td colspan="2" rowspan="2" class="b" style="font-size:16px">${fmtBR(ref)}</td>
      <td colspan="2" class="b" style="font-size:15px">PREVISTO</td><td colspan="2" class="b" style="font-size:15px">REALIZADO</td><td colspan="2" class="b" style="font-size:15px">DESVIO</td>${gap}</tr>
    <tr style="height:24px"><td colspan="2" class="b" style="font-size:15px;${av.previsto != null ? VD : ""}">${av.previsto != null ? pct(av.previsto/100) : ""}</td>
      <td colspan="2" class="b" style="font-size:15px;${temAv ? (av.realizado >= av.previsto ? VD : VM) : ""}">${av.realizado != null ? pct(av.realizado/100) : ""}</td>
      <td colspan="2" class="b" style="font-size:15px;${temAv ? (desv >= 0 ? VD : VM) : ""}">${temAv ? pct(desv) : ""}</td>${gap}</tr>
    <tr style="height:34px" class="b">${["ITEM","RESUMO GERAL DA SEMANA","PROG. / REAL","QDTE. SEMANAL","UNIDADE"].map(t => `<td>${t}</td>`).join("")}
      ${datas.map(d => `<td>${dm(d)}</td>`).join("")}${gap}</tr>
    <tr style="background:${AZ};color:#fff"><td>1</td><td class="b l" style="font-size:15px">ITEM</td>${'<td></td>'.repeat(10)}${gap}<td></td></tr>`;

  const par = (item, desc, a, np) => {
    const fp = np ? T10 : ACL;
    const ad = a ? aderencia(a, ate) : null;
    const dias = (m, prog) => DIAS.map((_,d) => {
      const v = a ? val(m, d) : null;
      const bg = nt[d] && !np ? CZ : (prog ? fp : "");
      return `<td style="${bg ? "background:"+bg : ""}">${v === null ? "" : n2(v)}</td>`;
    }).join("");
    const cab = np ? `<td colspan="2" rowspan="2">${esc(desc)}</td>` : `<td rowspan="2">${item}</td><td rowspan="2" class="l">${esc(desc)}</td>`;
    return `<tr>${cab}<td style="background:${fp}">PROGRAMADO</td><td style="background:${fp}">${a ? soma(a.prog) : ""}</td><td style="background:${fp}">${a ? esc(a.unidade) : ""}</td>${dias(a?.prog, true)}${gap}
        <td rowspan="2" class="b" style="${a ? corAd(ad) : ""}">${a ? pct(ad) : ""}</td></tr>
      <tr><td>REALIZADO</td><td>${a ? soma(a.real) : ""}</td><td>${a ? esc(a.unidade) : ""}</td>${dias(a?.real, false)}${gap}</tr>`;
  };
  for (const g of estrutura(w)){
    h += `<tr style="background:${AC}" class="b"><td>${g.item}</td><td class="l">${esc(g.nome)}</td>${'<td></td>'.repeat(10)}${gap}<td></td></tr>`;
    for (const a of g.acts) h += par(a.item, a.descricao, a, false);
  }

  // dia não trabalhado, clima e observações
  const obsTxt = Object.entries(w.obs||{}).sort().map(([d,t]) => `${dm(addDays(w.inicio,+d))}: ${esc(t)}`).join("<br>");
  h += `<tr class="sp"><td colspan="14" class="nb"></td></tr>
    <tr><td colspan="2" class="nb r">DIA NÃO TRABALHADO</td><td style="background:${CZ}"></td><td class="nb"></td>
      <td class="b" style="background:${AM};font-size:15px">CLIMA</td>${datas.map(d => `<td style="background:${AM}">${dmes(d)}</td>`).join("")}${gap}<td class="nb"></td></tr>`;
  TURNOS.forEach(([k,lbl],i) => {
    const esq = i === 0 ? `<td colspan="3" class="nb"></td>`
              : i === 1 ? `<td colspan="3" class="b l" style="background:${CZ}">OBS.:</td>`
              : `<td colspan="3" rowspan="4" class="b l" style="vertical-align:top;font-size:12px">${obsTxt}</td>`;
    const c = CLIMAS[i];
    h += `<tr>${esq}<td class="b" style="background:${c.cor};color:${c.txt};font-size:10px">${c.k}</td><td>${lbl}</td>
      ${DIAS.map((_,d) => { const cc = CLIMAS.find(x => x.k === ((w.clima||{})[d] || {})[k]); return `<td style="${cc ? "background:"+cc.cor : nt[d] ? "background:"+CZ : ""}"></td>`; }).join("")}${gap}<td class="nb"></td></tr>`;
  });
  for (let i = 0; i < 3; i++) h += `<tr><td colspan="11" class="nb"></td></tr>`;

  // tarefas não programadas
  h += `<tr class="sp"><td colspan="14" class="nb"></td></tr>
    <tr class="b" style="background:${T25};font-size:12px"><td colspan="2">TAREFAS NÃO PROGRAMADAS</td><td>PROG. / REAL</td><td>QUANTIDADE</td><td>UNIDADE</td>
      ${datas.map(d => `<td>${dmy(d)}</td>`).join("")}<td class="nb" style="background:#fff"></td><td class="nb" style="background:#fff"></td></tr>`;
  for (const a of naoProgList(w)) h += par("", a.descricao, a, true);
  h += par("", "", null, true);
  h += `</table><div class="rod">Gerado pelo Diário de Produção LM em ${new Date().toLocaleString("pt-BR")}</div></div>`;
  return h;
}

async function exportarImagem(){
  const o = obraAtual(); if (!o) return;
  const ref = S.refSemana || refPadrao(), w = S.week;
  const b = $("#expImg"); b.disabled = true; b.textContent = "Gerando imagem...";
  const host = document.createElement("div");
  host.style.cssText = "position:fixed;left:-20000px;top:0;z-index:-1";
  host.innerHTML = relatorioHTML(o, w, ref);
  document.body.appendChild(host);
  try {
    await Promise.all([...host.querySelectorAll("img")].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    const cv = await html2canvas(host.firstElementChild, { scale:2.5, backgroundColor:"#ffffff", logging:false });
    // folha A4 paisagem a 300 dpi (3508 x 2480), com margem; o quadro é reduzido para caber inteiro
    const A4W = 3508, A4H = 2480, M = 110;
    const pg = document.createElement("canvas"); pg.width = A4W; pg.height = A4H;
    const ctx = pg.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,A4W,A4H);
    const k = Math.min((A4W-2*M)/cv.width, (A4H-2*M)/cv.height);
    const dw = cv.width*k, dh = cv.height*k;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(cv, (A4W-dw)/2, M, dw, dh);
    const blob = await new Promise(r => pg.toBlob(r, "image/png"));
    const nome = `PROGRAMAÇÃO SEMANAL - ${o.nome} - ${fmtCurto(w.inicio).replace("/","-")} a ${fmtCurto(addDays(w.inicio,6)).replace("/","-")}.png`;
    const file = new File([blob], nome, { type:"image/png" });
    // no celular abre o "compartilhar" (WhatsApp etc.); no computador baixa o arquivo
    if (matchMedia("(pointer:coarse)").matches && navigator.canShare && navigator.canShare({ files:[file] })){
      try { await navigator.share({ files:[file], title:nome }); toast("Imagem pronta."); return; }
      catch(e){ if (e.name === "AbortError") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Imagem A4 gerada.");
  } catch(e){ console.error(e); toast("Erro ao gerar imagem: " + e.message, true); }
  finally { host.remove(); b.disabled = false; b.textContent = "Imagem A4 — esta obra"; }
}

async function exportar(obras){
  const ref = S.refSemana || refPadrao();
  const inicio = S.semana;
  const btns = $$("#expObra,#expTodas"); btns.forEach(b => b.disabled = true);
  try {
    const imgs = await carregaImgs();
    const wb = new ExcelJS.Workbook();
    wb.creator = "Diário de Produção LM"; wb.created = new Date();
    const usados = new Set();
    let n = 0;
    for (const o of obras){
      const w = await getWeek(o.id, inicio);
      if (obras.length > 1 && !Object.keys(w.atividades||{}).length && !Object.keys(w.naoProg||{}).length) continue;
      let nome = o.nome.replace(/[\[\]:*?\/\\]/g," ").slice(0,31).trim() || "Obra";
      let k = 2; while (usados.has(nome.toUpperCase())) nome = nome.slice(0,28) + " " + k++;
      usados.add(nome.toUpperCase());
      montaPlanilha(wb, nome, o, w, ref, imgs); n++;
    }
    if (!n){ toast("Nenhuma obra tem programação nesta semana.", true); return; }
    const buf = await wb.xlsx.writeBuffer();
    const nomeArq = `PROGRAMAÇÃO SEMANAL - ${obras.length > 1 ? "TODAS AS OBRAS" : obras[0].nome} - ${fmtCurto(inicio).replace("/","-")} a ${fmtCurto(addDays(inicio,6)).replace("/","-")}.xlsx`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([buf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    a.download = nomeArq; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(`Excel gerado (${n} obra${n>1?"s":""}).`);
  } catch(e){ console.error(e); toast("Erro ao gerar Excel: " + e.message, true); }
  finally { btns.forEach(b => b.disabled = false); }
}

/* --------------------------------- eventos --------------------------------- */
async function irParaDia(novo){
  S.dia = novo;
  const seg = mondayOf(novo);
  if (seg !== S.semana){ S.semana = seg; await loadWeek(); }
  render();
}
async function irParaSemana(delta){
  if (S.tab === "prog" && S.draft) syncDraftFromDom();
  S.semana = addDays(S.semana, 7*delta);
  S.dia = addDays(S.semana, dayIdx(S.dia));
  S.refSemana = null;
  await loadWeek(); render();
}

document.addEventListener("click", async ev => {
  const t = ev.target.closest("button,a"); if (!t) return;
  if (t.dataset.tab){
    if (S.tab === "prog" && S.draft) syncDraftFromDom();
    S.tab = t.dataset.tab;
    $$("nav button").forEach(b => b.classList.toggle("on", b === t));
    $$(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + S.tab));
    render(); return;
  }
  if (t.dataset.navdia){ await irParaDia(addDays(S.dia, +t.dataset.navdia)); return; }
  if (t.dataset.navsem){ await irParaSemana(+t.dataset.navsem); return; }
  if (t.dataset.clima){
    const k = t.dataset.clima, v = t.dataset.v;
    S.clima[k] = S.clima[k] === v ? undefined : v;
    if (!S.clima[k]) delete S.clima[k];
    $$(`[data-clima="${k}"]`).forEach(b => {
      const c = CLIMAS.find(x => x.k === b.dataset.v), on = S.clima[k] === b.dataset.v;
      b.classList.toggle("sel", on); b.style.background = on ? c.cor : "#fff"; b.style.color = on ? c.txt : "#000";
    });
    return;
  }
  if (t.id === "addNp"){ addNpRow(); return; }
  if (t.id === "salvarDia"){ await salvarDiario(); return; }
  if (t.id === "trocaNome" || t.id === "trocaNome2"){
    ev.preventDefault();
    const n = prompt("Seu nome:", S.nome); if (n && n.trim()){ S.nome = n.trim(); localStorage.setItem("diarioLM_nome", S.nome); render(); }
    return;
  }
  // programação
  if (t.id === "addAct"){
    syncDraftFromDom();
    const ult = S.draft[S.draft.length-1];
    S.draft.push({ id:uid(), grupo: ult?.grupo || "", descricao:"", unidade:"", prog:{} });
    renderProg(); const divs = $$("#v-prog .pa"); divs[divs.length-1]?.querySelector('[data-f="descricao"]').focus(); return;
  }
  if (t.dataset.mv || t.hasAttribute("data-rm")){
    syncDraftFromDom();
    const i = +t.closest(".pa").dataset.i;
    if (t.hasAttribute("data-rm")){
      const a = S.draft[i];
      if ((a.descricao || Object.keys(a.prog).length) && !confirm(`Excluir "${a.descricao || "atividade"}" desta semana?` + (somaSemana(S.week.atividades?.[a.id]?.real) ? "\nAtenção: ela já tem produção lançada, que também será apagada." : ""))) return;
      S.draft.splice(i,1);
    } else {
      const j = i + (+t.dataset.mv); if (j < 0 || j >= S.draft.length) return;
      [S.draft[i], S.draft[j]] = [S.draft[j], S.draft[i]];
    }
    renderProg(); return;
  }
  if (t.id === "copiarAnt"){ await copiarAnterior(); return; }
  if (t.id === "salvarProg"){ await salvarProg(); return; }
  // exportação
  if (t.id === "expObra"){ await exportar([obraAtual()]); return; }
  if (t.id === "expImg"){ await exportarImagem(); return; }
  if (t.id === "expTodas"){ await exportar(S.obras.filter(o => o.ativa !== false)); return; }
  // obras
  if (t.id === "addObra"){
    const nome = $("#novaObra").value.trim().toUpperCase(); if (!nome){ toast("Informe o nome da obra.", true); return; }
    if (S.obras.find(o => norm(o.nome) === norm(nome))){ toast("Já existe uma obra com esse nome.", true); return; }
    const senha = $("#novaSenha").value.trim();
    if (!senhaValida(senha, null)) return;
    const id = uid();
    await store.set(COL_OBRAS, id, { nome, engenheiro: $("#novoEng").value.trim(), senha, ativa:true, criadoEm:new Date().toISOString() });
    await carregaObras(); S.obraId = id; localStorage.setItem("diarioLM_obra", id);
    renderObraSel(); await loadWeek(); renderObras(); toast("Obra adicionada."); return;
  }
  if (t.dataset.nt !== undefined && t.closest(".ntchips")){
    syncDraftFromDom();
    const d = t.dataset.nt;
    if (S.draftNT[d]) delete S.draftNT[d]; else S.draftNT[d] = true;
    renderProg(); return;
  }
  if (t.hasAttribute("data-salvaav")){
    const div = t.closest(".av"), get = k => div.querySelector(`[data-av="${k}"]`).value.trim();
    const prev = num(get("previsto")), real = num(get("realizado"));
    if ((get("previsto") && prev === null) || (get("realizado") && real === null)){ toast("Use apenas números nos percentuais (ex.: 83,11).", true); return; }
    await store.patch(COL_OBRAS, div.dataset.id, { avanco: { ref: get("ref").toUpperCase(), previsto: prev, realizado: real } });
    await carregaObras(); renderObras(); toast("Avanço salvo."); return;
  }
  if (t.hasAttribute("data-salvaobra") || t.hasAttribute("data-ativa")){
    const div = t.closest(".ob"), id = div.dataset.id, o = S.obras.find(x => x.id === id);
    const upd = t.hasAttribute("data-ativa")
      ? { ativa: o.ativa === false }
      : { nome: div.querySelector('[data-of="nome"]').value.trim().toUpperCase() || o.nome, engenheiro: div.querySelector('[data-of="engenheiro"]').value.trim(),
          senha: div.querySelector('[data-of="senha"]').value.trim() };
    if (upd.senha !== undefined && !senhaValida(upd.senha, id)) return;
    await store.patch(COL_OBRAS, id, upd);
    await carregaObras(); renderObraSel(); await loadWeek(); renderObras(); toast("Obra atualizada."); return;
  }
});
document.addEventListener("change", async ev => {
  if (ev.target.id === "diaInp" && ev.target.value){ await irParaDia(ev.target.value); }
  if (ev.target.id === "refInp" && ev.target.value){ S.refSemana = ev.target.value; renderSemana(); }
  if (ev.target.id === "obraSel"){
    S.obraId = ev.target.value; localStorage.setItem("diarioLM_obra", S.obraId);
    await loadWeek(); render();
  }
});

/* ==========================================================================
   CONTRATO · MEDIÇÕES · COMPRAS
   Coleções próprias (não mexem no diário):
     obra_contratos/{obraId}   dados do contrato, planilha contratual e cronograma
     obra_medicoes/{id}        boletins de medição e o acompanhamento de cada um
     obra_requisicoes/{id}     requisições de compra → cotação → pedido → recebimento
   Quem entra com a senha da obra vê tudo da obra, abre requisições e registra
   recebimentos; o acesso geral (escritório) cadastra contrato, faz as medições,
   aprova, cota e emite os pedidos.
   ========================================================================== */
const COL_CONTR = "obra_contratos";
const COL_MED = "obra_medicoes";
const COL_REQ = "obra_requisicoes";

const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const fmtR = n => (n === null || n === undefined || isNaN(n)) ? "—" : Number(n).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
const fmtQ = n => (n === null || n === undefined || n === "") ? "" : Number(n).toLocaleString("pt-BR", { maximumFractionDigits:3 });
const fmtP = n => (n === null || n === undefined || isNaN(n) || !isFinite(n)) ? "—" : (n*100).toLocaleString("pt-BR", { minimumFractionDigits:1, maximumFractionDigits:1 }) + "%";
const ehGeral = () => !!S.acesso?.geral;
const itemId = item => "it_" + String(item).replace(/[^\w]/g, "_");
const agoraIso = () => new Date().toISOString();
const diasEntre = (a, b) => Math.round((parseIso(b) - parseIso(a)) / 86400000);
const MESES = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
const addMeses = (s, n) => { const d = parseIso(s); d.setMonth(d.getMonth() + n); return iso(d); };
const normUn = u => String(u || "").trim().replace(/^m2$/i,"m²").replace(/^m3$/i,"m³").replace(/^h$/i,"h").replace(/^mes$/i,"mês");

async function loadExtras(force){
  if (!force && S.ext.obraId === S.obraId) return;
  const id = S.obraId;
  if (!id){ S.ext = { obraId:id, contrato:null, meds:[], reqs:[] }; return; }
  const [contrato, meds, reqs] = await Promise.all([
    store.get(COL_CONTR, id), store.list(COL_MED, "obraId", id), store.list(COL_REQ, "obraId", id)
  ]);
  S.ext = { obraId:id, contrato, meds: meds.sort((a,b) => a.numero - b.numero), reqs: reqs.sort((a,b) => b.numero - a.numero) };

// mostra "carregando" e redesenha quando os dados da obra chegarem
function precisaCarregar(el, fn){
  if (S.ext.obraId === S.obraId) return false;
  el.innerHTML = `<div class="card vazio">Carregando...</div>`; setSavebar("");
  loadExtras().then(fn).catch(e => { console.error(e); el.innerHTML = `<div class="card vazio">Erro ao carregar: ${esc(e.message)}</div>`; });

/* ------------------------------ cálculos ------------------------------ */
const STATUS_MED = [
  { k:"rascunho",  t:"Em elaboração", cor:"#8AA4BC" },
  { k:"enviada",   t:"Enviada à fiscalização", cor:"#FFC14D" },
  { k:"aprovada",  t:"Aprovada", cor:"#3DF2FF" },
  { k:"faturada",  t:"Faturada (NF)", cor:"#7B5CFF" },
  { k:"paga",      t:"Paga", cor:"#2BFF9A" }
];
const stMed = k => STATUS_MED.find(s => s.k === k) || STATUS_MED[0];
const idxMed = k => STATUS_MED.findIndex(s => s.k === k);
const valorItens = c => r2((c?.itens || []).reduce((s,i) => s + r2(i.qtd * i.pu), 0));
const valorContrato = c => c?.valor || valorItens(c);
function valorMed(m, c){
  let v = 0;
  for (const i of (c?.itens || [])) v += r2((m.qtd?.[i.id] || 0) * i.pu);
  return r2(v);
}
// quantidade medida antes da medição de número n (n = Infinity → todas)
function acumAnterior(itemIdx, n){
  let q = 0;
  for (const m of S.ext.meds) if (m.numero < n) q += Number(m.qtd?.[itemIdx] || 0);
  return q;
}
function gruposContrato(c){
  const gs = [];
  for (const i of (c?.itens || [])){
    let g = gs.find(x => x.nome === i.grupo);
    if (!g){ g = { nome:i.grupo, itens:[], total:0 }; gs.push(g); }
    g.itens.push(i); g.total = r2(g.total + r2(i.qtd * i.pu));
  }
  return gs;
}
// previsto acumulado (R$) até o mês m (1..n), pelo cronograma
function previstoAte(c, m){
  const cr = c?.cronograma; if (!cr) return null;
  let v = 0;
  for (const g of gruposContrato(c)){
    const pcts = cr.metas?.[norm(g.nome)] || [];
    for (let k = 0; k < Math.min(m, pcts.length); k++) v += g.total * (Number(pcts[k]) || 0) / 100;
  }
  return r2(v);
}
const statusMedChip = k => { const s = stMed(k); return `<span class="chip" style="--c:${s.cor}">${s.t}</span>`; };

  }

  const medAcum = r2(S.ext.meds.reduce((s,m) => s + valorMed(m, c), 0));
  const medAprov = r2(S.ext.meds.filter(m => idxMed(m.status) >= idxMed("aprovada")).reduce((s,m) => s + valorMed(m, c), 0));
  const termino = c.inicio && c.prazoMeses ? addDays(addMeses(c.inicio, c.prazoMeses), -1) : null;
  const decorrido = c.inicio && termino ? Math.max(0, Math.min(1, diasEntre(c.inicio, hoje()) / Math.max(1, diasEntre(c.inicio, termino)))) : null;
  let h = `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Contrato — ${esc(o.nome)}</h3>
      ${ehGeral() ? `<span class="row"><button class="btn peq" id="ctEditar">Editar dados</button><button class="btn peq" id="ctReimportar">Substituir planilha</button><button class="btn peq" id="ctEstourada" title="Custo sem BDI de cada item aberto em mão de obra, equipamento e material">Planilha estourada (Excel)</button></span>` : ""}</div>

      <div><span>Processo / edital</span><b>${esc(c.processo || "—")}</b></div>
      <div><span>Nº do contrato</span><b>${esc(c.numero || "—")}</b></div>
      <div><span>Valor do contrato</span><b>${fmtR(vc)}</b></div>

      <div><span>Prazo</span><b>${c.prazoMeses ? c.prazoMeses + " meses" : "—"}</b></div>
      <div><span>Início (OS)</span><b>${c.inicio ? fmtBR(c.inicio) : "a definir"}</b></div>
      <div><span>Término previsto</span><b>${termino ? fmtBR(termino) : "—"}</b></div>
      <div class="full"><span>Objeto</span><b>${esc(c.objeto || "—")}</b></div>
    </div></div>`;
  h += `<div class="kpi">
    <div><b>${fmtR(medAcum)}</b><span>Medido (todas as medições)</span></div>
    <div><b>${fmtP(medAcum / vc)}</b><span>Executado financeiro</span></div>
    <div><b>${fmtR(r2(vc - medAcum))}</b><span>Saldo do contrato</span></div>
    <div><b>${fmtR(medAprov)}</b><span>Aprovado pela fiscalização</span></div>
    ${decorrido !== null ? `<div><b>${fmtP(decorrido)}</b><span>Prazo decorrido</span></div>` : ""}
  </div>`;
  // cronograma: previsto x medido por mês
  if (c.cronograma?.meses){
    const n = c.cronograma.meses;
    h += `<div class="card"><h3>Cronograma físico-financeiro — previsto × medido</h3><div class="tbwrap"><table class="tb"><thead><tr><th class="l">Meta</th><th>Valor</th>`;
    for (let k = 1; k <= n; k++) h += `<th>Mês ${k}${c.inicio ? `<br><small>${MESES[parseIso(addMeses(c.inicio,k-1)).getMonth()]}/${String(parseIso(addMeses(c.inicio,k-1)).getFullYear()).slice(2)}</small>` : ""}</th>`;
    h += `</tr></thead><tbody>`;
    for (const g of gruposContrato(c)){
      const pcts = c.cronograma.metas?.[norm(g.nome)] || [];
      h += `<tr><td class="l">${esc(g.nome)}</td><td>${fmtR(g.total)}</td>`;
      for (let k = 0; k < n; k++){ const p = Number(pcts[k]) || 0; h += `<td>${p ? fmtR(r2(g.total*p/100)) + `<br><small>${fmtNum(p)}%</small>` : "—"}</td>`; }
      h += `</tr>`;
    }
    h += `</tbody><tfoot><tr><td class="l">Previsto no mês</td><td>${fmtR(vc)}</td>`;
    for (let k = 1; k <= n; k++) h += `<td>${fmtR(r2(previstoAte(c,k) - previstoAte(c,k-1)))}</td>`;
    h += `</tr><tr><td class="l">Previsto acumulado</td><td></td>`;
    for (let k = 1; k <= n; k++) h += `<td>${fmtR(previstoAte(c,k))}<br><small>${fmtP(previstoAte(c,k)/vc)}</small></td>`;

  for (const g of gruposContrato(c)){
    h += `<tr class="g"><td colspan="5" class="l">${esc(g.nome)}</td><td>${fmtR(g.total)}</td><td colspan="2"></td></tr>`;
    for (const i of g.itens){

      h += `<tr><td>${esc(i.item)}</td><td class="l">${esc(i.descricao)}${i.codigo ? `<br><small>${esc(i.codigo)}</small>` : ""}</td><td>${esc(i.un)}</td>
        <td>${fmtQ(i.qtd)}</td><td>${fmtR(i.pu)}</td><td>${fmtR(r2(i.qtd*i.pu))}</td><td>${q ? fmtQ(q) : "—"}</td>
        <td><div class="barra"><i style="width:${Math.min(100,p*100)}%" class="${p > 1.0001 ? "estouro" : ""}"></i></div><small>${q ? fmtP(p) : ""}</small></td></tr>`;
    }
  }
  h += `</tbody><tfoot><tr><td colspan="5" class="l">TOTAL</td><td>${fmtR(valorItens(c))}</td><td colspan="2"></td></tr></tfoot></table></div>
    ${Math.abs(valorItens(c) - vc) >= 0.01 ? `<p class="nota">A soma dos itens (${fmtR(valorItens(c))}) difere do valor do contrato (${fmtR(vc)}) em ${fmtR(r2(valorItens(c)-vc))} — arredondamento da planilha.</p>` : ""}</div>`;
  el.innerHTML = h;
}

// transforma linhas (array de arrays) em itens da planilha
function linhasParaItens(rows){
  const limpa = v => String(v ?? "").replace(/\s+/g," ").trim();
  const n = v => { if (typeof v === "number") return v; const s = limpa(v); if (!s) return null; return num(s); };
  let hi = rows.findIndex(r => r.some(c => /descri/i.test(limpa(c))) && r.some(c => /quant|qtd/i.test(limpa(c))));
  if (hi < 0) throw new Error("Não achei o cabeçalho (precisa ter as colunas Descrição e Quantidade).");
  const cab = rows[hi].map(c => limpa(c).toLowerCase());
  const acha = (...re) => cab.findIndex(c => re.some(r => r.test(c)));
  const ci = { item: acha(/^item/), cod: acha(/c[óo]d/, /refer/), desc: acha(/descri/), un: acha(/^un/), qtd: acha(/quant|qtd/),
               pu: acha(/unit/, /^p\.?\s*u/, /pre[çc]o un/) };
  if (ci.pu < 0) ci.pu = acha(/pre[çc]o/);
  if (ci.desc < 0 || ci.qtd < 0 || ci.pu < 0) throw new Error("Faltam colunas: preciso de Descrição, Quantidade e Preço unitário.");
  const itens = []; let grupo = "SEM GRUPO";
  for (const r of rows.slice(hi + 1)){
    const desc = limpa(r[ci.desc]), q = n(r[ci.qtd]), pu = n(r[ci.pu]);
    if (!desc) continue;
    if (/^total/i.test(desc)) continue;
    if (q === null || pu === null){ grupo = desc.toUpperCase(); continue; }
    itens.push({ grupo, item: ci.item >= 0 ? limpa(r[ci.item]) : "", codigo: ci.cod >= 0 ? limpa(r[ci.cod]) : "", descricao: desc,
                 un: normUn(ci.un >= 0 ? limpa(r[ci.un]) : "un"), qtd: q, pu });
  }
  if (!itens.length) throw new Error("Nenhum item com quantidade e preço foi encontrado.");
  numeraItens(itens);
  return itens;
}
function numeraItens(itens){
  const gs = [];
  for (const i of itens){ if (!gs.includes(i.grupo)) gs.push(i.grupo); }
  const cont = {};
  for (const i of itens){
    const g = gs.indexOf(i.grupo) + 1; cont[g] = (cont[g] || 0) + 1;
    if (!i.item) i.item = `1.${g}.${cont[g]}`;
    i.id = itemId(i.item);
  }
  // ids únicos mesmo se a planilha repetir o número do item
  const vistos = {};
  for (const i of itens){ if (vistos[i.id]){ vistos[i.id]++; i.id += "_" + vistos[i.id]; } else vistos[i.id] = 1; }
}
async function lerPlanilha(){
  const arq = $("#ctArq").files[0], txt = $("#ctColar").value;
  let rows;
  if (arq){
    const wb = new ExcelJS.Workbook(); await wb.xlsx.load(await arq.arrayBuffer());
    const ws = wb.worksheets[0]; rows = [];
    ws.eachRow({ includeEmpty:false }, r => {
      const vals = []; r.eachCell({ includeEmpty:true }, (cell, c) => {
        let v = cell.value; if (v && typeof v === "object") v = v.result ?? v.text ?? (v.richText ? v.richText.map(x => x.text).join("") : "");
        vals[c-1] = v;
      });
      rows.push(vals);
    });
  } else if (txt.trim()){
    rows = txt.split(/\r?\n/).map(l => l.split("\t"));
  } else { toast("Escolha o arquivo ou cole as linhas.", true); return; }
  try {
    const itens = linhasParaItens(rows);
    S.impItens = itens;
    const gs = gruposContrato({ itens });
    $("#ctPrevia").innerHTML = `<div class="info">Encontrei <b>${itens.length} itens</b> em ${gs.length} grupos, total <b>${fmtR(valorItens({ itens }))}</b>:
      ${gs.map(g => `${esc(g.nome)} (${g.itens.length})`).join(" · ")}</div>
      <div class="row"><button class="btn pri" id="ctConfirmaImp">Confirmar e salvar</button></div>`;
  } catch(e){ $("#ctPrevia").innerHTML = `<div class="info">${esc(e.message)}</div>`; }
}

async function salvarDados(){
  const c = { ...(S.ext.contrato || {}) };
  const v = $("#cdValor").value.trim(), b = $("#cdBdi").value.trim(), p = parseInt($("#cdPrazo").value, 10);
  if ((v && num(v) === null) || (b && num(b) === null)){ toast("Valor e BDI precisam ser números.", true); return; }
  Object.assign(c, { contratante:$("#cdContratante").value.trim(), processo:$("#cdProcesso").value.trim(), numero:$("#cdNumero").value.trim(),
    valor: v ? num(v) : valorItens(c), bdi: b ? num(b) : null, prazoMeses: p > 0 ? p : null, inicio:$("#cdInicio").value || null,
    objeto:$("#cdObjeto").value.trim(), atualizadoEm:agoraIso(), atualizadoPor:S.nome || "" });
  const trs = $$("#v-contrato tr[data-meta]");
  if (trs.length){
    const metas = {}; let erro = null;
    for (const tr of trs){
      const ps = [...tr.querySelectorAll(".pct")].map(i => num(i.value) || 0);
      const soma = ps.reduce((s,x) => s + x, 0);
      if (soma && Math.abs(soma - 100) > 0.05) erro = `${tr.firstElementChild.textContent}: soma ${fmtNum(soma)}%`;
      metas[tr.dataset.meta] = ps;
    }
    if (erro && !confirm(`O cronograma não fecha 100% em: ${erro}.\nSalvar assim mesmo?`)) return;
    c.cronograma = { meses: trs[0].querySelectorAll(".pct").length, metas };
  }
  if (c.prazoMeses && (!c.cronograma || c.cronograma.meses !== c.prazoMeses)){
    const ant = c.cronograma?.metas || {};
    const metas = {}; for (const g of gruposContrato(c)) metas[norm(g.nome)] = Array.from({ length:c.prazoMeses }, (_,k) => (ant[norm(g.nome)] || [])[k] || 0);
    c.cronograma = { meses:c.prazoMeses, metas };
  }
  await store.set(COL_CONTR, S.obraId, c);
  await loadExtras(true); renderContrato(); toast("Dados do contrato salvos.");
}

function renderMedicoes(){

  if (!c?.itens?.length){

  }
  if (S.medSel){ renderMedEditor(); return; }
  setSavebar("");
  const vc = valorContrato(c), meds = S.ext.meds;

function syncMedDom(){

  let ok = true;
  $$("#v-medicoes tr[data-it] .mq").forEach(inp => {

    if (!s){ delete m.qtd[id]; inp.classList.remove("erro"); return; }

    inp.classList.remove("erro"); if (v) m.qtd[id] = v; else delete m.qtd[id];

async function mudaStatusMed(novoSt, data, texto){
