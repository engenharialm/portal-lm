<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal LM</title>
<link rel="icon" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#00A3DA; --accent-2:#0B83B2; --cyan:#3DF2FF; --violet:#7B5CFF;
    --bg:#050B14; --bg-2:#0A1626; --glass:rgba(16,32,52,.55); --line:rgba(61,242,255,.16);
    --text:#E6F4FF; --muted:#8AA4BC;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg);
       overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh}

  /* ---------- fundo animado ---------- */
  #net{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(600px 400px at 15% 10%, rgba(0,163,218,.22), transparent 70%),
      radial-gradient(500px 400px at 90% 90%, rgba(123,92,255,.18), transparent 70%),
      linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%)}
  .bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);
    animation:gridMove 30s linear infinite}
  @keyframes gridMove{to{background-position:48px 48px,48px 48px}}

  /* ---------- topo ---------- */
  header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;
         padding:18px 28px;border-bottom:1px solid var(--line);backdrop-filter:blur(8px);background:rgba(5,11,20,.4)}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{height:40px;padding:6px 8px;border-radius:10px;background:#fff;box-shadow:0 0 18px rgba(0,163,218,.45)}
  .brand span{font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:.18em;font-size:1rem}
  .status{display:flex;align-items:center;gap:18px;font-size:.82rem;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:#2BFF9A;box-shadow:0 0 10px #2BFF9A;display:inline-block;margin-right:6px;animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  #clock{font-family:Orbitron,sans-serif;color:var(--cyan);letter-spacing:.08em;font-size:.95rem}

  /* ---------- conteúdo ---------- */
  main{position:relative;z-index:2;flex:1;width:100%;max-width:1120px;margin:0 auto;padding:56px 16px 40px}
  .hero{text-align:center;margin-bottom:48px}
  .hero small{display:inline-block;font-size:.75rem;letter-spacing:.35em;text-transform:uppercase;color:var(--cyan);
              border:1px solid var(--line);border-radius:30px;padding:6px 16px;background:rgba(61,242,255,.05)}
  .hero h1{font-family:Orbitron,sans-serif;font-weight:700;font-size:clamp(1.8rem,4.6vw,3.1rem);margin:18px 0 10px;letter-spacing:.04em;
           background:linear-gradient(90deg,#fff 0%,var(--cyan) 45%,var(--violet) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);margin:16px 0 0;min-height:1.4em;font-size:1.05rem}
  .caret{display:inline-block;width:2px;height:1em;background:var(--cyan);vertical-align:-2px;margin-left:2px;animation:pulse 1s steps(1) infinite}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px;perspective:1200px}
  .card{position:relative;border:none;padding:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;
        border-radius:20px;transform-style:preserve-3d;transition:transform .15s ease-out;
        opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
  .card::before{content:"";position:absolute;inset:0;border-radius:20px;padding:1px;
        background:conic-gradient(from var(--ang,0deg),transparent 0 60%,var(--cyan) 75%,var(--violet) 85%,transparent 100%);
        -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
        opacity:.35;transition:opacity .3s}
  .card:hover::before,.card:focus-visible::before{opacity:1;animation:spin 3s linear infinite}
  @property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
  @keyframes spin{to{--ang:360deg}}
  .inner{position:relative;height:100%;border-radius:20px;padding:30px 26px 26px;background:var(--glass);
         backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.06);
         display:flex;flex-direction:column;gap:12px;overflow:hidden;min-height:260px}
  .inner::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
         background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),rgba(61,242,255,.16),transparent 60%)}
  .card:hover .inner::after{opacity:1}
  .card:focus-visible{outline:none}
  .num{position:absolute;top:18px;right:22px;font-family:Orbitron,sans-serif;font-size:2.6rem;font-weight:700;
       color:transparent;-webkit-text-stroke:1px rgba(61,242,255,.22)}
  .icon{width:62px;height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;
        background:linear-gradient(135deg,rgba(0,163,218,.25),rgba(123,92,255,.25));border:1px solid var(--line);
        box-shadow:0 0 24px rgba(0,163,218,.25) inset;transform:translateZ(40px)}
  .icon svg{width:30px;height:30px;stroke:var(--cyan);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(61,242,255,.7))}
  .card h2{font-family:Orbitron,sans-serif;font-size:1.25rem;letter-spacing:.06em;margin:8px 0 0;transform:translateZ(30px)}
  .card p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.55}
  .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--line)}
  .go{color:var(--cyan);font-weight:600;font-size:.88rem;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
  .go i{display:inline-block;transition:transform .25s}
  .card:hover .go i{transform:translateX(6px)}
  .tag{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:20px;border:1px solid}
  .tag.open{color:#2BFF9A;border-color:rgba(43,255,154,.35);background:rgba(43,255,154,.06)}
  .tag.lock{color:#FFC14D;border-color:rgba(255,193,77,.35);background:rgba(255,193,77,.06)}
  kbd{font-family:Orbitron,sans-serif;font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:6px}

  .hint{text-align:center;color:var(--muted);font-size:.8rem;margin-top:34px}
  footer{position:relative;z-index:2;text-align:center;color:var(--muted);font-size:.75rem;letter-spacing:.15em;padding:18px 16px;border-top:1px solid var(--line)}

  /* ---------- janela de senha ---------- */
  dialog{border:1px solid var(--line);border-radius:18px;padding:28px;width:min(380px,calc(100vw - 32px));color:var(--text);
         background:rgba(10,22,38,.92);backdrop-filter:blur(16px);box-shadow:0 0 60px rgba(0,163,218,.25)}
  dialog[open]{animation:pop .25s ease-out}
  @keyframes pop{from{opacity:0;transform:scale(.94)}}
  dialog::backdrop{background:rgba(2,6,12,.7);backdrop-filter:blur(3px)}
  dialog h3{margin:0 0 4px;font-family:Orbitron,sans-serif;letter-spacing:.06em;font-size:1.05rem}
  dialog .sub{color:var(--muted);font-size:.85rem;margin:0 0 16px}
  dialog input{width:100%;padding:12px 14px;border-radius:10px;font-size:1rem;color:var(--text);
               background:rgba(0,0,0,.35);border:1px solid var(--line);outline:none;letter-spacing:.2em}
  dialog input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(61,242,255,.15)}
  dialog .err{color:#FF6B7A;font-size:.85rem;min-height:1.2em;margin:8px 0 0}
  dialog.shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  dialog .btns{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
  dialog button{padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;color:var(--text);
                background:transparent;border:1px solid var(--line)}
  dialog button.ok{background:linear-gradient(90deg,var(--accent-2),var(--violet));border:none;box-shadow:0 0 18px rgba(0,163,218,.4)}

  /* ---------- transição ao abrir ---------- */
  #warp{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;
        background:radial-gradient(circle at var(--wx,50%) var(--wy,50%),rgba(61,242,255,.9),rgba(5,11,20,1) 40%)}
  #warp.on{animation:warp .55s ease-in forwards}
  @keyframes warp{from{opacity:0;clip-path:circle(0 at var(--wx) var(--wy))}to{opacity:1;clip-path:circle(150% at var(--wx) var(--wy))}}

  @media (max-width:640px){
    header{padding:14px 16px} .status .lbl{display:none} main{padding-top:36px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .card{opacity:1}
  }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="bg-grid"></div>
<canvas id="net"></canvas>

<header>
  <div class="brand">
    <img src="logo-lm.png" alt="LM Construtora">
    <span>PORTAL&nbsp;LM</span>
  </div>
  <div class="status">
    <span class="lbl"><span class="dot"></span>Sistemas online</span>
    <span id="clock">--:--:--</span>
  </div>
</header>

<main>
  <section class="hero">
    <small id="saud">Bem-vindo</small>
    <p><span id="typed"></span><span class="caret"></span></p>
  </section>

  <div class="grid" id="grid"></div>
  <p class="hint">Atalho: pressione <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> para abrir direto</p>
</main>

<footer>LM CONSTRUTORA · ENGENHARIA</footer>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle">Acesso restrito</h3>
    <p class="sub">Este sistema exige autorização.</p>
    <input id="dlgPwd" type="password" placeholder="••••••" autocomplete="current-password">
    <p class="err" id="dlgErr"></p>
    <div class="btns">
      <button type="button" id="dlgCancel">Cancelar</button>
      <button type="submit" class="ok">Entrar</button>
    </div>
  </form>
</dialog>

<div id="warp"></div>

<script>
/* =========================================================================
   SISTEMAS DO PORTAL
   Para proteger um sistema com senha, troque  senha: null  por  senha: "suaSenha".
   Atenção: como o portal não tem servidor, é uma trava para uso casual —
   quem tiver o link direto do sistema ainda entra por ele.
   ========================================================================= */
const ICONES = {
  licitacoes: '<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>',
  producao:   '<svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M5 20V10l7-5 7 5v10"/><path d="M9 20v-6h6v6"/><path d="M12 5V2"/></svg>',
  controle:   '<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/><circle cx="4" cy="8" r="1.5"/><circle cx="16" cy="10" r="1.5"/></svg>'
};

const SISTEMAS = [
  {
    nome: "Licitações",
    icone: "licitacoes",
    descricao: "Licitações do PNCP, interesse SIM/NÃO, atestados, garantias e resultados.",
    url: "https://engenharialm.github.io/licitacoes/",
    senha: null
  },
  {
    nome: "Produção",
    icone: "producao",
    descricao: "Programação semanal e diário de produção das obras, com exportação para Excel.",
    url: "https://engenharialm.github.io/diario-producao-lm/",
    senha: null
  },
  {
    nome: "Controle",
    icone: "controle",
    descricao: "Consolidado semanal de mão de obra e equipamentos por obra.",
    url: "https://engenharialm.github.io/controle-lm/",
    senha: null
  }
];

const reduz = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- relógio e saudação ---------- */
function tick(){
  const d = new Date();
  document.getElementById("clock").textContent = d.toLocaleTimeString("pt-BR");
}
tick(); setInterval(tick, 1000);
const h = new Date().getHours();
document.getElementById("saud").textContent = h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";

/* ---------- texto digitando ---------- */
const frases = ["Selecione o sistema que você quer acessar.", "Licitações · Produção · Controle", "Tudo da LM em um só lugar."];
const typed = document.getElementById("typed");
if (reduz) typed.textContent = frases[0];
else (function digitar(f = 0, i = 0, apagando = false){
  const s = frases[f];
  typed.textContent = s.slice(0, i);
  if (!apagando && i < s.length) return setTimeout(() => digitar(f, i + 1), 45);
  if (!apagando) return setTimeout(() => digitar(f, i, true), 2200);
  if (i > 0) return setTimeout(() => digitar(f, i - 1, true), 22);
  setTimeout(() => digitar((f + 1) % frases.length, 0), 300);
})();

/* ---------- cartões ---------- */
const grid = document.getElementById("grid");
SISTEMAS.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "card";
  b.style.animationDelay = (0.15 + i * 0.12) + "s";
  b.innerHTML =
    '<div class="inner">' +
      '<span class="num">0' + (i + 1) + '</span>' +
      '<div class="icon">' + ICONES[s.icone] + '</div>' +
      '<h2>' + s.nome + '</h2>' +
      '<p>' + s.descricao + '</p>' +
      '<div class="foot">' +
        '<span class="go">ACESSAR <i>→</i></span>' +
        (s.senha ? '<span class="tag lock">🔒 Restrito</span>' : '<span class="tag open">Livre</span>') +
      '</div>' +
    '</div>';
  b.addEventListener("click", e => abrir(i, e));
  if (!reduz) {
    b.addEventListener("mousemove", e => {
      const r = b.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      b.style.transform = "rotateY(" + ((x - .5) * 12) + "deg) rotateX(" + ((.5 - y) * 12) + "deg) translateY(-4px)";
      b.querySelector(".inner").style.setProperty("--mx", (x * 100) + "%");
      b.querySelector(".inner").style.setProperty("--my", (y * 100) + "%");
    });
    b.addEventListener("mouseleave", () => { b.style.transform = ""; });
  }
  grid.appendChild(b);
});

/* ---------- abrir sistema / senha ---------- */
const dlg = document.getElementById("dlg");
const pwd = document.getElementById("dlgPwd");
const err = document.getElementById("dlgErr");
let alvo = null, origem = null;

function liberado(i){
  try { return sessionStorage.getItem("portal-ok-" + i) === "1"; } catch (e) { return false; }
}

function ir(i){
  const w = document.getElementById("warp");
  const c = origem || { x: innerWidth / 2, y: innerHeight / 2 };
  w.style.setProperty("--wx", c.x + "px"); w.style.setProperty("--wy", c.y + "px");
  if (reduz) { location.href = SISTEMAS[i].url; return; }
  w.classList.add("on");
  setTimeout(() => { location.href = SISTEMAS[i].url; }, 500);
}

function abrir(i, e){
  const card = grid.children[i].getBoundingClientRect();
  origem = e && e.clientX ? { x: e.clientX, y: e.clientY } : { x: card.left + card.width / 2, y: card.top + card.height / 2 };
  const s = SISTEMAS[i];
  if (!s.senha || liberado(i)) { ir(i); return; }
  alvo = i;
  document.getElementById("dlgTitle").textContent = s.nome.toUpperCase() + " · ACESSO RESTRITO";
  pwd.value = ""; err.textContent = "";
  dlg.showModal(); pwd.focus();
}

document.getElementById("dlgForm").addEventListener("submit", e => {
  e.preventDefault();
  if (pwd.value === SISTEMAS[alvo].senha) {
    try { sessionStorage.setItem("portal-ok-" + alvo, "1"); } catch (e) {}
    dlg.close(); ir(alvo);
  } else {
    err.textContent = "Senha incorreta."; pwd.select();
    dlg.classList.remove("shake"); void dlg.offsetWidth; dlg.classList.add("shake");
  }
});
document.getElementById("dlgCancel").addEventListener("click", () => dlg.close());

addEventListener("keydown", e => {
  if (dlg.open || e.ctrlKey || e.altKey || e.metaKey) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= SISTEMAS.length) abrir(n - 1);
});

/* ---------- rede de partículas no fundo ---------- */
(function(){
  if (reduz) return;
  const cv = document.getElementById("net"), ctx = cv.getContext("2d");
  let W, H, pts = [], mouse = { x: -999, y: -999 };
  function size(){
    W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio;
    cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
    const n = Math.min(90, Math.floor(innerWidth * innerHeight / 16000));
    pts = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .35 * devicePixelRatio, vy: (Math.random() - .5) * .35 * devicePixelRatio }));
  }
  addEventListener("resize", size); size();
  addEventListener("mousemove", e => { mouse.x = e.clientX * devicePixelRatio; mouse.y = e.clientY * devicePixelRatio; });
  const L = 140 * devicePixelRatio;
  (function draw(){
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      const dm = Math.hypot(p.x - mouse.x, p.y - mouse.y);
      if (dm < L * 1.3) { p.x += (mouse.x - p.x) * .004; p.y += (mouse.y - p.y) * .004; }
      ctx.fillStyle = "rgba(61,242,255,.7)";
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.4 * devicePixelRatio, 0, 7); ctx.fill();
    }
    for (let a = 0; a < pts.length; a++) for (let b = a + 1; b < pts.length; b++) {
      const d = Math.hypot(pts[a].x - pts[b].x, pts[a].y - pts[b].y);
      if (d < L) {
        ctx.strokeStyle = "rgba(0,163,218," + (0.25 * (1 - d / L)) + ")";
        ctx.lineWidth = devicePixelRatio * .8;
        ctx.beginPath(); ctx.moveTo(pts[a].x, pts[a].y); ctx.lineTo(pts[b].x, pts[b].y); ctx.stroke();
      }
    }
    requestAnimationFrame(draw);
  })();
})();
</script>
</body>
</html>
